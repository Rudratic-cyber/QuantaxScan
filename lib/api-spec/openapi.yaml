                Key or parameter size as a string. Present only when the inventory actually
                determined it — never a guessed default (G-05).
            ellipticCurve:
              type: string
            mode:
              type: string
            padding:
              type: string
            cryptoFunctions:
              type: array
              items:
                type: string
        relatedCryptoMaterialProperties:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
            state:
              type: string
            size:
              type: integer
              description: Size in bits. Present only when determined.
        certificateProperties:
          type: object
          properties:
            subjectName:
              type: string
            issuerName:
              type: string
            serialNumber:
              type: string
            notValidBefore:
              type: string
            notValidAfter:
              type: string
        protocolProperties:
          type: object
          properties:
            type:
              type: string
            version:
              type: string
        oid:
          type: string
      required:
        - assetType

    CycloneDxComponent:
      type: object
      properties:
        type:
          type: string
        bom-ref:
          type: string
        name:
          type: string
        version:
          type: string
        description:
          type: string
        cryptoProperties:
          $ref: "#/components/schemas/CycloneDxCryptoProperties"
        evidence:
          type: object
          properties:
            occurrences:
              type: array
              items:
                $ref: "#/components/schemas/CycloneDxOccurrence"
        properties:
          type: array
          items:
            $ref: "#/components/schemas/CycloneDxProperty"
      required:
        - type
        - bom-ref
        - name

    CycloneDxDependency:
      type: object
      properties:
        ref:
          type: string
        dependsOn:
          type: array
          items:
            type: string
        provides:
          type: array
          items:
            type: string
      required:
        - ref

    TimelineScenarioCounts:
      type: object
      description: Assets breaching Mosca at this instant, one count per Q-Day scenario.
      additionalProperties:
        type: integer
    TimelinePointBase:
      type: object
      properties:
        at:
          type: string
          format: date-time
          description: For an observed point this is a real collection_runs timestamp, not a grid tick.
        assetsKnown: { type: integer }
        assetsPresent:
          type: integer
          description: Assets present and not yet gone at this instant. The number the verdicts are over.
        pqcAssets: { type: integer }
        hygieneAssets: { type: integer }
        unmappedAssets: { type: integer }
        breachedByScenario:
          $ref: "#/components/schemas/TimelineScenarioCounts"
      required:
        - at
        - assetsKnown
        - assetsPresent
        - pqcAssets
        - hygieneAssets
        - unmappedAssets
        - breachedByScenario
    ObservedPoint:
      allOf:
        - $ref: "#/components/schemas/TimelinePointBase"
        - type: object
          properties:
            kind: { type: string, enum: [observed] }
            collectionRunIds:
              type: array
              items: { type: integer }
            surfaces:
              type: array
              items: { type: string }
            assetsAdded: { type: integer }
          required: [kind, collectionRunIds, surfaces, assetsAdded]
    ProjectedPoint:
      allOf:
        - $ref: "#/components/schemas/TimelinePointBase"
        - type: object
          properties:
            kind: { type: string, enum: [projected] }
            year: { type: integer }
          required: [kind, year]
    ObservedHistory:
      type: object
      properties:
        sufficientForTrend:
          type: boolean
          description: False when fewer than two distinct collection instants exist. The client must draw no line.
        reason: { type: string }
        distinctCollectionInstants: { type: integer }
        observedSpanDays: { type: integer, nullable: true }
        firstObservedAt: { type: string, format: date-time, nullable: true }
        lastObservedAt: { type: string, format: date-time, nullable: true }
        completedRuns: { type: integer }
        failedRuns:
          type: integer
          description: A failed run places no point on the axis; it is reported here instead.
        points:
          type: array
          items: { $ref: "#/components/schemas/ObservedPoint" }
      required:
        - sufficientForTrend
        - reason
        - distinctCollectionInstants
        - observedSpanDays
        - firstObservedAt
        - lastObservedAt
        - completedRuns
        - failedRuns
        - points
    ProjectedHorizon:
      type: object
      properties:
        assumption:
          type: string
          description: What is held constant. Projections move because Z shrinks, not because the estate changed.
        basisAt: { type: string, format: date-time }
        points:
          type: array
          items: { $ref: "#/components/schemas/ProjectedPoint" }
      required: [assumption, basisAt, points]
    DeadlineMarker:
      type: object
      properties:
        id:
          type: string
          description: Keyed on framework + type + effective date + appliesTo + securityStrength.
        type: { type: string }
        label: { type: string }
        effect: { type: string }
        effectiveFrom: { type: string }
        year: { type: integer }
        inEffect: { type: boolean }
        appliesTo: { type: string, nullable: true }
        securityStrength: { type: string, nullable: true }
        framework: { type: string }
        frameworkName: { type: string, nullable: true }
        requirement: { type: string }
        citation: { $ref: "#/components/schemas/Citation" }
        confidence: { type: string }
        draftStatus: { type: string, nullable: true }
        algorithms:
          type: array
          items: { type: string }
        assets: { type: integer }
        caveats:
          type: array
          items: { type: string }
      required:
        - id
        - type
        - label
        - effect
        - effectiveFrom
        - year
        - inEffect
        - appliesTo
        - securityStrength
        - framework
        - frameworkName
        - requirement
        - citation
        - confidence
        - draftStatus
        - algorithms
        - assets
        - caveats
    EstateRollup:
      type: object
      properties:
        projects:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              assets: { type: integer }
              presentAssets: { type: integer }
            required: [id, name, assets, presentAssets]
        unassociatedAssets:
          type: integer
          description: Assets whose location carries no project prefix. Surfaces such as tls/certificate have no project.
        totalAssets: { type: integer }
        presentAssets: { type: integer }
      required: [projects, unassociatedAssets, totalAssets, presentAssets]
    PostureTimelineInputs:
      type: object
      properties:
        secrecyLifetime:
          type: object
          properties:
            bySource:
              type: object
              additionalProperties: { type: integer }
            assumedForAssets: { type: integer }
            bases:
              type: array
              items: { type: string }
          required: [bySource, assumedForAssets, bases]
        migrationYears:
          type: object
          properties:
            defaultValue: { type: number }
            assetsWithRecordedEffort: { type: integer }
            basis:
              type: string
              description: States plainly that Y is not measured yet, so a reader knows X vs Z decided the verdict.
          required: [defaultValue, assetsWithRecordedEffort, basis]
      required: [secrecyLifetime, migrationYears]
    CertificateExpiryOutlook:
      type: object
      description: >-
        G-22 / doc 06 Row 5 — how many certificates the estate currently holds are still valid on
        each Q-Day scenario. A narrow question that needs no assumption: will the trust anchored in
        this certificate's public-key algorithm still be in force on the day the certificate itself
        says it expires? This is not Mosca (`X + Y > Z`) — a certificate has no secrecy lifetime of
        its own.


        **Three buckets, and the third is the point.** A certificate whose `notAfter` is missing,
        sits on a non-certificate detail, or does not parse is `undetermined` — never folded into
        `expiresBeforeQDay`, which is the reassuring answer. Retired (`gone`) certificates are
        excluded, so this describes the estate as it is rather than everything it ever held.
      properties:
        certificates:
          type: integer
          description: Non-retired assets on the `certificate` surface. The denominator.
        withKnownExpiry:
          type: integer
          description: Of those, how many state a `notAfter` this could read.
        undetermined:
          type: integer
          description: >-
            Of those, how many do not. Counted rather than dropped — a certificate we cannot date
            is not a certificate that expires safely.
        perScenario:
          type: array
          items:
            type: object
            properties:
              scenario: { type: string }
              qDayYear: { type: integer }
              outlivesQDay:
                type: integer
                description: Certificates still valid on 1 January of `qDayYear` — the finding that matters.
              expiresBeforeQDay:
                type: integer
                description: Certificates replaced on their own renewal cycle before that date.
              undetermined:
                type: integer
                description: Repeated per scenario so a count is never read without knowing what it excludes.
            required: [scenario, qDayYear, outlivesQDay, expiresBeforeQDay, undetermined]
        caveat:
          type: string
          description: Shown on the page, not in a tooltip.
      required:
        - certificates
        - withKnownExpiry
        - undetermined
        - perScenario
        - caveat

    PostureTimeline:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        now: { type: string, format: date-time }
        framing:
          type: string
          description: Mandatory wherever a scenario year is shown — a Q-Day year is a scenario, not a forecast.
        scenarios:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              qDayYear: { type: integer }
              rationale: { type: string }
              confidence: { type: string }
            required: [name, qDayYear, rationale, confidence]
        estate: { $ref: "#/components/schemas/EstateRollup" }
        certificateExpiry: { $ref: "#/components/schemas/CertificateExpiryOutlook" }
        observed: { $ref: "#/components/schemas/ObservedHistory" }
        projected: { $ref: "#/components/schemas/ProjectedHorizon" }
        deadlines:
          type: array
          items: { $ref: "#/components/schemas/DeadlineMarker" }
        inputs: { $ref: "#/components/schemas/PostureTimelineInputs" }
        notCollected:
          type: array
          description: Facts a reader expects on a time-pressure panel that this product cannot produce, stated rather than omitted.
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              reason: { type: string }
            required: [id, label, reason]
      required:
        - generatedAt
        - now
        - framing
        - scenarios
        - estate
        - certificateExpiry
        - observed
        - projected
        - deadlines
        - inputs
        - notCollected
    CbomDocument:
      type: object
      description: >-
        A CycloneDX 1.7 CBOM. Schema conformance is proven against the vendored official
        schema in `@workspace/cbom`'s own suite; this documents the subset the builder emits
        and is not a substitute for that validation.
      properties:
        bomFormat:
          type: string
          enum: [CycloneDX]
        specVersion:
          type: string
          enum: ["1.7"]
        serialNumber:
          type: string
        version:
          type: integer
        metadata:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
            tools:
              type: object
              properties:
                components:
                  type: array
                  items:
                    $ref: "#/components/schemas/CycloneDxComponent"
              required:
                - components
            properties:
              type: array
              items:
                $ref: "#/components/schemas/CycloneDxProperty"
          required:
            - timestamp
            - tools
        components:
          type: array
          items:
            $ref: "#/components/schemas/CycloneDxComponent"
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/CycloneDxDependency"
      required:
        - bomFormat
        - specVersion
        - version
        - metadata
        - components
        - dependencies

    ReadinessSection:
      type: object
      description: >-
        One named part of the CISA/NSA/NIST factsheet. `state: "not-tracked"` means this
        product has no data source for the section at all (e.g. no roadmap-document
        attachment, no vendor register) — `percentComplete` is null in that case, never 0,
        because 0 would assert a measurement nobody took.
      properties:
        id:
          type: string
          enum: [roadmap, cryptographic-inventory, prioritisation, vendor-engagement, supply-chain]
        label:
          type: string
        definition:
          type: string
          description: What "complete" means for this section, stated plainly rather than left implicit.
        state:
          type: string
          enum: [tracked, not-tracked]
        percentComplete:
          type: integer
          nullable: true
        numerator:
          type: integer
          nullable: true
        denominator:
          type: integer
          nullable: true
        reason:
          type: string
      required:
        - id
        - label
        - definition
        - state
        - percentComplete
        - numerator
        - denominator
        - reason

    ReadinessSummary:
      type: object
      description: >-
        D1 Row 1 plus the estate coverage meter (Row 3) it is partly defined against, in one
        payload so the two cannot disagree. Deliberately carries no combined/overall
        readiness score — averaging a measured section with an untracked one would invent a
        denominator, and that is the one number a buyer would screenshot and nobody could
        defend.
      properties:
        generatedAt:
          type: string
          format: date-time
        framing:
          type: string
          description: >-
            States the factsheet's name and date. The factsheet is organised into named
            sections, not a numbered stage sequence — this must never read as a CISA-authored
            numbering.
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessSection"
        coverage:
          $ref: "#/components/schemas/EstateCoverage"
      required:
        - generatedAt
        - framing
        - sections
        - coverage

    EstateCoverage:
      type: object
      description: >-
        The same shape and the same honesty rules as `ProjectCoverage` (D3's per-project
        meter), computed over the whole organisation instead of one project — reusing
        `summariseProjectCoverage` verbatim, since its output never depended on a project
        scope in the first place. No `projectId`: the whole point is that it is not one.
      properties:
        examinedSurfaces:
          type: integer
        totalSurfaces:
          type: integer
        surfaces:
          type: array
          items:
            $ref: "#/components/schemas/SurfaceCoverage"
        confidence:
          $ref: "#/components/schemas/ConfidenceSummary"
      required:
        - examinedSurfaces
        - totalSurfaces
        - surfaces
        - confidence

    InventoryMoscaSummary:
      type: object
      description: >-
        Reuses the same exported Mosca primitives `PostureTimeline` scores its estate-wide
        series with, so the two panels cannot disagree about what "breached" means.
      properties:
        x:
          type: number
          description: Secrecy lifetime in years, as resolved through A3 (asset → project → product default).
        y:
          type: number
          description: Migration time in years, from effort hours. Zero across the board until effort estimation ships.
        xAssumed:
          type: boolean
          description: True when X was defaulted rather than supplied at the asset or project level.
        applicable:
          type: boolean
          description: False when the algorithm carries no quantum-vulnerable track — nothing for Q-Day to break.
        breachedScenarios:
          type: array
          items:
            type: string
          description: Q-Day scenario names this asset breaches under. Empty when not applicable.
      required:
        - x
        - y
        - xAssumed
        - applicable
        - breachedScenarios

    EnrichedInventoryAsset:
      type: object
      properties:
        id:
          type: integer
        fingerprint:
          type: string
        projectId:
          type: integer
          nullable: true
          description: Null for a surface with no project association (TLS, certificate, KMS).
        surface:
          type: string
        algorithm:
          type: string
        keySize:
          type: integer
          nullable: true
        location:
          type: string
        status:
          type: string
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        ownerId:
          type: integer
          nullable: true
        dataClassification:
          type: string
          nullable: true
        secrecyLifetimeYears:
          type: integer
          nullable: true
        effortHours:
          type: number
          nullable: true
          description: >-
            Migration effort somebody recorded against **this** asset, in hours. Null means nobody
            did — no collector writes it today — and it is deliberately not defaulted, for the same
            reason `keySize` is not: a report has to be able to say that an effort figure came from
            the algorithm's class average rather than from an estimate made for this asset.
            `mosca.y` is this value converted to calendar years, so a null here and a `y` of 0 are
            the same fact seen twice.
        classificationSource:
          type: string
          enum: [asset, project, default]
          description: Where the classification behind `mosca.x` actually came from.
        latestConfidence:
          type: number
          nullable: true
          description: Most recent observation's confidence. Null when the asset has never been observed.
        compliance:
          allOf:
            - $ref: "#/components/schemas/FindingCompliance"
          nullable: true
          description: Null when the mapping data has no entry for this algorithm.
        waiver:
          allOf:
            - $ref: "#/components/schemas/ActiveWaiver"
          nullable: true
          description: >-
            C8 — the active waiver on this asset, or null. **An annotation and nothing more.**
            The asset appears here whether or not it is waived, and `mosca`, `compliance`,
            `status`, `statusCounts` and every coverage and readiness figure are computed with no
            knowledge that this field exists. A client may fold a waived row out of a working
            list; nothing may use it to make the estate read as smaller or cleaner. Null the
            instant the waiver expires — there is no cached "waived" flag to go stale.
        mosca:
          $ref: "#/components/schemas/InventoryMoscaSummary"
      required:
        - id
        - fingerprint
        - projectId
        - surface
        - algorithm
        - keySize
        - location
        - status
        - firstSeen
        - lastSeen
        - ownerId
        - dataClassification
        - secrecyLifetimeYears
        - effortHours
        - classificationSource
        - latestConfidence
        - compliance
        - waiver
        - mosca

    InventoryAssetsSummary:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        assets:
          type: array
          items:
            $ref: "#/components/schemas/EnrichedInventoryAsset"
        statusCounts:
          type: object
          additionalProperties:
            type: integer
          description: >-
            Every asset status in the organisation, `gone` included — so drift can be
            reported without a removed asset ever appearing in `assets` as if still present.
            Unaffected by waivers: a waived asset counts once, under the status it actually has.
        waivedAssets:
          type: integer
          description: >-
            C8 — how many of the assets listed above carry an active waiver. A count *beside* the
            inventory, never subtracted from it. A rising figure is a governance signal, and
            hiding it would be the same mistake as hiding the assets.
        scenarios:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              qDayYear: { type: integer }
              rationale: { type: string }
              confidence: { type: string }
            required: [name, qDayYear, rationale, confidence]
        framing:
          type: string
          description: Mandatory wherever a scenario year is shown.
      required:
        - generatedAt
        - assets
        - statusCounts
        - waivedAssets
        - scenarios
        - framing

    ActiveWaiver:
      type: object
      description: >-
        C8 — the waiver currently in force on an asset, as attached to an inventory row. When an
        asset has collected several, this is the active one that runs longest, so an
        about-to-lapse waiver cannot hide a fresh one and produce a finding re-appearing on a day
        nobody chose.
      properties:
        id:
          type: integer
        justification:
          type: string
        signedOffBy:
          type: string
          description: Who accepted the risk, as stated by the caller who wrote the waiver.
        attribution:
          type: string
          enum: [authenticated, asserted]
          description: >-
            Whether the platform verified the name in `signedOffBy` (`authenticated` — a
            signed-in user wrote the row) or is only repeating it (`asserted` — the shared API
            key, which has no person behind it). Reported rather than hidden: calling an
            assertion a signature is the same mistake as storing a resolved obligation on a row.
        signedOffAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        daysRemaining:
          type: integer
          description: Never recomputed by the client from `expiresAt` and a local clock.
      required:
        - id
        - justification
        - signedOffBy
        - attribution
        - signedOffAt
        - expiresAt
        - daysRemaining

    Waiver:
      type: object
      description: A register entry. `status` is computed on read, never stored.
      properties:
        id:
          type: integer
        assetId:
          type: integer
        divisionId:
          type: integer
          nullable: true
          description: >-
            Copied from the asset at sign-off, never taken from the caller. A waiver whose
            division disagreed with its asset's would be visible to people who cannot see what it
            waives.
        justification:
          type: string
        signedOffBy:
          type: string
        attribution:
          type: string
          enum: [authenticated, asserted]
        signedOffAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, expired, revoked]
          description: >-
            `revoked` beats `expired`: a waiver revoked in March and due to expire in June was
            revoked, and reporting "expired" in July would misstate why it stopped applying. Only
            `active` suppresses anything.
        daysRemaining:
          type: integer
          description: Negative once expired.
        asset:
          allOf:
            - $ref: "#/components/schemas/WaiverAsset"
          nullable: true
          description: >-
            The asset this waiver names, so the register reads as a list of accepted risks rather
            than a list of integers. Present on `GET /waivers` only.
      required:
        - id
        - assetId
        - divisionId
        - justification
        - signedOffBy
        - attribution
        - signedOffAt
        - expiresAt
        - revokedAt
        - status
        - daysRemaining

    WaiverAsset:
      type: object
      properties:
        id: { type: integer }
        fingerprint: { type: string }
        surface: { type: string }
        algorithm: { type: string }
        location: { type: string }
        status: { type: string }
      required: [id, fingerprint, surface, algorithm, location, status]

    WaiverRegister:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        waivers:
          type: array
          items:
            $ref: "#/components/schemas/Waiver"
        counts:
          type: object
          description: Over the whole register, never over a `?status=` slice.
          properties:
            active: { type: integer }
            expired: { type: integer }
            revoked: { type: integer }
          required: [active, expired, revoked]
      required:
        - generatedAt
        - waivers
        - counts

    CreateWaiverBody:
      type: object
      properties:
        assetId:
          type: integer
          description: The asset whose risk is being accepted. Confirmed visible inside the tenant scope.
        justification:
          type: string
          maxLength: 4000
          description: >-
            Why the risk was accepted. Required and non-empty — a risk accepted for no stated
            reason has not been accepted, it has been ignored.
        signedOffBy:
          type: string
          description: >-
            Who accepted it. Required — a waiver attributed to nobody is an anonymous
            suppression. See `attribution` for whether the platform verified this name.
        expiresAt:
          type: string
          format: date-time
          description: >-
            When it stops being a waiver. Required, must be in the future, and at most 730 days
            away. There is no "never": a waiver that does not expire is not an exception, it is a
            silent edit to the inventory.
      required:
        - assetId
        - justification
        - signedOffBy
        - expiresAt

    SubmitProjectCertificatesBody:
      type: object
      properties:
        files:
          type: array
          description: >-
            Certificate files. `content` is PEM text (one or more concatenated certificate
            blocks) or base64-encoded DER. Anything else is ignored rather than rejected, so a
            caller may submit a whole tree.
          items:
            type: object
            properties:
              path:
                type: string
              content:
                type: string
            required:
              - path
              - content
      required:
        - files

    CertificateQDayVerdict:
      type: object
      description: >-
        Whether one certificate's `notAfter` falls on or after one Q-Day scenario's year.
        Derived at read time from `lib/risk`'s scenario set — never persisted, since the
        scenario years are customer-overridable.
      properties:
        scenario:
          type: string
          enum: [conservative, central, aggressive]
        qDayYear:
          type: integer
        rationale:
          type: string
        confidence:
          type: string
          enum: [verified, needs-check]
        outlivesQDay:
          type: boolean
      required:
        - scenario
        - qDayYear
        - rationale
        - confidence
        - outlivesQDay

    CertificateIngestEntry:
      type: object
      description: One certificate this submission parsed, with its Q-Day comparison.
      properties:
        location:
          type: string
        algorithm:
          type: string
        keySize:
          type: integer
          nullable: true
        issuer:
          type: string
        serialNumber:
          type: string
        subject:
          type: string
          nullable: true
        notBefore:
          type: string
          format: date-time
        notAfter:
          type: string
          format: date-time
        signatureAlgorithm:
          type: string
          nullable: true
        qDay:
          type: array
          items:
            $ref: "#/components/schemas/CertificateQDayVerdict"
      required:
        - location
        - algorithm
        - keySize
        - issuer
        - serialNumber
        - subject
        - notBefore
        - notAfter
        - signatureAlgorithm
        - qDay

    CertificateIngestSummary:
      type: object
      properties:
        projectId:
          type: integer
        certificatesRecognised:
          type: integer
          description: >-
            How many certificates the collector could actually parse. Zero means no collection
            run was recorded and the certificate surface is still un-examined for this project.
        certificateFiles:
          type: array
          description: The submitted files that carried at least one parseable certificate, and how many.
          items:
            type: object
            properties:
              path:
                type: string
              certificateCount:
                type: integer
            required:
              - path
              - certificateCount
        collectionRunId:
          type: integer
          nullable: true
          description: Null when no run was recorded (`certificatesRecognised` is 0).
        assetsCreated:
          type: integer
        assetsUpdated:
          type: integer
        observationsCreated:
          type: integer
        assetsMarkedGone:
          type: integer
          description: >-
            Always 0 in practice today: a certificate's identity is its own issuer+serial, not a
            shared slot, so an omitted certificate is never inferred as retired by a later
            submission — see the reobservation-scope note in `asset-ingest.ts`.
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/CertificateIngestEntry"
        evidenceCaveat:
          type: string
      required:
        - projectId
        - certificatesRecognised
        - certificateFiles
        - collectionRunId
        - assetsCreated
        - assetsUpdated
        - observationsCreated
        - assetsMarkedGone
        - certificates
        - evidenceCaveat

    ProjectCertificateAsset:
      type: object
      description: A persisted certificate asset, with its Q-Day comparison evaluated fresh on this read.
      properties:
        assetId:
          type: integer
        algorithm:
          type: string
        keySize:
          type: integer
          nullable: true
        status:
          type: string
          enum: [active, remediated, waived, gone]
        issuer:
          type: string
        serialNumber:
          type: string
        subject:
          type: string
          nullable: true
        notBefore:
          type: string
          format: date-time
        notAfter:
          type: string
          format: date-time
        signatureAlgorithm:
          type: string
          nullable: true
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        qDay:
          type: array
          items:
            $ref: "#/components/schemas/CertificateQDayVerdict"
      required:
        - assetId
        - algorithm
        - keySize
        - status
        - issuer
        - serialNumber
        - subject
        - notBefore
        - notAfter
        - signatureAlgorithm
        - firstSeen
        - lastSeen
        - qDay

    ProjectCertificates:
      type: object
      properties:
        projectId:
          type: integer
        generatedAt:
          type: string
          format: date-time
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/ProjectCertificateAsset"
      required:
        - projectId
        - generatedAt
        - certificates

    SubmitProjectTlsBody:
      type: object
      properties:
        targets:
          type: array
          description: >-
            Hosts to open a real TLS connection to. A caller-named host that resolves to a
            loopback/private/link-local/other non-routable address is refused before any
            connection is attempted — see `TlsProbeSummary.targets[].outcome`.
          maxItems: 20
          items:
            type: object
            properties:
              host:
                type: string
                description: Hostname or IP literal. Never a URL — no scheme, path or credentials.
              port:
                type: integer
                minimum: 1
                maximum: 65535
            required:
              - host
              - port
      required:
        - targets

    TlsProbeSummary:
      type: object
      properties:
        projectId:
          type: integer
        targetsSubmitted:
          type: integer
        targetsProbed:
          type: integer
          description: >-
            How many targets completed a handshake. Zero means no collection run was recorded
            and the tls surface is still un-examined for this project.
        targets:
          type: array
          description: The per-target outcome — a submission of five hosts where three are refused and one times out must not collapse into a single number.
          items:
            type: object
            properties:
              host:
                type: string
              port:
                type: integer
              outcome:
                type: string
                description: >-
                  `refused` means the SSRF guard rejected the target before any connection was
                  attempted; `unreachable` means the guard allowed it but the handshake did not
                  complete (timeout, connection refused, TLS negotiation failure); `probed` means
                  a handshake completed. The specific refusal reason is deliberately not exposed
                  here — see `tls-ssrf-guard.ts` — the same posture `parseGithubUrl` takes with a
                  bare rejection.
                enum: [probed, refused, unreachable]
            required:
              - host
              - port
              - outcome
        collectionRunId:
          type: integer
          nullable: true
          description: Null when no run was recorded (`targetsProbed` is 0).
        assetsCreated:
          type: integer
        assetsUpdated:
          type: integer
        observationsCreated:
          type: integer
        assetsMarkedGone:
          type: integer
          description: >-
            Assets at a host:port this submission actually probed and no longer found there.
            Scoped to exactly the targets that completed a handshake in this submission.
        evidenceCaveat:
          type: string
          description: >-
            Stated in every response: this collector records the negotiated key-exchange
            algorithm/group and the peer certificate's public key type/size only — no
            certificate identity, chain or validity. It does not verify trust (certificates are
            not validated against any CA), because the point is to observe what a host actually
            negotiates, not whether a browser would accept it.
      required:
        - projectId
        - targetsSubmitted
        - targetsProbed
        - targets
        - collectionRunId
        - assetsCreated
        - assetsUpdated
        - observationsCreated
        - assetsMarkedGone
        - evidenceCaveat

    SubmitProjectProtocolConfigBody:
      type: object
      properties:
        files:
          type: array
          description: >-
            Configuration files, submitted as path + content — the same shape
            `POST /projects/{id}/dependencies` and `POST /projects/{id}/certificates` use. The
            path matters: the SSH and IPsec families are recognised by basename, so
            `/etc/ssh/sshd_config` is read and a copy renamed `sshd_config.bak.txt` is not.
            Anything unrecognised is ignored rather than rejected, so a caller may submit a
            whole tree.
          items:
            type: object
            properties:
              path:
                type: string
              content:
                type: string
            required:
              - path
              - content
      required:
        - files

    ProtocolConfigDeclaration:
      type: object
      description: One algorithm a configuration file declares, read verbatim from a named directive.
      properties:
        path:
          type: string
        format:
          type: string
          description: >-
            Which configuration format the file was read as — `sshd-config`, `ssh-config`,
            `authorized-keys`, `ipsec-config`, `jwks`, `oidc-discovery`, `saml-metadata`.
        directive:
          type: string
          description: The keyword or field the token was written under, e.g. `KexAlgorithms`, `alg`, `SignatureMethod`, `esp`.
        declaredValue:
          type: string
          description: The token exactly as the file wrote it, so a reader can go back to the line and check.
        algorithm:
          type: string
          description: Canonical name, resolving in the mappings data. A token with no canonical name produces no declaration at all.
        keySize:
          type: integer
          nullable: true
          description: >-
            The stated parameter size where the token names one (a curve, a MODP group, an AES
            width, a JWK modulus). Null means undetermined — an `ssh-rsa` authorized_keys entry
            does not state its modulus and this collector does not decode the blob to guess one.
        strength:
          type: string
          enum: [permitted, materialised]
          description: >-
            `permitted` — an algorithm the endpoint would accept if a peer asked, which it may
            never select. `materialised` — a specific key or a chosen algorithm that exists now.
            Priced into `confidence`, but reported separately because they are different claims.
        condition:
          type: string
          nullable: true
          description: The enclosing `Match`/`Host` block. Null when the directive applies unconditionally.
        confidence:
          type: number
          description: 0.6 for a permitted declaration, 0.8 for a materialised one — both well below an observed TLS handshake's 1.0.
      required:
        - path
        - format
        - directive
        - declaredValue
        - algorithm
        - keySize
        - strength
        - condition
        - confidence

    ProtocolConfigIngestSummary:
      type: object
      properties:
        projectId:
          type: integer
        configFilesRecognised:
          type: integer
          description: >-
            How many submitted files were a protocol configuration this collector understands.
            Zero means no collection run was recorded and the config surface is still
            un-examined for this project. A recognised file that declares nothing still counts
            here — it was examined.
        configFiles:
          type: array
          description: >-
            The recognised files, each with how many declarations it carried. A
            `declarationCount` of 0 is read-and-states-nothing, not unreadable.
          items:
            type: object
            properties:
              path:
                type: string
              format:
                type: string
              declarationCount:
                type: integer
            required:
              - path
              - format
              - declarationCount
        collectionRunId:
          type: integer
          nullable: true
          description: Null when no run was recorded (`configFilesRecognised` is 0).
        assetsCreated:
          type: integer
        assetsUpdated:
          type: integer
        observationsCreated:
          type: integer
        assetsMarkedGone:
          type: integer
          description: >-
            Declarations previously read from one of the files in this submission and no longer
            present in it — an administrator removed the directive. Scoped to exactly the files
            this submission read, so a file that was not submitted is untouched.
        declarations:
          type: array
          items:
            $ref: "#/components/schemas/ProtocolConfigDeclaration"
        evidenceCaveat:
          type: string
          description: >-
            Stated on every response: this collector reads what a configuration file declares,
            not what an endpoint negotiates; `Include` directives are not followed; the absence
            of a directive is not read as the compiled-in default; and an unrecognised token,
            including hybrid post-quantum key exchange, contributes nothing rather than a guess.
      required:
        - projectId
        - configFilesRecognised
        - configFiles
        - collectionRunId
        - assetsCreated
        - assetsUpdated
        - observationsCreated
        - assetsMarkedGone
        - declarations
        - evidenceCaveat

    VendorPqcRoadmapStatus:
      type: string
      description: >-
        How the vendor answered "do you have a post-quantum migration plan?". `none` is an
        answer — the vendor told us it has no plan. Not the same as `null`, which means the
        vendor has told us nothing.
      enum: [none, assessing, roadmap_published, migration_underway, pqc_available]

    VendorContractClause:
      type: string
      description: >-
        Whether the contract in force with this vendor obliges them to migrate. There is
        deliberately no `unknown` member: unknown is `null` on the stored column, i.e. nobody has
        read the contract. `absent` means somebody read it and there is no clause — a finding.
      enum: [present, absent, in_negotiation]

    VendorClauseState:
      type: string
      description: >-
        The four-state read of `contractPqcClause`. `unknown` is the null case promoted to a
        first-class value so a client cannot render "nobody has read the contract" as "there is
        no clause" — the two point in opposite directions and both are wrong to guess.
      enum: [present, absent, in_negotiation, unknown]

    VendorResponseState:
      type: string
      description: >-
        How much of the questionnaire the vendor has actually answered, derived from the answers
        themselves rather than from `respondedAt`, so a row cannot claim a response it does not
        contain. Only the vendor's own three answers count — the customer's contract filing does
        not make an unresponsive vendor look like it replied.
      enum: [awaiting_response, partial, answered]

    VendorReadinessState:
      type: string
      description: >-
        Exposure under one Q-Day scenario, against the date the vendor *claims*. `unknown` when
        no date was given — never `clear`.
      enum: [exposed, clear, unknown]

    VendorAttestation:
      type: object
      description: The provenance stamp that keeps a vendor's claim from being read as an observation (B9).
      properties:
        discoveryModality:
          type: string
          enum: [manual_attestation]
          description: >-
            Always `manual_attestation` — the SP 1800-38B §4.1.4 extension this project added for
            exactly this case. Nothing on this surface is observed.
        confidence:
          type: number
          nullable: true
          description: >-
            Below every collector's, and `null` rather than a floor value when the vendor has
            answered nothing at all: no claim exists, so there is nothing to be confident about.
            The scale's anchors are documented on `RawObservation.confidence` — regex is about
            0.7, a completed TLS handshake about 1.0.
        caveat:
          type: string
          description: The sentence a report must carry alongside any use of this vendor's answers.
      required:
        - discoveryModality
        - confidence
        - caveat

    VendorReadinessVerdict:
      type: object
      description: One Q-Day scenario's verdict against the date the vendor claims it will be post-quantum ready.
      properties:
        scenario:
          type: string
          enum: [conservative, central, aggressive]
        qDayYear:
          type: integer
        state:
          $ref: "#/components/schemas/VendorReadinessState"
        narrative:
          type: string
          description: >-
            Written in the vendor's voice ("the vendor states"), never the product's, so a board
            deck built from these sentences cannot launder a claim into a finding.
      required:
        - scenario
        - qDayYear
        - state
        - narrative

    VendorClauseAssessment:
      type: object
      description: >-
        The contractual lever — the only instrument a customer actually has over a vendor that is
        not moving.
      properties:
        state:
          $ref: "#/components/schemas/VendorClauseState"
        contractRenewalDate:
          type: string
          format: date-time
          nullable: true
        noLeverScheduled:
          type: boolean
          description: >-
            True only when a clause is known to be *missing* and no renewal is scheduled — no
            obligation, and no scheduled moment at which one could be created. False when the
            contract has merely not been read, because that is not a claim about the contract.
        narrative:
          type: string
      required:
        - state
        - contractRenewalDate
        - noLeverScheduled
        - narrative

    VendorPostureAssessment:
      type: object
      description: >-
        B9's payoff, computed fresh on every read so a corrected date or a revised Q-Day scenario
        needs no backfill. A vendor that has answered nothing is `awaiting_response` with a
        `null` confidence and an `unknown` verdict under every scenario — never `clear`.
      properties:
        responseState:
          $ref: "#/components/schemas/VendorResponseState"
        answeredQuestionCount:
          type: integer
        questionCount:
          type: integer
        respondedAt:
          type: string
          format: date-time
          nullable: true
        pqcRoadmapStatus:
          allOf:
            - $ref: "#/components/schemas/VendorPqcRoadmapStatus"
          nullable: true
        statedPqcReadyDate:
          type: string
          format: date-time
          nullable: true
        attestation:
          $ref: "#/components/schemas/VendorAttestation"
        verdicts:
          type: array
          items:
            $ref: "#/components/schemas/VendorReadinessVerdict"
        exposedScenarioCount:
          type: integer
        unknownScenarioCount:
          type: integer
        scenarioCount:
          type: integer
        clause:
          $ref: "#/components/schemas/VendorClauseAssessment"
        framing:
          type: string
          description: Mandatory framing for any customer-facing use of the scenario years.
      required:
        - responseState
        - answeredQuestionCount
        - questionCount
        - respondedAt
        - pqcRoadmapStatus
        - statedPqcReadyDate
        - attestation
        - verdicts
        - exposedScenarioCount
        - unknownScenarioCount
        - scenarioCount
        - clause
        - framing

    VendorAssessment:
      type: object
      description: >-
        A `vendor_assessments` row plus its computed posture — B9, the vendor/third-party
        register. docs/Claude/03-features.md §B9. Not an `Asset`: nothing here was collected, and
        a questionnaire answer is a claim by an interested party rather than an observation, so
        it carries no `fingerprint`/`surface`/observation lifecycle and does not count towards
        the D3 coverage meter.
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        vendorName:
          type: string
        productOrService:
          type: string
          nullable: true
        internalOwner:
          type: string
          nullable: true
          description: Free text — the internal team or person who owns the relationship, not necessarily an app user.
        questionnaireSentAt:
          type: string
          format: date-time
          nullable: true
          description: Null means the questionnaire has not been sent — a different state from sent and ignored.
        respondedAt:
          type: string
          format: date-time
          nullable: true
        pqcRoadmapStatus:
          allOf:
            - $ref: "#/components/schemas/VendorPqcRoadmapStatus"
          nullable: true
        statedPqcReadyDate:
          type: string
          format: date-time
          nullable: true
          description: The date the vendor *states* it will be post-quantum ready. A quote, not a verified commitment.
        cryptoDisclosed:
          type: string
          nullable: true
          description: Free-form, vendor-asserted description of the cryptography they use.
        contractPqcClause:
          allOf:
            - $ref: "#/components/schemas/VendorContractClause"
          nullable: true
          description: >-
            `absent` = the contract was read and has no PQC clause. `null` = nobody has read it.
            Rendering the second as the first invents a finding.
        contractRenewalDate:
          type: string
          format: date-time
          nullable: true
        attestationEvidence:
          type: string
          nullable: true
          description: Where the answers are recorded — a document reference, ticket or URL. Not fetched or validated.
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        posture:
          $ref: "#/components/schemas/VendorPostureAssessment"
      required:
        - id
        - organizationId
        - vendorName
        - productOrService
        - internalOwner
        - questionnaireSentAt
        - respondedAt
        - pqcRoadmapStatus
        - statedPqcReadyDate
        - cryptoDisclosed
        - contractPqcClause
        - contractRenewalDate
        - attestationEvidence
        - notes
        - createdAt
        - updatedAt
        - posture

    CreateVendorAssessmentBody:
      type: object
      properties:
        vendorName:
          type: string
        productOrService:
          type: string
        internalOwner:
          type: string
        questionnaireSentAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
        pqcRoadmapStatus:
          $ref: "#/components/schemas/VendorPqcRoadmapStatus"
        statedPqcReadyDate:
          type: string
          format: date-time
        cryptoDisclosed:
          type: string
        contractPqcClause:
          $ref: "#/components/schemas/VendorContractClause"
        contractRenewalDate:
          type: string
          format: date-time
        attestationEvidence:
          type: string
        notes:
          type: string
      required:
        - vendorName

    UpdateVendorAssessmentBody:
      type: object
      description: >-
        Every field optional; only fields present in the body are changed. An explicit null
        clears a field back to "not supplied".
      properties:
        vendorName:
          type: string
        productOrService:
          type: string
          nullable: true
        internalOwner:
          type: string
          nullable: true
        questionnaireSentAt:
          type: string
          format: date-time
          nullable: true
        respondedAt:
          type: string
          format: date-time
          nullable: true
        pqcRoadmapStatus:
          allOf:
            - $ref: "#/components/schemas/VendorPqcRoadmapStatus"
          nullable: true
        statedPqcReadyDate:
          type: string
          format: date-time
          nullable: true
        cryptoDisclosed:
          type: string
          nullable: true
        contractPqcClause:
          allOf:
            - $ref: "#/components/schemas/VendorContractClause"
          nullable: true
        contractRenewalDate:
          type: string
          format: date-time
          nullable: true
        attestationEvidence:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    DiscoverCloudResourcesBody:
      type: object
      description: >-
        Which stored credential to redeem, and which AWS account to enumerate. No secret is
        ever sent to this route.
      properties:
        credentialId:
          type: integer
          description: A credential of kind `cloud_readonly_inventory`, registered through `POST /credentials`.
        account:
          type: string
          minLength: 1
          maxLength: 64
          description: The AWS account id the credential belongs to.
        maxTargets:
          type: integer
          minimum: 1
          maximum: 500
          description: >-
            Ceiling on leads recorded. Reaching it marks the run `partial` and sets
            `enumeration.truncated` — a run that withheld names has not enumerated the account
            and does not say it has.
      required: [credentialId, account]
    CloudDiscoverySummary:
      type: object
      description: >-
        The result of one credentialed enumeration. **No asset is created by this route** —
        discovery produces leads, which are places a collector could look, and a lead is not
        an observation of cryptography. Every surface still reads `never-examined` afterwards.
      properties:
        projectId: { type: integer }
        discoveryRunId:
          type: integer
          description: >-
            The `discovery_runs` row this enumeration recorded. Written whatever happened,
            including a total failure — an enumeration that produced nothing and one that never
            ran are different facts, and only a row can tell them apart.
        status:
          type: string
          enum: [succeeded, partial, no_evidence, failed]
          description: >-
            `partial` is the value that matters and the normal outcome of a cloud enumeration.
            A run that read two of three accounts is neither a success nor a failure, and
            collapsing it into either destroys the boundary of what can be spoken for.
            `no_evidence` means it ran correctly and found nothing, which is not a failure.
        targetsCreated:
          type: integer
          description: Leads this run recorded for the first time.
        targetsUpdated:
          type: integer
          description: Leads already on record that this run saw again. A lead that stops appearing is not deleted.
        enumeration:
          $ref: "#/components/schemas/EnumerationRecord"
        evidenceCaveat:
          $ref: "#/components/schemas/DiscoveryMethodCaveat"
      required: [projectId, discoveryRunId, status, targetsCreated, targetsUpdated, enumeration, evidenceCaveat]
    DiscoveryMethodCaveat:
      type: object
      description: >-
        What a target from this method does and does not prove — resolved on read from the
        method, never stored, because a claim written into a row is a claim that cannot be
        corrected.
      properties:
        ownership:
          type: string
          description: What a target from this method establishes about ownership.
        completeness:
          type: string
          description: The exact boundary this method can speak for. Never the estate.
      required: [ownership, completeness]
    PollProjectKmsBody:
      type: object
      description: >-
        Which stored credential to redeem, and which AWS account and regions to enumerate.
        No secret is ever sent to this route — only the id of a credential already registered
        through `POST /credentials`.
      properties:
        credentialId:
          type: integer
          description: >-
            A credential of kind `cloud_kms_readonly`, registered through `POST /credentials`.
            A credential of any other kind, belonging to another organisation, or revoked or
            expired, is refused — a credential is never sent to the wrong third party because
            an id happened to resolve.
        account:
          type: string
          minLength: 1
          maxLength: 64
          description: The AWS account id the credential belongs to, as it appears in a key ARN.
        regions:
          type: array
          minItems: 1
          maxItems: 20
          description: >-
            The regions to enumerate. There is deliberately no "all regions" option: a region
            this product invented and enumerated would be a scope the customer never authorised,
            and a region that was never called must not be reported as empty. Each region is
            enumerated and reported separately, because a partial result is the normal case.
          items:
            type: string
            pattern: "^[a-z]{2}(-[a-z]+){1,2}-[0-9]$"
        maxKeys:
          type: integer
          minimum: 1
          maximum: 500
          default: 500
          description: >-
            Ceiling on keys read across all regions. Reaching it sets `enumeration.truncated`,
            which withdraws this run's right to retire anything — a truncated run has not seen
            every key and must not claim to have.
      required: [credentialId, account, regions]
    KmsPollSummary:
      type: object
      description: >-
        The result of one credentialed poll, including the boundary of what it can speak for.
      properties:
        projectId: { type: integer }
        keysRead:
          type: integer
          description: Keys read from the provider across every region that answered.
        keysObserved:
          type: integer
          description: Of those, how many resolved to an algorithm this product reports on.
        keysUnclassified: { type: integer }
        keys:
          type: array
          items:
            $ref: "#/components/schemas/KmsKeyOutcome"
        collectionRunId:
          type: integer
          nullable: true
          description: Null when the poll read no keys at all — there is nothing to record a run against.
        assetsCreated: { type: integer }
        assetsUpdated: { type: integer }
        observationsCreated: { type: integer }
        assetsMarkedGone:
          type: integer
          description: >-
            Keys previously on record, absent from this poll, and inside a region this run
            enumerated completely. **Always 0 unless the run earned a prefix scope** — see
            `reconciliation`. A run that was truncated or had any region refused retires
            nothing, because a throttled page is indistinguishable from an empty one.
        enumeration:
          $ref: "#/components/schemas/EnumerationRecord"
        reconciliation:
          type: string
          description: >-
            One sentence stating whether this run was allowed to retire keys, and why. Present
            in the body rather than left to be derived from `enumeration`, for the same reason
            `evidenceCaveat` is: a caveat a client has to reconstruct is a caveat that will be
            missing from the one report that matters.
        evidenceCaveat: { type: string }
      required:
        - projectId
        - keysRead
        - keysObserved
        - keysUnclassified
        - keys
        - collectionRunId
        - assetsCreated
        - assetsUpdated
        - observationsCreated
        - assetsMarkedGone
        - enumeration
        - reconciliation
        - evidenceCaveat
    EnumerationRecord:
      type: object
      description: >-
        What a run could and could not speak for. Absent from a submission response entirely —
        a submission makes no enumeration claim, and an empty record would instead claim a
        successful enumeration that found nothing.
      properties:
        enumerated:
          type: array
          description: Scopes read to exhaustion with no error. The only thing that earns a claim of coverage.
          items:
            $ref: "#/components/schemas/EnumeratedScope"
        refused:
          type: array
          description: >-
            Scopes attempted and not completed. `reason` comes from a closed vocabulary and is
            never a cloud SDK's error text, which routinely embeds the request that failed.
          items:
            $ref: "#/components/schemas/RefusedScope"
        truncated:
          type: boolean
          description: A pagination or safety ceiling was hit. Reported, never silent.
        credentialId:
          type: integer
          description: Which stored credential this run redeemed. Never the credential itself.
      required: [enumerated, refused, truncated]
    DiscoveryScope:
      type: object
      description: What was searched, in a shape that can hold a question larger than a domain.
      properties:
        kind:
          type: string
          enum: [domain, cloud_account, directory, issuer]
        domain: { type: string }
        provider: { type: string }
        account: { type: string }
        region: { type: string }
        service: { type: string }
        directory: { type: string }
        issuer: { type: string }
      required: [kind]
    EnumeratedScope:
      type: object
      properties:
        scope:
          $ref: "#/components/schemas/DiscoveryScope"
        complete:
          type: boolean
          enum: [true]
          description: Always true. A scope that is not complete belongs in `refused`.
      required: [scope, complete]
    RefusedScope:
      type: object
      properties:
        scope:
          $ref: "#/components/schemas/DiscoveryScope"
        reason:
          type: string
          enum: [access-denied, throttled, unauthenticated, unsupported, unreachable, timeout]
        detail:
          type: string
          description: Free text for a human. Never parsed, never grouped by, never a substitute for `reason`.
      required: [scope, reason]
    SubmitProjectKmsBody:
      type: object
      properties:
        keys:
          type: array
          description: >-
            The key inventory your own key store already produced — the output of
            `aws kms describe-key`, `az keyvault key show`, `gcloud kms keys list` or
            `vault read transit/keys/<name>`, transcribed into these fields. No credential
            for the key store ever reaches this product.


            Every field beyond `provider` and `keyId` is optional because every field beyond
            those is optional in those exports: `aws kms list-keys` returns identifiers only,
            and Azure Key Vault's list operation returns `kid` and `attributes` with no key
            type at all. An omitted field means "the export did not state this" and is never
            substituted for — `rotationEnabled` in particular is left absent rather than sent
            as `false`, because "not stated" and "not rotated" are different claims.
          maxItems: 500
          items:
            type: object
            properties:
              provider:
                type: string
                description: Which key store this key lives in.
                enum: [aws-kms, azure-key-vault, gcp-kms, hashicorp-vault]
              keyId:
                type: string
                description: >-
                  ARN, resource name, `kid` URL, or mount-qualified key name — whatever the
                  provider calls the key's identity. Together with `provider` this is the
                  asset's identity; an alias is deliberately not used, since an alias can be
                  repointed at a different key.
              keySpec:
                type: string
                description: >-
                  The provider-native spec string: AWS `KeySpec`, GCP `CryptoKeyVersion.algorithm`,
                  Azure `kty`, Vault `type`. Matched case-insensitively against
                  `docs/Claude/mappings/kms-key-specs.json`. Omit it and the key is recorded as
                  present and unclassified rather than guessed at.
              curve:
                type: string
                description: Curve name where the provider states it separately from the spec — Azure's `crv`. Resolved through the shared named-curve table.
              keySize:
                type: integer
                description: >-
                  A key size your export has and the spec does not state (Azure's Create Key
                  `key_size`). Used only when neither the key spec nor a curve supplies one, so
                  it cannot override a size the provider's documentation states.
              alias:
                type: string
              keyState:
                type: string
                description: The provider's own lifecycle word (`Enabled`, `PendingDeletion`, `DESTROYED`), recorded verbatim and never mapped onto the asset's lifecycle status.
              rotationEnabled:
                type: boolean
              rotationPeriodDays:
                type: integer
                minimum: 1
              lastRotatedAt:
                type: string
                format: date-time
              origin:
                type: string
              region:
                type: string
              keyStore:
                type: string
                description: The containing vault, key ring or mount path.
            required:
              - provider
              - keyId
      required:
        - keys

    KmsKeyOutcome:
      type: object
      description: >-
        What the collector concluded about one submitted key. The four `outcome` values are
        deliberately not collapsed into "classified / skipped": only one of the three
        non-observed values is actionable, and hiding which is which would hide it.
      properties:
        provider:
          type: string
        keyId:
          type: string
        keySpec:
          type: string
          nullable: true
        alias:
          type: string
          nullable: true
        keyState:
          type: string
          nullable: true
        outcome:
          type: string
          description: >-
            `observed` — the spec resolved to an algorithm this product reports on, and an
            asset was written. `no-algorithm` — the spec is known and its primitive is not one
            `algorithms.json` catalogues (HMAC, ChaCha20-Poly1305, SM2, any post-quantum
            parameter set, Azure's `kty: oct`); the key is real, counted and examined, and
            there is nothing to report about it. `unrecognised-spec` — the provider stated a
            spec the curated table does not have, which means our data is behind the provider
            and is the one outcome a data update fixes. `no-spec` — the entry named a key and
            stated nothing about it, the expected shape of a list-without-describe export.
          enum: [observed, no-algorithm, unrecognised-spec, no-spec]
        reason:
          type: string
          nullable: true
          description: Why no observation was produced, verbatim from the curated table where the table has an opinion. Null for `observed`.
        algorithm:
          type: string
          nullable: true
          description: Null for every outcome except `observed`.
        keySize:
          type: integer
          nullable: true
          description: >-
            The size the provider states for this key. **Null means the provider stated none**
            — an Azure JsonWebKey carries no `key_size` member at all — never a default. G-05.
        keySizeSource:
          type: string
          nullable: true
          description: >-
            Which of four sources supplied `keySize`, so a reader never has to guess: the key
            spec's documented size, a named curve, a value you submitted, or none of them.
          enum: [key-spec, curve, submitted, not-supplied]
        rotationEnabled:
          type: boolean
          nullable: true
          description: Null when the submitted export did not state it. Not the same as `false`.
        location:
          type: string
          nullable: true
          description: The asset locator this key was written under. Null when no asset was written.
      required:
        - provider
        - keyId
        - keySpec
        - alias
        - keyState
        - outcome
        - reason
        - algorithm
        - keySize
        - keySizeSource
        - rotationEnabled
        - location

    KmsIngestSummary:
      type: object
      properties:
        projectId:
          type: integer
        keysSubmitted:
          type: integer
        keysObserved:
          type: integer
          description: How many submitted keys resolved to an algorithm this product reports on and became assets.
        keysUnclassified:
          type: integer
          description: >-
            Submitted keys that produced no observation, for any of the three non-`observed`
            reasons. This being non-zero while `collectionRunId` is set is the normal and
            correct state for a key store holding symmetric or post-quantum keys — the surface
            was examined, and nothing reportable was in it.
        keys:
          type: array
          items:
            $ref: "#/components/schemas/KmsKeyOutcome"
        collectionRunId:
          type: integer
          nullable: true
          description: >-
            Null only when the submission carried no key entries at all. A submission whose
            keys all came back unclassified DOES record a run — that is an examination that
            found nothing, not an absent examination, and the D3 meter must be able to tell
            them apart.
        assetsCreated:
          type: integer
        assetsUpdated:
          type: integer
        observationsCreated:
          type: integer
        assetsMarkedGone:
          type: integer
          description: >-
            Always 0 in practice today. A submitted export is never assumed to be a complete
            enumeration of a key store — one page of a paginated `list-keys`, one region or
            one Vault mount is the normal case — so a key absent from a later submission is
            not inferred to have been deleted. See the reobservation-scope note in
            `asset-ingest.ts`.
        evidenceCaveat:
          type: string
      required:
        - projectId
        - keysSubmitted
        - keysObserved
        - keysUnclassified
        - keys
        - collectionRunId
        - assetsCreated
        - assetsUpdated
        - observationsCreated
        - assetsMarkedGone
        - evidenceCaveat

    ProjectKmsKey:
      type: object
      description: A persisted KMS key asset, as the inventory read returns it.
      properties:
        assetId:
          type: integer
        provider:
          type: string
        keyId:
          type: string
        keySpec:
          type: string
          nullable: true
        alias:
          type: string
          nullable: true
        keyState:
          type: string
          nullable: true
        algorithm:
          type: string
        keySize:
          type: integer
          nullable: true
          description: Null when the provider stated no size. Never a default — G-05.
        status:
          type: string
          enum: [active, remediated, waived, gone]
        rotationEnabled:
          type: boolean
          nullable: true
          description: Null when the submitted export did not state it, which is a different fact from rotation being off.
        rotationPeriodDays:
          type: integer
          nullable: true
        lastRotatedAt:
          type: string
          format: date-time
          nullable: true
        origin:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        keyStore:
          type: string
          nullable: true
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
      required:
        - assetId
        - provider
        - keyId
        - keySpec
        - alias
        - keyState
        - algorithm
        - keySize
        - status
        - rotationEnabled
        - rotationPeriodDays
        - lastRotatedAt
        - origin
        - region
        - keyStore
        - firstSeen
        - lastSeen

    ProjectKmsKeys:
      type: object
      properties:
        projectId:
          type: integer
        generatedAt:
          type: string
          format: date-time
        keys:
          type: array
          items:
            $ref: "#/components/schemas/ProjectKmsKey"
      required:
        - projectId
        - generatedAt
        - keys

    DataAtRestCryptoSubmission:
      type: object
      description: >-
        One reported cryptographic setting. Every field is optional because every field is
        genuinely often unreported, and an unreported field must stay unreported — see the
        `cipher-not-reported` gap reason.
      properties:
        algorithm:
          type: string
          nullable: true
          description: >-
            As the caller's tooling reports it — `AES-256-CBC`, `aes256`, `RSA-2048`, `ECDH`.
            Canonicalised on the way in; the original string is kept on the asset's
            `locationDetail.reportedAlgorithm` so the canonicalisation stays auditable. A string
            that resolves to no entry in the standards data records nothing and is returned as
            an `algorithm-not-recognised` gap.
        keySize:
          type: integer
          nullable: true
          description: >-
            The stated parameter size, when the caller supplies one separately. Wins over any
            size parsed out of `algorithm`. Bare `AES` yields no key size at all rather than an
            assumed 256 (G-05).
        source:
          type: string
          nullable: true
          description: >-
            Free text, e.g. `aws-kms`, `pkcs11-hsm`, `software-keystore`, `passphrase`. Recorded
            as evidence, never parsed into a verdict.

    DataAtRestStoreSubmission:
      type: object
      properties:
        storeId:
          type: string
          description: >-
            The caller's stable identifier for this store — an instance/database name, a bucket
            ARN, a backup job name. Part of the asset identity, so changing it orphans the
            previous asset and creates a new one.
        engine:
          type: string
          description: Engine or product, e.g. `postgresql`, `mssql`, `oracle`, `s3`, `veeam`. Part of the asset identity.
        storeKind:
          type: string
          enum: [database, backup, archive, volume, object-store, other]
          description: Grouping and presentation only — deliberately not part of the asset identity.
        encryptionState:
          type: string
          enum: [encrypted, not-encrypted, unknown]
          description: >-
            `unknown` (the default when omitted) is not a synonym for `not-encrypted`: one means
            nobody has checked, the other means someone checked and there is none. Only the
            second is a statement this route reconciles against, so only the second can mark a
            previously recorded cipher `gone`.
        evidenceSource:
          type: string
          enum: [configuration-report, attestation]
          description: >-
            Drives the discovery modality and the confidence recorded on the observation:
            `configuration-report` reads a real setting (0.6, `configuration_information`),
            `attestation` is a human's statement with no artefact behind it (0.4,
            `manual_attestation`). Defaults to `attestation`, the weaker of the two, so an
            unstated evidence source understates rather than overstates what is known.
        description:
          type: string
          description: Free text for the report, e.g. "nightly full backups, 7-year retention".
        dataEncryption:
          $ref: "#/components/schemas/DataAtRestCryptoSubmission"
        keyProtection:
          $ref: "#/components/schemas/DataAtRestCryptoSubmission"
        dataClassification:
          type: string
          enum: [public, internal, confidential, regulated, indefinite]
          description: >-
            A3's classification for the data *in* this store, persisted on both of its assets.
            Omit it and X is inherited from the project, then from the product default, and the
            read below reports it as assumed. Omitting it on a resubmission leaves a previously
            supplied value in place rather than clearing it.
        secrecyLifetimeYears:
          type: integer
          minimum: 0
          description: X in years, overriding the preset implied by `dataClassification`.
      required:
        - storeId
        - engine

    SubmitProjectDataAtRestBody:
      type: object
      properties:
        stores:
          type: array
          items:
            $ref: "#/components/schemas/DataAtRestStoreSubmission"
      required:
        - stores

    DataAtRestGap:
      type: object
      description: >-
        Something this submission did not say, reported rather than filled in. The whole reason
        this surface earns its keep is being able to tell a CISO which of their long-lived
        ciphertext they actually know something about.
      properties:
        role:
          type: string
          enum: [data-encryption, key-protection]
        reason:
          type: string
          enum:
            - encryption-state-unknown
            - cipher-not-reported
            - key-protection-not-reported
            - algorithm-not-recognised
        reported:
          type: string
          nullable: true
          description: The string the caller supplied, present only for `algorithm-not-recognised`.
      required:
        - role
        - reason
        - reported

    DataAtRestRecordedCrypto:
      type: object
      description: One crypto fact this submission actually recorded for a store.
      properties:
        role:
          type: string
          enum: [data-encryption, key-protection]
        algorithm:
          type: string
          description: The canonical name, which is what the standards data is resolved against.
        keySize:
          type: integer
          nullable: true
        reportedAlgorithm:
          type: string
          description: The caller's original string, kept so the canonicalisation can be audited.
        location:
          type: string
      required:
        - role
        - algorithm
        - keySize
        - reportedAlgorithm
        - location

    DataAtRestStoreResult:
      type: object
      properties:
        storeId:
          type: string
        engine:
          type: string
        recorded:
          type: array
          items:
            $ref: "#/components/schemas/DataAtRestRecordedCrypto"
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/DataAtRestGap"
      required:
        - storeId
        - engine
        - recorded
        - gaps

    DataAtRestIngestSummary:
      type: object
      properties:
        projectId:
          type: integer
        storesSubmitted:
          type: integer
        storesWithRecordedCrypto:
          type: integer
          description: >-
            How many submitted stores produced at least one asset. The difference between this
            and `storesSubmitted` is the honest measure of how much of the estate was described
            rather than merely listed — every shortfall is itemised in `stores[].gaps`.
        collectionRunId:
          type: integer
          nullable: true
          description: >-
            Null when the submission said nothing reconcilable about any store (every store
            `unknown`, or every crypto field blank), in which case no run is recorded and the
            surface stays un-examined for this project. A submission of stores that are all
            `not-encrypted` DOES record a run: that is a real examination with a real result.
        assetsCreated:
          type: integer
        assetsUpdated:
          type: integer
        observationsCreated:
          type: integer
        assetsMarkedGone:
          type: integer
          description: >-
            Assets at a store slot this submission made a statement about and no longer found
            there — a rekey, or encryption turned off. Never a store whose cipher field was
            simply left blank.
        stores:
          type: array
          items:
            $ref: "#/components/schemas/DataAtRestStoreResult"
        evidenceCaveat:
          type: string
      required:
        - projectId
        - storesSubmitted
        - storesWithRecordedCrypto
        - collectionRunId
        - assetsCreated
        - assetsUpdated
        - observationsCreated
        - assetsMarkedGone
        - stores
        - evidenceCaveat

    DataAtRestMosca:
      type: object
      properties:
        x:
          type: number
          description: Secrecy lifetime in years, as resolved for this asset.
        y:
          type: number
          description: Migration time in years.
        applicable:
          type: boolean
          description: False when the algorithm carries no quantum-vulnerable track — nothing for Q-Day to break.
        breachedScenarios:
          type: array
          items:
            type: string
      required:
        - x
        - y
        - applicable
        - breachedScenarios

    DataAtRestComponent:
      type: object
      description: One persisted data-at-rest asset, with its Mosca verdict derived at read time.
      properties:
        assetId:
          type: integer
        role:
          type: string
          enum: [data-encryption, key-protection]
        algorithm:
          type: string
        keySize:
          type: integer
          nullable: true
        reportedAlgorithm:
          type: string
        keySource:
          type: string
          nullable: true
        status:
          type: string
          description: Lifecycle status. `gone`/`remediated`/`waived` assets are included — a record of what was found must keep them.
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        quantumVulnerable:
          type: boolean
          nullable: true
          description: >-
            From the standards data, null when it has no entry for this algorithm. False for the
            bulk cipher of a typical TDE'd store — which is exactly why `key-protection` is
            recorded separately rather than folded into one verdict per store.
        mosca:
          $ref: "#/components/schemas/DataAtRestMosca"
      required:
        - assetId
        - role
        - algorithm
        - keySize
        - reportedAlgorithm
        - keySource
        - status
        - firstSeen
        - lastSeen
        - quantumVulnerable
        - mosca

    ProjectDataAtRestStore:
      type: object
      properties:
        storeId:
          type: string
        engine:
          type: string
        storeKind:
          type: string
        encryptionState:
          type: string
        description:
          type: string
          nullable: true
        dataClassification:
          type: string
          nullable: true
          description: What was supplied for this store. Null means nobody classified it — see `classificationSource`.
        secrecyLifetimeYears:
          type: integer
          nullable: true
        classificationSource:
          type: string
          enum: [asset, project, default]
          description: >-
            Where the classification *label* came from — the same meaning this field carries on
            `GET /inventory/assets`. Never re-derived by the client. It is not always the
            provenance of X: a store may supply `secrecyLifetimeYears` without a label, in which
            case the years are asset-supplied while the label is still inherited. Read `xAssumed`
            for X's own provenance.
        xAssumed:
          type: boolean
          description: >-
            True whenever X was not supplied for this store, whatever the label's provenance.
            Reports must say so.
        secrecyLifetimeBasis:
          type: string
          description: One report-ready sentence stating the provenance of X in plain English.
        components:
          type: array
          items:
            $ref: "#/components/schemas/DataAtRestComponent"
      required:
        - storeId
        - engine
        - storeKind
        - encryptionState
        - description
        - dataClassification
        - secrecyLifetimeYears
        - classificationSource
        - xAssumed
        - secrecyLifetimeBasis
        - components

    ProjectDataAtRest:
      type: object
      properties:
        projectId:
          type: integer
        generatedAt:
          type: string
          format: date-time
        stores:
          type: array
          items:
            $ref: "#/components/schemas/ProjectDataAtRestStore"
        scenarios:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              qDayYear: { type: integer }
              rationale: { type: string }
              confidence: { type: string }
            required: [name, qDayYear, rationale, confidence]
        framing:
          type: string
          description: Mandatory wherever a scenario year is shown.
      required:
        - projectId
        - generatedAt
        - stores
        - scenarios
        - framing

    CredentialKind:
      type: string
      enum:
        - cloud_kms_readonly
        - database_readonly
        - secrets_manager_token
        - idp_client_secret
        - cloud_readonly_inventory
        - fleet_directory_readonly
      description: >-
        What a stored credential is *for* (F4). Each value names a consumer that could
        not ship until the credential store existed. `kind` is not decoration: a redemption whose
        kind does not match the stored row is refused, so a bug cannot send the identity
        provider's client secret to a cloud KMS. There is deliberately no `generic` member.


        `cloud_readonly_inventory` is separate from `cloud_kms_readonly` even though both are
        "an AWS key": one lists key metadata in a single service, the other walks an account's
        resources across services, and a customer scoping an IAM policy must be able to grant
        one without the other.


        **This list must equal `CREDENTIAL_KIND_VALUES` in `lib/db/src/schema/credentials.ts`.**
        Stage 0 widened that tuple and did not widen this enum, which made both new kinds
        unregisterable over HTTP while every unit test passed — the database accepted them and
        no request could carry one. Caught by the e2e suite, which is the only thing that
        exercises the generated client against the real route.

    CredentialStatus:
      type: string
      enum: [active, expired, revoked]
      description: >-
        Derived on read, never stored: `revoked` when the material has been destroyed, `expired`
        when the customer told us the third-party credential expires and that instant has passed,
        `active` otherwise. A credential with no `expiresAt` reads `active` because the customer
        did not say when it expires — never because it does not.

    Credential:
      type: object
      description: >-
        A stored third-party credential, as a client may see it (F4). **There is no secret field
        and no route that can produce one.** The secret exists only as AES-256-GCM ciphertext in
        the database and as a disposable handle inside a collector's callback; see
        `lib/db/src/credentials.ts` for what that encryption does and does not protect against.
        There is also deliberately no hash, length, prefix or last-four of the plaintext anywhere
        in the schema, because each would be an oracle an attacker with a database dump could test
        guesses against.
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        name:
          type: string
          description: The customer's label, unique within the organisation.
        kind:
          $ref: "#/components/schemas/CredentialKind"
        description:
          type: string
          nullable: true
          description: Free text — which account, tenant or endpoint it belongs to. Never the secret.
        keyId:
          type: string
          nullable: true
          description: >-
            Which `QUANTAXSCAN_CREDENTIAL_KEYS` entry encrypted this row. Not secret; an operator
            reads it to see which rows still need re-encrypting after a rotation. Null once
            revoked, along with the material itself.
        status:
          $ref: "#/components/schemas/CredentialStatus"
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the *third-party* credential expires, as the customer told us. Null means they
            did not say — never "does not expire".
        revokedAt:
          type: string
          format: date-time
          nullable: true
        lastRedeemedAt:
          type: string
          format: date-time
          nullable: true
        redemptionCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdByUserId:
          type: string
          nullable: true
          description: >-
            Null for the shared API key, which has no person behind it. Populated once per-user
            sign-in (F1) lands; a default here would manufacture an attribution that does not
            exist.
      required:
        - id
        - organizationId
        - name
        - kind
        - description
        - keyId
        - status
        - expiresAt
        - revokedAt
        - lastRedeemedAt
        - redemptionCount
        - createdAt
        - createdByUserId

    CreateCredentialBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/CredentialKind"
        secret:
          type: string
          minLength: 1
          description: >-
            The credential itself. Sent once, encrypted immediately, and never returned by any
            route. It must be the narrowest read-only credential that does the job
            (docs/Claude/08-security.md §"Least privilege for collectors") — this product never
            needs write access to a customer's key store.
        description:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the third-party credential expires, if the customer knows. Omit rather than
            guessing: a wrong expiry makes a working credential unusable, and a fabricated one
            makes an expired credential look live.
      required:
        - name
        - kind
        - secret

    # ── D8 — asset and host discovery ──────────────────────────────────────
    # Appended as one block. A discovered name is a lead, never an asset: no
    # schema here has an `algorithm`, a `keySize` or a `surface`, because
    # discovery examines nothing.

    RunProjectDiscoveryBody:
      type: object
      properties:
        domain:
          type: string
          description: >-
            The registered domain to search, e.g. `example.com`. Lowercased and
            root-dot-stripped; anything that is not a well-formed multi-label hostname (a
            wildcard, a URL, an IP literal, a single label) is a 400. Names are then matched
            against it at a **label boundary**, so `notexample.com` is never claimed.
      required:
        - domain

    CtCertificateEvidence:
      type: object
      description: >-
        The certificate-transparency record a discovered name came from. Every field is
        nullable and nothing is defaulted: a log entry that states no issuer yields `null`,
        never a placeholder that would read as a value somebody recorded.
      properties:
        entryId:
          type: integer
          nullable: true
          description: The log entry's id at the source, so a reader can reopen the exact record.
        issuerName:
          type: string
          nullable: true
          description: The CA, verbatim as the log states it. Deliberately unparsed.
        serialNumber:
          type: string
          nullable: true
        notBefore:
          type: string
          format: date-time
          nullable: true
        notAfter:
          type: string
          format: date-time
          nullable: true
          description: >-
            Null means the log stated no validity window, which is "we cannot tell", not
            "not expired".
        loggedAt:
          type: string
          format: date-time
          nullable: true
        rawName:
          type: string
          description: The exact string the entry carried, before normalisation, so belief can be audited against evidence.
      required:
        - entryId
        - issuerName
        - serialNumber
        - notBefore
        - notAfter
        - loggedAt
        - rawName

    RejectedCtName:
      type: object
      properties:
        rawName:
          type: string
        reason:
          type: string
          description: >-
            `wildcard` — `*.example.com` covers a set of names and is evidence for none of
            them. `out-of-scope` — a syntactically fine name that is genuinely somebody
            else's, matched at a label boundary. `ip-literal` — a real target but not a
            name, and this method discovers names. `not-a-hostname` — malformed.
          enum: [wildcard, out-of-scope, ip-literal, not-a-hostname]
      required:
        - rawName
        - reason

    DiscoveryDnsSummary:
      type: object
      description: >-
        DNS is corroboration, not enumeration. `undetermined` is the load-bearing value: a
        resolver that timed out or returned SERVFAIL has told us nothing, and recording that
        as `notResolved` would be a fabricated negative — which makes a real host vanish from
        an inventory.
      properties:
        checked:
          type: integer
        resolved:
          type: integer
        notResolved:
          type: integer
          description: An authoritative NXDOMAIN from both address families. Nothing weaker counts.
        undetermined:
          type: integer
        notChecked:
          type: integer
          description: Names no lookup was attempted for — a fourth state, stored as null.
      required:
        - checked
        - resolved
        - notResolved
        - undetermined
        - notChecked

    DiscoveryCoverage:
      type: object
      description: >-
        D8's contribution to D3. **Not estate coverage**: certificate transparency only
        reveals names given a publicly logged certificate, so a host with no certificate is
        invisible to this method and absent from `knownTargets` entirely.
      properties:
        knownTargets:
          type: integer
        examinedTargets:
          type: integer
          description: Derived on read from `assets.location`, never stored.
        unexaminedTargets:
          type: integer
        basis:
          type: string
          description: Stated in the payload so a report quotes the basis rather than inventing one.
      required:
        - knownTargets
        - examinedTargets
        - unexaminedTargets
        - basis

    DiscoveredTarget:
      type: object
      properties:
        id:
          type: integer
        hostname:
          type: string
        sourceDomain:
          type: string
          description: The domain the customer asked us to search, kept so a name's scope claim can be re-checked against the question that produced it.
        discoveryMethod:
          type: string
          enum: [certificate_transparency]
        evidence:
          $ref: "#/components/schemas/CtCertificateEvidence"
        certificateExpired:
          type: boolean
          nullable: true
          description: >-
            Derived on read from `evidence.notAfter`, never stored. Null when the log stated
            no validity window — "cannot tell", not "not expired".
        dnsResolution:
          type: string
          nullable: true
          enum: [resolved, not-resolved, undetermined]
          description: Null means no lookup was ever attempted, a fourth state distinct from all three values.
        resolvedAddresses:
          type: array
          nullable: true
          items:
            type: string
        dnsCheckedAt:
          type: string
          format: date-time
          nullable: true
        firstDiscoveredAt:
          type: string
          format: date-time
        lastDiscoveredAt:
          type: string
          format: date-time
          description: >-
            A name that stops appearing in the log is neither deleted nor marked gone — CT is
            append-only, so a name leaving a query result says something about the query, not
            about the estate. The row stays and this ages.
        examined:
          type: boolean
          description: Whether any collector has examined this name. Derived from `assets.location`, never stored.
        examinedPorts:
          type: array
          items:
            type: integer
      required:
        - id
        - hostname
        - sourceDomain
        - discoveryMethod
        - evidence
        - certificateExpired
        - dnsResolution
        - resolvedAddresses
        - dnsCheckedAt
        - firstDiscoveredAt
        - lastDiscoveredAt
        - examined
        - examinedPorts

    DiscoveryRunSummary:
      type: object
      properties:
        projectId:
          type: integer
        domain:
          type: string
        entriesRead:
          type: integer
          description: Certificate-transparency log entries the source returned.
        namesRead:
          type: integer
          description: Distinct names across those entries, accepted or not. The gap between this and `targets` is the filtering, made visible.
        namesAccepted:
          type: integer
        truncated:
          type: boolean
          description: >-
            True when the per-run ceiling was hit and the accepted list is therefore
            incomplete. Reported rather than silent: quietly trimming 4,000 names to 500
            would make "we know of N endpoints" a lie in the one number this feature exists
            to make honest.
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/RejectedCtName"
        targetsCreated:
          type: integer
        targetsUpdated:
          type: integer
        knownTargets:
          type: integer
          description: Total discovered names for this project after the run.
        dns:
          $ref: "#/components/schemas/DiscoveryDnsSummary"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveredTarget"
        evidenceCaveat:
          type: string
          description: What the evidence supports, in the payload rather than the documentation.
      required:
        - projectId
        - domain
        - entriesRead
        - namesRead
        - namesAccepted
        - truncated
        - rejected
        - targetsCreated
        - targetsUpdated
        - knownTargets
        - dns
        - targets
        - evidenceCaveat

    ProjectDiscoveredTargets:
      type: object
      properties:
        projectId:
          type: integer
        generatedAt:
          type: string
          format: date-time
        coverage:
          $ref: "#/components/schemas/DiscoveryCoverage"
        dns:
          $ref: "#/components/schemas/DiscoveryDnsSummary"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveredTarget"
        evidenceCaveat:
          type: string
      required:
        - projectId
        - generatedAt
        - coverage
        - dns
        - targets
        - evidenceCaveat

    ProbeDiscoveredTargetsBody:
      type: object
      properties:
        targetIds:
          type: array
          description: >-
            The discovered targets to probe, named explicitly. There is no "probe everything"
            shortcut: discovery finding a host is not consent to connect to it.
          maxItems: 20
          items:
            type: integer
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: >-
            Required, with no default. A discovered name carries no port, and defaulting to
            443 would be this server guessing which machine to open a socket to.
      required:
        - targetIds
        - port

    DiscoveredTargetProbeSummary:
      type: object
      description: >-
        B3's `TlsProbeSummary` plus what this route resolved. The collector, assets,
        observations and collection run are B3's, unchanged.
      properties:
        projectId:
          type: integer
        targetIdsRequested:
          type: integer
        targetIdsNotFound:
          type: array
          description: Ids that are not a discovered target of this project, or belong to another organisation. Indistinguishable on purpose.
          items:
            type: integer
        targetsSubmitted:
          type: integer
        targetsProbed:
          type: integer
          description: Zero means no collection run was recorded and the tls surface is still un-examined.
        targets:
          type: array
          items:
            type: object
            properties:
              host:
                type: string
              port:
                type: integer
              outcome:
                type: string
                enum: [probed, refused, unreachable]
            required:
              - host
              - port
              - outcome
        collectionRunId:
          type: integer
          nullable: true
        assetsCreated:
          type: integer
        assetsUpdated:
          type: integer
        observationsCreated:
          type: integer
        assetsMarkedGone:
          type: integer
          description: >-
            Scoped to exactly the targets that completed a handshake. A target that timed out
            was not observed and must not have its prior assets retired — that would be a
            silent false remediation.
        evidenceCaveat:
          type: string
      required:
        - projectId
        - targetIdsRequested
        - targetIdsNotFound
        - targetsSubmitted
        - targetsProbed
        - targets
        - collectionRunId
        - assetsCreated
        - assetsUpdated
        - observationsCreated
        - assetsMarkedGone
        - evidenceCaveat

    NetworkFlowEndpointSubmission:
      type: object
      description: >-
        One end of a conversation. Every field is optional because every record format
        carries a different subset — but at least one of `workload`, `hostname` or
        `address` must be present, or the record is rejected as unidentified rather than
        recorded against a guess.
      properties:
        address:
          type: string
          nullable: true
          description: IP address, v4 or v6, verbatim.
        hostname:
          type: string
          nullable: true
        workload:
          type: string
          nullable: true
          description: >-
            Service/workload name, as a mesh telemetry export names the peer. Preferred as
            the endpoint's identity because it survives a redeploy that renumbers pod IPs;
            hostname is the second choice and address the third.
        port:
          type: integer
          nullable: true
          minimum: 0
          maximum: 65535
          description: >-
            Required on the destination — it is the service. Accepted and then **discarded**
            on the source: an ephemeral port changes on every connection, and keying a
            conversation on it would create a new row per TCP handshake.

    NetworkFlowRecordSubmission:
      type: object
      properties:
        source:
          $ref: "#/components/schemas/NetworkFlowEndpointSubmission"
        destination:
          $ref: "#/components/schemas/NetworkFlowEndpointSubmission"
        transport:
          type: string
          enum: [tcp, udp, other]
          description: >-
            Defaults to `tcp`. Part of the conversation's identity: 443/tcp and 443/udp are
            different services protected by different machinery.
        applicationProtocol:
          type: string
          nullable: true
          description: >-
            The record's own field — `https`, `h2`, `grpc`. Recorded as evidence. Never
            derived from the port, and never used to infer cryptography.
        recordFormat:
          type: string
          enum: [vpc-flow-log, load-balancer-access-log, service-mesh-telemetry, firewall-session-log, other]
          description: >-
            Which export this row came from. Evidence and caveat only, deliberately not part
            of any identity — one conversation legitimately appears in two formats.
        tlsVersion:
          type: string
          nullable: true
          description: >-
            e.g. `TLSv1.2`. Recorded as evidence; on its own it produces no asset, because a
            protocol version is not an algorithm.
        cipherSuite:
          type: string
          nullable: true
          description: >-
            The negotiated suite, IANA (`TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256`) or OpenSSL
            (`ECDHE-RSA-AES128-GCM-SHA256`) spelling. Absent in most flow-log formats, and
            that absence is recorded as `undetermined` rather than filled in.
        recordCount:
          type: integer
          minimum: 1
          nullable: true
          description: How many raw records this row stands for, when the caller has pre-aggregated. Defaults to 1.
        observedAt:
          type: string
          nullable: true
          description: The record's own timestamp, ISO 8601. Evidence only, never identity.
      required:
        - source
        - destination

    SubmitProjectNetworkFlowsBody:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/NetworkFlowRecordSubmission"
      required:
        - records

    NetworkFlowGap:
      type: object
      description: Something the evidence did not state, reported rather than filled in.
      properties:
        reason:
          type: string
          enum:
            - cipher-suite-not-reported
            - cipher-suite-not-recognised
            - cipher-suite-component-not-resolved
        component:
          type: string
          nullable: true
          enum:
            - key-exchange-not-named
            - authentication-not-named
            - bulk-cipher-not-recognised
            - bulk-cipher-none
            - suite-name-not-recognised
          description: >-
            The suite parser's own reason. `key-exchange-not-named` on a TLS 1.3 suite is the
            normal case, not a defect: the name does not carry one.
        reported:
          type: string
          nullable: true
          description: The suite string the caller supplied, when there was one.
      required:
        - reason
        - component
        - reported

    NetworkFlowRejection:
      type: object
      description: A submitted record that could not be read as a conversation. Reported back, never silently dropped.
      properties:
        index:
          type: integer
          description: Position in the submitted `records` array.
        reason:
          type: string
          enum: [destination-not-identified, destination-port-missing, source-not-identified]
      required:
        - index
        - reason

    NetworkFlowCryptography:
      type: object
      description: One piece of cryptography recorded at a conversation's destination service endpoint.
      properties:
        assetId:
          type: integer
          nullable: true
          description: Null on the POST response, which reports what was collected before the asset ids are joined back.
        role:
          type: string
          enum: [key-exchange, authentication, bulk-cipher]
          description: >-
            Which part of the session this is. Part of the asset identity, because one suite
            name can state the same algorithm twice — `TLS_RSA_WITH_AES_256_CBC_SHA` names RSA
            as both the key exchange and the authentication, and they are remediated separately.
        algorithm:
          type: string
        keySize:
          type: integer
          nullable: true
          description: >-
            Only ever present for the bulk cipher, and only because the suite name states it.
            `ECDHE` names no group and `RSA` names no modulus length, so those roles carry no
            key size from a flow record — ever (G-05).
        location:
          type: string
        status:
          type: string
          nullable: true
          description: Asset lifecycle status. Null on the POST response.
        quantumVulnerable:
          type: boolean
          nullable: true
          description: Resolved from the standards data at read time, never stored. Null when the algorithm resolves to no entry.
      required:
        - role
        - algorithm
        - keySize
        - location

    NetworkFlowConversation:
      type: object
      description: One conversation, with both endpoints and whatever is known about what protected it.
      properties:
        flowKey:
          type: string
          description: Deterministic identity — transport + source identity + destination identity + destination port. The source port is not in it.
        transport:
          type: string
          enum: [tcp, udp, other]
        sourceIdentity:
          type: string
          description: The string the near end resolved to — workload, else hostname, else address.
        sourceAddress:
          type: string
          nullable: true
        sourceHostname:
          type: string
          nullable: true
        sourceWorkload:
          type: string
          nullable: true
        destinationIdentity:
          type: string
        destinationAddress:
          type: string
          nullable: true
        destinationHostname:
          type: string
          nullable: true
        destinationWorkload:
          type: string
          nullable: true
        destinationPort:
          type: integer
        applicationProtocol:
          type: string
          nullable: true
        recordFormat:
          type: string
          enum: [vpc-flow-log, load-balancer-access-log, service-mesh-telemetry, firewall-session-log, other]
        cryptoState:
          type: string
          enum: [observed, undetermined]
          description: >-
            `undetermined` means the evidence did not state the cryptography. It is **not**
            "unencrypted" — no flow record this product reads can make that claim.
        reportedCipherSuite:
          type: string
          nullable: true
          description: The suite name verbatim, beside the canonical algorithms derived from it, so the decomposition stays auditable.
        reportedTlsVersion:
          type: string
          nullable: true
        cryptoReportedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When a record naming a cipher was last ingested for this conversation. A later
            cipher-free export deliberately does not blank the suite (silence is not a denial),
            so this is how a stale reading is visible as stale.
        recordCount:
          type: integer
        firstSeen:
          type: string
          format: date-time
          nullable: true
        lastSeen:
          type: string
          format: date-time
          nullable: true
        cryptography:
          type: array
          description: Empty when `cryptoState` is `undetermined`.
          items:
            $ref: "#/components/schemas/NetworkFlowCryptography"
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/NetworkFlowGap"
      required:
        - flowKey
        - transport
        - sourceIdentity
        - sourceAddress
        - sourceHostname
        - sourceWorkload
        - destinationIdentity
        - destinationAddress
        - destinationHostname
        - destinationWorkload
        - destinationPort
        - applicationProtocol
        - recordFormat
        - cryptoState
        - reportedCipherSuite
        - reportedTlsVersion
        - recordCount
        - cryptography

    NetworkFlowIngestSummary:
      type: object
      properties:
        projectId:
          type: integer
        recordsSubmitted:
          type: integer
        conversationsRecorded:
          type: integer
        flowsCreated:
          type: integer
        flowsUpdated:
          type: integer
        flowsWithUndeterminedCryptography:
          type: integer
          description: >-
            Conversations on record for this project whose cryptography nothing has determined.
            Reported as a first-class number because `GET /projects/{id}/coverage` cannot say
            it: a submission of cipher-free rows writes a completed run with zero observations,
            which the coverage meter renders as examined-and-nothing-found — and that reads as
            clean when it is not.
        collectionRunId:
          type: integer
          nullable: true
        assetsCreated:
          type: integer
        assetsUpdated:
          type: integer
        observationsCreated:
          type: integer
        assetsMarkedGone:
          type: integer
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/NetworkFlowConversation"
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/NetworkFlowRejection"
        evidenceCaveat:
          type: string
      required:
        - projectId
        - recordsSubmitted
        - conversationsRecorded
        - flowsCreated
        - flowsUpdated
        - flowsWithUndeterminedCryptography
        - collectionRunId
        - assetsCreated
        - assetsUpdated
        - observationsCreated
        - assetsMarkedGone
        - conversations
        - rejected
        - evidenceCaveat

    ProjectNetworkFlows:
      type: object
      properties:
        projectId:
          type: integer
        generatedAt:
          type: string
          format: date-time
        conversationsRecorded:
          type: integer
        flowsWithUndeterminedCryptography:
          type: integer
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/NetworkFlowConversation"
        evidenceCaveat:
          type: string
      required:
        - projectId
        - generatedAt
        - conversationsRecorded
        - flowsWithUndeterminedCryptography
        - conversations
        - evidenceCaveat

    EndpointCertificateReport:
      type: object
      description: >-
        One certificate in one of the host's machine stores, as the *store* renders it —
        not the DER. A Windows machine store holds hundreds of trusted roots, so shipping
        every certificate's bytes would send megabytes per host per run; what
        `Get-ChildItem Cert:\LocalMachine\My` already gives you is these fields. The
        confidence is priced for that: 0.8 here against 0.9 for a certificate
        `POST /projects/{id}/certificates` actually parsed.
      properties:
        thumbprint:
          type: string
          description: >-
            The store's stable handle for this certificate (Windows' SHA-1 `Thumbprint`).
            Part of the asset identity; read as a handle, never as a claim that SHA-1 is in
            use.
        publicKeyAlgorithm:
          type: string
          description: >-
            The store's own string — `RSA`, `ECC`, `1.2.840.113549.1.1.1`, `id-ecPublicKey`,
            `ED25519`. A string this collector does not carry produces **no observation at
            all** rather than a guess, which is how a post-quantum certificate stays absent
            instead of being reported as something classical.
        keySize:
          type: integer
          description: >-
            Bits, as the store states them. Omit when the store did not: `ECC` names no
            curve, and a defaulted 256 would be a fabricated measurement (G-05). Only
            Ed25519/Ed448, whose identifiers fix a size, get one without this field.
        subject:
          type: string
        issuer:
          type: string
        serialNumber:
          type: string
        notBefore:
          type: string
        notAfter:
          type: string
        hasPrivateKey:
          type: boolean
          description: Omitting it means the agent did not report it, which is not the same claim as `false`. Evidence only.
      required:
        - thumbprint

    SubmitProjectEndpointBody:
      type: object
      properties:
        hosts:
          type: array
          maxItems: 500
          description: One entry per host. Every section within a host is optional; absent means "not collected" and leaves that slot's prior assets alone.
          items:
            type: object
            properties:
              machineId:
                type: string
                minLength: 1
                description: >-
                  The identifier the OS mints at install — Windows' `MachineGuid`, Linux'
                  `/etc/machine-id`. Survives a rename, a reboot and a re-address; changes on
                  a re-image. There is no hostname fallback, and a placeholder or duplicated
                  value is refused rather than merged — see the route description.
              machineIdSource:
                type: string
                enum: [windows-machine-guid, linux-machine-id, other]
              hostname:
                type: string
                description: Display only. Deliberately not identity — hostnames get changed and, worse, reused.
              os:
                type: object
                description: >-
                  Carried so a reader knows what the OS defaults *would* have been, and for
                  no other purpose. Nothing infers a setting from it: if the report does not
                  state a setting, the setting is undetermined.
                properties:
                  family:
                    type: string
                    enum: [windows, linux, other]
                  name: { type: string }
                  version: { type: string }
                  build: { type: string }
                required: [family]
              collectedAt:
                type: string
              certificateStores:
                type: array
                description: Absent = the stores were not read. Present-and-empty = they were read and hold nothing, which correctly retires what used to be there.
                items:
                  type: object
                  properties:
                    store:
                      type: string
                      description: e.g. `LocalMachine\My`, `LocalMachine\Root`, `/etc/ssl/certs`. Part of the asset identity — the same certificate in the personal store and in the trust anchors is two different facts about the host.
                    certificates:
                      type: array
                      items:
                        $ref: "#/components/schemas/EndpointCertificateReport"
                  required: [store, certificates]
              tlsPolicy:
                type: object
                properties:
                  provider:
                    type: string
                    enum: [schannel, openssl, gnutls, other]
                  protocols:
                    type: array
                    description: >-
                      No protocol version becomes an asset — `algorithms.json` catalogues
                      algorithms and inventing a `TLS 1.0` entry would put that vocabulary in
                      two places. The posture is carried as host context instead.
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        role:
                          type: string
                          description: "`Server` / `Client` where the policy distinguishes them, as Schannel does."
                        enabled:
                          type: boolean
                          description: >-
                            Tri-state, and omitting it is the common case: a Schannel
                            `Enabled` REG_DWORD frequently does not exist, and the build
                            default then applies — which this product does not claim to know.
                            Such an entry is reported as `undeterminedProtocols`, never as on
                            or off.
                      required: [name]
                  cipherSuites:
                    type: array
                    description: Absent = the suite list was not read, which leaves previously recorded suites untouched.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: IANA (`TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384`) or OpenSSL (`ECDHE-RSA-AES256-GCM-SHA384`) spelling; both are read.
                        enabled:
                          type: boolean
                          description: >-
                            Required, unlike a protocol's. Schannel's suite order, OpenSSL's
                            `CipherString` and a GnuTLS priority string are all lists of what
                            is *on* — membership is enablement, so an agent transcribing one
                            would have nothing to put in an optional field.
                      required: [name, enabled]
                  disabledAlgorithms:
                    type: array
                    description: >-
                      Algorithms switched off independently of the suite list — Schannel
                      `Ciphers`/`Hashes`/`KeyExchangeAlgorithms` subkeys with `Enabled = 0`,
                      spelled exactly as the registry does (`AES 128/128`, `Triple DES 168`,
                      `SHA`). Any suite that needs one is suppressed entirely. The match is
                      on (algorithm, size): disabling `AES 128/128` does not silence an
                      AES-256 suite.
                    items: { type: string }
                required: [provider]
              providers:
                type: array
                description: >-
                  Loaded CNG KSPs, CAPI CSPs, PKCS#11 modules, OpenSSL providers. Recorded
                  and echoed, but **no observation is produced from one**: a loaded provider
                  is a capability, not a key, and turning it into an algorithm asset would
                  put a finding on every Windows machine ever built.
                items:
                  type: object
                  properties:
                    name: { type: string }
                    kind: { type: string }
                    loaded: { type: boolean }
                    version: { type: string }
                  required: [name]
            required:
              - machineId
      required:
        - hosts

    EndpointHostResult:
      type: object
      description: What one submitted host produced — including the hosts that produced nothing, which the caller has to be able to see by name.
      properties:
        machineId:
          type: string
        hostname:
          type: string
          nullable: true
        skipped:
          type: string
          nullable: true
          enum: [placeholder-machine-id, duplicate-machine-id, nothing-collected, null]
          description: >-
            Why this host was not ingested. `placeholder-machine-id` — a cleared `MachineGuid`
            or an all-zero machine-id, which is the absence of an identity wearing the shape
            of one. `duplicate-machine-id` — two hosts in this submission reported the same
            identity, so both were refused rather than merged into one machine's asset set.
            `nothing-collected` — the host reported no section at all. Null when the host was
            ingested.
        observationsCreated:
          type: integer
        certificatesRead:
          type: integer
          description: Certificates seen in this host's stores, including the ones whose key algorithm produced no observation.
        cipherSuiteDeclarations:
          type: integer
          description: Algorithms this host's enabled, un-suppressed cipher suites state. One suite normally states three.
        suppressedSuites:
          type: array
          description: >-
            Suites the policy enables but a `disabledAlgorithms` entry makes unnegotiable,
            with the entry responsible. Reported rather than merely applied — a suppression
            nobody can see is indistinguishable from a collector that missed the suite.
          items:
            type: object
            properties:
              suite: { type: string }
              disabledBy: { type: string }
            required: [suite, disabledBy]
        undecodedSuites:
          type: array
          description: >-
            Enabled suites that named no algorithm this product catalogues — ChaCha20,
            Camellia, a post-quantum suite. A known silence, reported so it is not mistaken
            for a clean result.
          items: { type: string }
        unrecognisedDisabledAlgorithms:
          type: array
          description: >-
            `disabledAlgorithms` entries this collector does not recognise and therefore could
            not act on. The one input whose misreading risks a false positive rather than an
            omission, so it is surfaced instead of swallowed.
          items: { type: string }
        enabledProtocols:
          type: array
          items: { type: string }
        disabledProtocols:
          type: array
          items: { type: string }
        undeterminedProtocols:
          type: array
          description: Protocols the policy names without stating an `enabled` value — the OS default applies and this product does not claim to know it.
          items: { type: string }
      required:
        - machineId
        - hostname
        - skipped
        - observationsCreated
        - certificatesRead
        - cipherSuiteDeclarations
        - suppressedSuites
        - undecodedSuites
        - unrecognisedDisabledAlgorithms
        - enabledProtocols
        - disabledProtocols
        - undeterminedProtocols

    EndpointIngestSummary:
      type: object
      properties:
        projectId:
          type: integer
        hostsSubmitted:
          type: integer
        hostsIngested:
          type: integer
          description: >-
            Hosts with a usable identity and something collected. Zero means no collection run
            was recorded and the endpoint surface is still un-examined for this project — a
            host that was read and declares nothing reportable still counts here, because it
            was examined.
        collectionRunId:
          type: integer
          nullable: true
          description: Null when no run was recorded (`hostsIngested` is 0).
        assetsCreated:
          type: integer
        assetsUpdated:
          type: integer
        observationsCreated:
          type: integer
        assetsMarkedGone:
          type: integer
          description: >-
            Facts previously read from a slot this submission re-read and no longer present in
            it — a certificate removed from a store, a suite pruned from the registry. Scoped
            to exactly the (host, section) slots this submission spoke about, so a host or a
            section it said nothing about is untouched.
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/EndpointHostResult"
        evidenceCaveat:
          type: string
          description: >-
            Stated on every response: this reads a report a host agent submitted, no agent
            ships with the product yet, an enabled suite is not a negotiated one, a suite the
            host disabled is not reported, no protocol version or loaded provider becomes an
            asset, and an unrecognised token contributes nothing rather than a guess.
      required:
        - projectId
        - hostsSubmitted
        - hostsIngested
        - collectionRunId
        - assetsCreated
        - assetsUpdated
        - observationsCreated
        - assetsMarkedGone
        - hosts
        - evidenceCaveat

    ProjectEndpointComponent:
      type: object
      description: One crypto fact read off a host, as it is stored.
      properties:
        component:
          type: string
          description: The slot on the host — `certificate-store:LocalMachine\My`, `tls-cipher-suites`.
        observedToken:
          type: string
          description: The suite name or the store thumbprint verbatim, as the host wrote it. Part of the asset identity.
        algorithm:
          type: string
        keySize:
          type: integer
          nullable: true
          description: Null means the evidence stated none — never a defaulted value (G-05).
        strength:
          type: string
          enum: [permitted, materialised]
        status:
          type: string
          description: "`active`, `gone`, `remediated` or `waived`. A `gone` entry is a fact that was read and is no longer present."
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        certificate:
          type: object
          nullable: true
          description: Present when the component is a certificate store.
          properties:
            store: { type: string }
            thumbprint: { type: string }
            reportedAlgorithm:
              type: string
              description: The store's own string, kept beside the canonical algorithm derived from it so the canonicalisation is auditable.
            subject: { type: string, nullable: true }
            issuer: { type: string, nullable: true }
            serialNumber: { type: string, nullable: true }
            notBefore: { type: string, nullable: true }
            notAfter: { type: string, nullable: true }
            hasPrivateKey: { type: boolean, nullable: true }
          required: [store, thumbprint, reportedAlgorithm]
      required:
        - component
        - observedToken
        - algorithm
        - keySize
        - strength
        - status
        - firstSeen
        - lastSeen
        - certificate

    ProjectEndpointHost:
      type: object
      properties:
        machineId:
          type: string
        machineIdSource:
          type: string
          nullable: true
        hostname:
          type: string
          nullable: true
          description: As of the most recent report. Not identity — a rename does not orphan the host's assets.
        os:
          type: object
          nullable: true
          properties:
            family: { type: string }
            name: { type: string, nullable: true }
            version: { type: string, nullable: true }
            build: { type: string, nullable: true }
          required: [family]
        tlsPolicy:
          type: object
          nullable: true
          properties:
            provider: { type: string }
            enabledProtocols: { type: array, items: { type: string } }
            disabledProtocols: { type: array, items: { type: string } }
            undeterminedProtocols: { type: array, items: { type: string } }
          required: [provider, enabledProtocols, disabledProtocols, undeterminedProtocols]
        providers:
          type: array
          description: Loaded cryptographic providers. Context — no provider produced any of the components below.
          items:
            type: object
            properties:
              name: { type: string }
              kind: { type: string, nullable: true }
              loaded: { type: boolean, nullable: true }
              version: { type: string, nullable: true }
            required: [name]
        lastSeen:
          type: string
          format: date-time
        components:
          type: array
          items:
            $ref: "#/components/schemas/ProjectEndpointComponent"
      required:
        - machineId
        - machineIdSource
        - hostname
        - os
        - tlsPolicy
        - providers
        - lastSeen
        - components

    ProjectEndpointFleet:
      type: object
      properties:
        projectId:
          type: integer
        generatedAt:
          type: string
          format: date-time
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/ProjectEndpointHost"
        evidenceCaveat:
          type: string
      required:
        - projectId
        - generatedAt
        - hosts
        - evidenceCaveat

    CollectionScheduleAttempt:
      type: object
      description: >-
        One execution attempt. `succeeded` is the only status that makes a later absence
        meaningful — `no_evidence` (nothing was reachable) and `failed` (the attempt threw)
        both mean the estate was not examined, and neither may be read as a remediation.
      properties:
        id:
          type: integer
        scheduleId:
          type: integer
        status:
          type: string
          enum: [succeeded, no_evidence, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        collectionRunId:
          type: [integer, "null"]
          description: The collection run this attempt produced. Null for `no_evidence` and `failed` — there was nothing to record.
        targetsAttempted:
          type: integer
        targetsObserved:
          type: integer
        error:
          type: [string, "null"]
      required:
        - id
        - scheduleId
        - status
        - startedAt
        - finishedAt
        - collectionRunId
        - targetsAttempted
        - targetsObserved
        - error

    CollectionSchedule:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        targetKind:
          type: string
          enum: [tls]
        target:
          type: object
          description: The collector's stored input, in the shape that collector already accepts.
          properties:
            targets:
              type: array
              items:
                type: object
                properties:
                  host: { type: string }
                  port: { type: integer }
                required: [host, port]
          required: [targets]
        intervalMinutes:
          type: integer
        enabled:
          type: boolean
        nextRunAt:
          type: string
          format: date-time
        lastRunAt:
          type: [string, "null"]
          format: date-time
          description: When the runner last attempted this schedule. Null until the first attempt — never defaulted, which would claim a run that never happened.
        lastSucceededAt:
          type: [string, "null"]
          format: date-time
          description: When an attempt last produced evidence. The gap between this and `lastRunAt` is how long the estate has gone unobserved.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        recentAttempts:
          type: array
          items:
            $ref: "#/components/schemas/CollectionScheduleAttempt"
      required:
        - id
        - projectId
        - targetKind
        - target
        - intervalMinutes
        - enabled
        - nextRunAt
        - lastRunAt
        - lastSucceededAt
        - createdAt
        - updatedAt
        - recentAttempts

    CreateCollectionScheduleBody:
      type: object
      properties:
        projectId:
          type: integer
        targetKind:
          type: string
          enum: [tls]
        targets:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            properties:
              host:
                type: string
                description: >-
                  Hostname or IP literal — never a URL, and **enforced** rather than merely
                  described (G-23): a scheme, a path, a wildcard, an embedded port or a single
                  label is refused with 400 on both create and update. Normalised before it is
                  stored (lower-cased, one trailing root dot stripped, IPv6 unbracketed), so
                  `EXAMPLE.test.` and `example.test` are one target rather than two schedules
                  against the same host.
              port:
                type: integer
                minimum: 1
                maximum: 65535
            required: [host, port]
        intervalMinutes:
          type: integer
          minimum: 15
          description: >-
            Minimum 15. Not a performance guard: the only re-collectable target opens sockets to
            a customer's own hosts, and a one-minute schedule pointed at production is a
            self-inflicted denial of service.
        enabled:
          type: boolean
      required:
        - projectId
        - targetKind
        - targets
        - intervalMinutes

    UpdateCollectionScheduleBody:
      type: object
      properties:
        targets:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            properties:
              host:
                type: string
                description: Same rule as on create, enforced the same way (G-23) — a rule applied on create and not on update is a rule with a door beside it.
              port: { type: integer, minimum: 1, maximum: 65535 }
            required: [host, port]
        intervalMinutes:
          type: integer
          minimum: 15
        enabled:
          type: boolean

    ScheduleExecution:
      type: object
      properties:
        scheduleId: { type: integer }
        projectId: { type: integer }
        targetKind: { type: string }
        status:
          type: string
          enum: [succeeded, no_evidence, failed]
        scheduleRunId: { type: integer }
        collectionRunId: { type: [integer, "null"] }
        targetsAttempted: { type: integer }
        targetsObserved: { type: integer }
        observationsCreated: { type: integer }
        assetsCreated: { type: integer }
        assetsMarkedGone:
          type: integer
          description: >-
            Only ever non-zero for a `succeeded` attempt. An attempt that observed nothing
            reconciles nothing, which is what stops an unreachable host being reported as fixed.
        targets:
          type: array
          items:
            type: object
            properties:
              host: { type: string }
              port: { type: integer }
              outcome: { type: string }
            required: [host, port, outcome]
        error: { type: [string, "null"] }
        nextRunAt: { type: string, format: date-time }
      required:
        - scheduleId
        - projectId
        - targetKind
        - status
        - scheduleRunId
        - collectionRunId
        - targetsAttempted
        - targetsObserved
        - observationsCreated
        - assetsCreated
        - assetsMarkedGone
        - targets
        - error
        - nextRunAt

    RunDueSchedulesResult:
      type: object
      properties:
        ranAt:
          type: string
          format: date-time
        due:
          type: integer
          description: How many schedules were due. Capped per call, so this can be lower than the number actually waiting.
        executed:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleExecution"
      required: [ranAt, due, executed]

    DriftAsset:
      type: object
      properties:
        assetId: { type: integer }
        surface: { type: string }
        surfaceId: { type: [string, "null"] }
        algorithm: { type: string }
        keySize:
          type: [integer, "null"]
          description: Null means undetermined. Never a guessed default (G-05).
        location: { type: string }
        status: { type: string }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        compliance:
          type: [object, "null"]
          description: >-
            Obligations, deadlines and citations resolved through C1 on this read, never stored.
            Null for an algorithm the mapping data does not know — an absent obligation, never an
            invented one.
          additionalProperties: true
      required:
        - assetId
        - surface
        - surfaceId
        - algorithm
        - keySize
        - location
        - status
        - firstSeen
        - lastSeen
        - compliance

    DriftNotObservedEvidence:
      type: object
      description: The collection run behind an absence. Without it, an absence is unauditable.
      properties:
        collectionRunId: { type: integer }
        collector: { type: [string, "null"] }
        runCompletedAt: { type: [string, "null"], format: date-time }
        runTarget: { type: [string, "null"] }
      required: [collectionRunId, collector, runCompletedAt, runTarget]

    DriftAppearance:
      allOf:
        - $ref: "#/components/schemas/DriftAsset"
        - type: object
          properties:
            appearedAt: { type: string, format: date-time }
          required: [appearedAt]

    DriftDisappearance:
      allOf:
        - $ref: "#/components/schemas/DriftAsset"
        - type: object
          properties:
            meaning:
              type: string
              enum: [not-observed]
              description: >-
                A fixed literal, not a label. It is the only statement this payload makes about
                an absence, and it is not "remediated".
            notObservedAt:
              type: string
              format: date-time
              description: When the collection that did not find it ran — not when the asset stopped existing, which nobody knows.
            lastObservedAt:
              type: string
              format: date-time
              description: When it was last actually observed. Never advanced by the run that missed it.
            evidence:
              oneOf:
                - $ref: "#/components/schemas/DriftNotObservedEvidence"
                - type: "null"
          required: [meaning, notObservedAt, lastObservedAt, evidence]

    DriftReappearance:
      allOf:
        - $ref: "#/components/schemas/DriftAsset"
        - type: object
          properties:
            reappearedAt: { type: string, format: date-time }
            evidence:
              oneOf:
                - $ref: "#/components/schemas/DriftNotObservedEvidence"
                - type: "null"
          required: [reappearedAt, evidence]

    DriftLocationChange:
      type: object
      description: >-
        The same location serving different cryptography. A correlation computed on read: an
        asset's identity includes its algorithm, so a changed algorithm is necessarily two rows,
        and both halves stay in `appeared`/`disappeared` as well.
      properties:
        surface: { type: string }
        location: { type: string }
        from: { $ref: "#/components/schemas/DriftAsset" }
        to: { $ref: "#/components/schemas/DriftAsset" }
      required: [surface, location, from, to]

    SurfaceObservability:
      type: object
      description: Whether anybody actually looked at this surface during the window.
      properties:
        surface: { type: string }
        surfaceId: { type: [string, "null"] }
        completedRunsInWindow: { type: integer }
        unproductiveAttemptsInWindow:
          type: integer
          description: Scheduled attempts in the window that produced no evidence (`failed` or `no_evidence`).
        lastCollectedAt:
          type: [string, "null"]
          format: date-time
          description: The last completed run on this surface at any time. Null means never examined at all.
        observedInWindow:
          type: boolean
          description: >-
            False means every empty list in this response is empty because nobody collected, not
            because nothing changed.
      required:
        - surface
        - surfaceId
        - completedRunsInWindow
        - unproductiveAttemptsInWindow
        - lastCollectedAt
        - observedInWindow

    DriftOverdueSchedule:
      type: object
      properties:
        scheduleId: { type: integer }
        projectId: { type: integer }
        targetKind: { type: string }
        dueAt: { type: string, format: date-time }
        minutesOverdue: { type: integer }
        lastSucceededAt: { type: [string, "null"], format: date-time }
        neverSucceeded: { type: boolean }
      required: [scheduleId, projectId, targetKind, dueAt, minutesOverdue, lastSucceededAt, neverSucceeded]

    DriftFeed:
      type: object
      properties:
        window:
          type: object
          properties:
            since: { type: string, format: date-time }
            until: { type: string, format: date-time }
          required: [since, until]
        appeared:
          type: array
          items:
            $ref: "#/components/schemas/DriftAppearance"
        disappeared:
          type: array
          items:
            $ref: "#/components/schemas/DriftDisappearance"
        reappeared:
          type: array
          items:
            $ref: "#/components/schemas/DriftReappearance"
        changed:
          type: array
          items:
            $ref: "#/components/schemas/DriftLocationChange"
        surfaces:
          type: array
          items:
            $ref: "#/components/schemas/SurfaceObservability"
        schedules:
          type: object
          properties:
            attempts:
              type: array
              items:
                $ref: "#/components/schemas/CollectionScheduleAttempt"
            overdue:
              type: array
              items:
                $ref: "#/components/schemas/DriftOverdueSchedule"
          required: [attempts, overdue]
        caveat:
          type: string
          description: Stated in the payload rather than only in the docs, so a report built from this can quote it.
      required:
        - window
        - appeared
        - disappeared
        - reappeared
        - changed
        - surfaces
        - schedules
        - caveat

    # ── F1 — sign-in ────────────────────────────────────────────────────────

    AuthProvider:
      type: object
      properties:
        id:
          type: string
          description: Stable identifier used in the `/auth/{provider}/…` paths.
        label:
          type: string
          description: Display name. Presentation only — never matched on.
      required:
        - id
        - label

    AuthProviderList:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AuthProvider"
          description: >-
            Empty when sessions are not configured. A provider missing from this array cannot be
            signed in with, whatever any documentation says.
      required:
        - providers

    AuthUser:
      type: object
      description: >-
        The signed-in person. Every field but `id` is nullable because a provider supplies what it
        supplies — GitHub may return no email at all, and a name is not guaranteed anywhere.
        Absent means the provider did not tell us, never that the person has no name.
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
      required:
        - id
        - email
        - firstName
        - lastName
        - profileImageUrl

    ActiveOrganization:
      type: object
      properties:
        organization:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            role:
              type: string
          required:
            - id
            - role
      required:
        - organization

    OrganizationMembership:
      type: object
      properties:
        organizationId:
          type: integer
        role:
          type: string
      required:
        - organizationId
        - role

    AuthSession:
      type: object
      description: >-
        `user: null` with an empty `memberships` array is the anonymous shape, returned with a 200.
        It is a state, not a failure.
      properties:
        user:
          allOf:
            - $ref: "#/components/schemas/AuthUser"
          nullable: true
        organization:
          type: object
          nullable: true
          description: The active organisation, as an id and a role. Never a name — see the route description.
          properties:
            id:
              type: integer
            role:
              type: string
          required:
            - id
            - role
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMembership"
      required:
        - user
        - organization
        - memberships

    # ── RBAC — divisions ────────────────────────────────────────────────────

    Division:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug:
          type: string
          description: Lower-case, hyphenated, unique within the organisation. Immutable once created — it appears in URLs.
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        projects:
          type: integer
          description: Projects in this division that the caller can see. Computed, never stored.
      required: [id, name, slug]

    DivisionList:
      type: object
      properties:
        divisions:
          type: array
          items: { $ref: "#/components/schemas/Division" }
        organizationWideProjects:
          type: integer
          description: >-
            Projects belonging to no division. Visible to everyone in the tenant — this is what
            every project created before divisions existed carries, and it is not a division's
            omission.
      required: [divisions, organizationWideProjects]

    CreateDivisionBody:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        slug:
          type: string
          description: Lower-case letters, digits and single hyphens.
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description: { type: string, nullable: true }
      required: [name, slug]

    UpdateDivisionBody:
      type: object
      description: The slug is absent on purpose — it is immutable.
      properties:
        name: { type: string }
        description: { type: string, nullable: true }

    DivisionGrant:
      type: object
      properties:
        divisionId: { type: integer }
        userId: { type: string }
        role:
          type: string
          enum: [viewer, member, admin]
          description: No `owner` — ownership is a fact about the organisation, and a division owner would imply a right to delete something they do not own.
        createdAt: { type: string, format: date-time }
      required: [divisionId, userId, role]

    CreateDivisionGrantBody:
      type: object
      properties:
        userId: { type: string }
        role:
          type: string
          enum: [viewer, member, admin]
      required: [userId, role]

    OrganizationMemberList:
      type: object
      properties:
        members:
          type: array
          items:
            type: object
            properties:
              userId: { type: string }
              role: { type: string, enum: [viewer, member, admin, owner] }
              createdAt: { type: string, format: date-time }
              divisionGrants:
                type: array
                items:
                  type: object
                  properties:
                    divisionId: { type: integer }
                    role: { type: string }
                  required: [divisionId, role]
            required: [userId, role, divisionGrants]
        roles:
          type: array
          items: { type: string }
          description: The role vocabulary this build understands, weakest to strongest.
      required: [members, roles]
