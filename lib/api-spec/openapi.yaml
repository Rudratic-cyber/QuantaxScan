        files:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MultiScanFile"
      required:
        - projectName
        - language
        - files

    MultiScanFinding:
      type: object
      description: >-
        A per-file finding as returned inline for IDE display. Deliberately narrower than
        `Finding`: it carries no `id`/`scanId`, because the row ids are not read back.
      properties:
        lineNumber:
          type: integer
        severity:
          type: string
          enum: [critical, alert, safe]
        algorithm:
          type: string
        codeSnippet:
          type: string
        nistReplacement:
          type: string
          nullable: true
        nistStandard:
          type: string
          nullable: true
        effortHours:
          type: number
        explanation:
          type: string
        compliance:
          allOf:
            - $ref: "#/components/schemas/FindingCompliance"
          nullable: true
      required:
        - lineNumber
        - severity
        - algorithm
        - codeSnippet
        - nistReplacement
        - nistStandard
        - effortHours
        - explanation

    MultiScanFileResult:
      type: object
      properties:
        filename:
          type: string
        riskScore:
          type: integer
          description: This file's own post-quantum score, computed over this file alone.
        findings:
          type: array
          items:
            $ref: "#/components/schemas/MultiScanFinding"
      required:
        - filename
        - riskScore
        - findings

    MultiScanResult:
      type: object
      properties:
        projectId:
          type: integer
        projectName:
          type: string
        riskScore:
          type: integer
          description: >-
            The project-level post-quantum score, computed over every finding in the
            submission — not the maximum of the per-file scores.
        worstFileRiskScore:
          type: integer
          description: The highest per-file score, which is also what each individual scan row stores.
        criticalCount:
          type: integer
        alertCount:
          type: integer
        cleanCount:
          type: integer
        totalLines:
          type: integer
        findingsCount:
          type: integer
        filesScanned:
          type: integer
        pqc:
          $ref: "#/components/schemas/PqcExposure"
        hygiene:
          $ref: "#/components/schemas/HygieneSummary"
        mosca:
          $ref: "#/components/schemas/MoscaAssessment"
        fileResults:
          type: array
          items:
            $ref: "#/components/schemas/MultiScanFileResult"
      required:
        - projectId
        - projectName
        - riskScore
        - worstFileRiskScore
        - criticalCount
        - alertCount
        - cleanCount
        - totalLines
        - findingsCount
        - filesScanned
        - pqc
        - hygiene
        - mosca
        - fileResults

    AlgorithmBreakdownEntry:
      type: object
      description: One algorithm's contribution to a risk track, aggregated across the findings.
      properties:
        algorithm:
          type: string
        count:
          type: integer
        effortHours:
          type: number
        reportingNote:
          type: string
          nullable: true
          description: >-
            The mapping data's own qualification of this algorithm. Print it verbatim — it
            is why the finding is being reported the way it is.
        nistReplacement:
          type: string
          nullable: true
        nistStandard:
          type: string
          nullable: true
        citation:
          type: object
          nullable: true
          properties:
            document:
              type: string
            url:
              type: string
          required:
            - document
            - url
      required:
        - algorithm
        - count
        - effortHours
        - reportingNote
        - nistReplacement
        - nistStandard
        - citation

    PqcExposure:
      type: object
      description: A4 — the post-quantum half of the risk profile, with its score decomposed.
      properties:
        riskScore:
          type: integer
          description: >-
            0-100, and **zero whenever no quantum-vulnerable algorithm was detected**,
            whatever else the scan found. Classical hygiene contributes nothing (G-10).
        findingCount:
          type: integer
        effortHours:
          type: number
        estimatedCost:
          type: integer
        byAlgorithm:
          type: array
          items:
            $ref: "#/components/schemas/AlgorithmBreakdownEntry"
        scoreComponents:
          type: object
          description: The two halves of `riskScore`. A score that cannot be decomposed is what A4 exists to replace.
          properties:
            detection:
              type: integer
              description: 0-60. Quantum-vulnerable density against the lines actually examined.
            moscaBreach:
              type: integer
              description: 0-40. The share of Q-Day scenarios under which the inequality is breached.
          required:
            - detection
            - moscaBreach
      required:
        - riskScore
        - findingCount
        - effortHours
        - estimatedCost
        - byAlgorithm
        - scoreComponents

    HygieneSummary:
      type: object
      description: >-
        A4/G-10 — classical cryptographic defects with no post-quantum content, scored
        separately and never folded into the PQC score.
      properties:
        findingCount:
          type: integer
        effortHours:
          type: number
        estimatedCost:
          type: integer
        byAlgorithm:
          type: array
          items:
            $ref: "#/components/schemas/AlgorithmBreakdownEntry"
        countedTowardPqcRisk:
          type: boolean
          description: >-
            Always false. Structural rather than decorative: an assertion in the payload
            that these findings did not move the post-quantum number.
        headline:
          type: string
      required:
        - findingCount
        - effortHours
        - estimatedCost
        - byAlgorithm
        - countedTowardPqcRisk
        - headline

    MoscaVerdict:
      type: object
      description: >-
        `X + Y > Z` under one Q-Day scenario, with all three inputs exposed. A4's acceptance
        criterion is a verdict that shows its working, so none of x, y or z is optional.
      properties:
        scenario:
          type: string
          enum: [conservative, central, aggressive]
        qDayYear:
          type: integer
        x:
          type: number
          description: Secrecy lifetime, years — how long the data must stay confidential.
        y:
          type: number
          description: Migration time, years.
        z:
          type: number
          description: Years remaining until this scenario's Q-Day. Negative once the year has passed.
        breached:
          type: boolean
        breachMarginYears:
          type: number
          description: "`(x + y) - z`. Negative is margin remaining; positive means already too late, by this many years."
        narrative:
          type: string
        scenarioRationale:
          type: string
        scenarioConfidence:
          type: string
          enum: [verified, needs-check]
      required:
        - scenario
        - qDayYear
        - x
        - y
        - z
        - breached
        - breachMarginYears
        - narrative
        - scenarioRationale
        - scenarioConfidence

    MoscaAssessment:
      type: object
      description: >-
        One verdict per Q-Day scenario. The scenarios are regulatory deadlines drawn from
        draft guidance, not predictions about physics — `framing` carries the sentence that
        must accompany any customer-facing use of these years.
      properties:
        x:
          type: number
          description: X as used, after defaulting.
        y:
          type: number
        secrecyLifetimeSource:
          type: string
          enum: [provided, assumed-default]
          description: >-
            Whether X was supplied or assumed. A report must say which: `assumed-default`
            means nobody classified the data and the product's fallback was used.
        applicable:
          type: boolean
          description: False when no quantum-vulnerable cryptography was found; every verdict is then trivially not-breached.
        evaluatedAt:
          type: string
          format: date-time
        verdicts:
          type: array
          items:
            $ref: "#/components/schemas/MoscaVerdict"
        breachedScenarioCount:
          type: integer
        scenarioCount:
          type: integer
        worstBreach:
          allOf:
            - $ref: "#/components/schemas/MoscaVerdict"
          nullable: true
          description: The breached verdict with the largest margin. Null when nothing breaches.
        framing:
          type: string
      required:
        - x
        - y
        - secrecyLifetimeSource
        - applicable
        - evaluatedAt
        - verdicts
        - breachedScenarioCount
        - scenarioCount
        - worstBreach
        - framing

    SurfaceCoverage:
      type: object
      properties:
        surface:
          type: string
          description: The `Surface` enum value, i.e. how the database records it.
        surfaceId:
          type: string
          nullable: true
          description: >-
            The collector catalogue id, so a caller can join presentation without
            re-deriving the mapping. Null for a surface with no catalogue entry.
        state:
          type: string
          enum: [examined, examined-nothing-found, never-examined]
          description: >-
            `examined-nothing-found` is its own state on purpose: a clean result and an
            absent one are different facts, and collapsing them loses the only one a reader
            cares about when the answer is zero.
        completedRuns:
          type: integer
        failedRuns:
          type: integer
          description: >-
            A failed run is an attempt, not an examination. It is counted here and kept out
            of `completedRuns` so it can never make a surface look examined.
        lastExaminedAt:
          type: string
          format: date-time
          nullable: true
        assets:
          type: integer
        activeAssets:
          type: integer
      required:
        - surface
        - surfaceId
        - state
        - completedRuns
        - failedRuns
        - lastExaminedAt
        - assets
        - activeAssets

    ConfidenceBucketCount:
      type: object
      description: Half-open bucket, [lower, upper), except the last which includes 1.0.
      properties:
        label:
          type: string
        lower:
          type: number
        upper:
          type: number
        count:
          type: integer
      required:
        - label
        - lower
        - upper
        - count

    ConfidenceSummary:
      type: object
      properties:
        basis:
          type: string
          enum: ["latest observation per active asset"]
          description: >-
            Stated in the payload so a report built from it can quote the basis rather than
            guess it. One point per asset, not per observation — weighting by scan frequency
            would describe our scheduling, not our evidence quality.
        scored:
          type: integer
        unscored:
          type: integer
          description: Active assets with no observation at all. Non-zero means a data problem, and hiding it would be the wrong default.
        excludedByAssetStatus:
          type: object
          additionalProperties:
            type: integer
          description: Assets deliberately left out of the distribution, keyed by asset status.
        distinctValues:
          type: integer
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
        mean:
          type: number
          nullable: true
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/ConfidenceBucketCount"
      required:
        - basis
        - scored
        - unscored
        - excludedByAssetStatus
        - distinctValues
        - min
        - max
        - mean
        - buckets

    ProjectCoverage:
      type: object
      description: >-
        D3 — what has been examined, and what has never been looked at. The denominator is
        surfaces, not assets: how much cryptography hides in a surface nobody examined is
        unknowable from this data, so `examinedSurfaces / totalSurfaces` must not be
        presented as a percentage of the estate.
      properties:
        projectId:
          type: integer
        generatedAt:
          type: string
          format: date-time
        examinedSurfaces:
          type: integer
        totalSurfaces:
          type: integer
        surfaces:
          type: array
          description: >-
            Every catalogue surface with any run or asset. A surface absent from this list
            has never been examined at all — that absence is the machine-readable half of
            the answer.
          items:
            $ref: "#/components/schemas/SurfaceCoverage"
        confidence:
          $ref: "#/components/schemas/ConfidenceSummary"
      required:
        - projectId
        - generatedAt
        - examinedSurfaces
        - totalSurfaces
        - surfaces
        - confidence

    CycloneDxProperty:
