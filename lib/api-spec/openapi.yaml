            url:
              type: string
          required:
            - document
            - url
      required:
        - algorithm
        - count
        - effortHours
        - reportingNote
        - nistReplacement
        - nistStandard
        - citation

    PqcExposure:
      type: object
      description: A4 — the post-quantum half of the risk profile, with its score decomposed.
      properties:
        riskScore:
          type: integer
          description: >-
            0-100, and **zero whenever no quantum-vulnerable algorithm was detected**,
            whatever else the scan found. Classical hygiene contributes nothing (G-10).
        findingCount:
          type: integer
        effortHours:
          type: number
        estimatedCost:
          type: integer
        byAlgorithm:
          type: array
          items:
            $ref: "#/components/schemas/AlgorithmBreakdownEntry"
        scoreComponents:
          type: object
          description: The two halves of `riskScore`. A score that cannot be decomposed is what A4 exists to replace.
          properties:
            detection:
              type: integer
              description: 0-60. Quantum-vulnerable density against the lines actually examined.
            moscaBreach:
              type: integer
              description: 0-40. The share of Q-Day scenarios under which the inequality is breached.
          required:
            - detection
            - moscaBreach
      required:
        - riskScore
        - findingCount
        - effortHours
        - estimatedCost
        - byAlgorithm
        - scoreComponents

    HygieneSummary:
      type: object
      description: >-
        A4/G-10 — classical cryptographic defects with no post-quantum content, scored
        separately and never folded into the PQC score.
      properties:
        findingCount:
          type: integer
        effortHours:
          type: number
        estimatedCost:
          type: integer
        byAlgorithm:
          type: array
          items:
            $ref: "#/components/schemas/AlgorithmBreakdownEntry"
        countedTowardPqcRisk:
          type: boolean
          description: >-
            Always false. Structural rather than decorative: an assertion in the payload
            that these findings did not move the post-quantum number.
        headline:
          type: string
      required:
        - findingCount
        - effortHours
        - estimatedCost
        - byAlgorithm
        - countedTowardPqcRisk
        - headline

    MoscaVerdict:
      type: object
      description: >-
        `X + Y > Z` under one Q-Day scenario, with all three inputs exposed. A4's acceptance
        criterion is a verdict that shows its working, so none of x, y or z is optional.
      properties:
        scenario:
          type: string
          enum: [conservative, central, aggressive]
        qDayYear:
          type: integer
        x:
          type: number
          description: Secrecy lifetime, years — how long the data must stay confidential.
        y:
          type: number
          description: Migration time, years.
        z:
          type: number
          description: Years remaining until this scenario's Q-Day. Negative once the year has passed.
        breached:
          type: boolean
        breachMarginYears:
          type: number
          description: "`(x + y) - z`. Negative is margin remaining; positive means already too late, by this many years."
        narrative:
          type: string
        scenarioRationale:
          type: string
        scenarioConfidence:
          type: string
          enum: [verified, needs-check]
      required:
        - scenario
        - qDayYear
        - x
        - y
        - z
        - breached
        - breachMarginYears
        - narrative
        - scenarioRationale
        - scenarioConfidence

    MoscaAssessment:
      type: object
      description: >-
        One verdict per Q-Day scenario. The scenarios are regulatory deadlines drawn from
        draft guidance, not predictions about physics — `framing` carries the sentence that
        must accompany any customer-facing use of these years.
      properties:
        x:
          type: number
          description: X as used, after defaulting.
        y:
          type: number
        secrecyLifetimeSource:
          type: string
          enum: [provided, assumed-default]
          description: >-
            Whether X was supplied or assumed. A report must say which: `assumed-default`
            means nobody classified the data and the product's fallback was used.
        applicable:
          type: boolean
          description: False when no quantum-vulnerable cryptography was found; every verdict is then trivially not-breached.
        evaluatedAt:
          type: string
          format: date-time
        verdicts:
          type: array
          items:
            $ref: "#/components/schemas/MoscaVerdict"
        breachedScenarioCount:
          type: integer
        scenarioCount:
          type: integer
        worstBreach:
          allOf:
            - $ref: "#/components/schemas/MoscaVerdict"
          nullable: true
          description: The breached verdict with the largest margin. Null when nothing breaches.
        framing:
          type: string
      required:
        - x
        - y
        - secrecyLifetimeSource
        - applicable
        - evaluatedAt
        - verdicts
        - breachedScenarioCount
        - scenarioCount
        - worstBreach
        - framing

    SurfaceCoverage:
      type: object
      properties:
        surface:
          type: string
          description: The `Surface` enum value, i.e. how the database records it.
        surfaceId:
          type: string
          nullable: true
          description: >-
            The collector catalogue id, so a caller can join presentation without
            re-deriving the mapping. Null for a surface with no catalogue entry.
        state:
          type: string
          enum: [examined, examined-nothing-found, never-examined]
          description: >-
            `examined-nothing-found` is its own state on purpose: a clean result and an
            absent one are different facts, and collapsing them loses the only one a reader
            cares about when the answer is zero.
        completedRuns:
          type: integer
        failedRuns:
          type: integer
          description: >-
            A failed run is an attempt, not an examination. It is counted here and kept out
            of `completedRuns` so it can never make a surface look examined.
        lastExaminedAt:
          type: string
          format: date-time
          nullable: true
        assets:
          type: integer
        activeAssets:
          type: integer
      required:
        - surface
        - surfaceId
        - state
        - completedRuns
        - failedRuns
        - lastExaminedAt
        - assets
        - activeAssets

    ConfidenceBucketCount:
      type: object
      description: Half-open bucket, [lower, upper), except the last which includes 1.0.
      properties:
        label:
          type: string
        lower:
          type: number
        upper:
          type: number
        count:
          type: integer
      required:
        - label
        - lower
        - upper
        - count

    ConfidenceSummary:
      type: object
      properties:
        basis:
          type: string
          enum: ["latest observation per active asset"]
          description: >-
            Stated in the payload so a report built from it can quote the basis rather than
            guess it. One point per asset, not per observation — weighting by scan frequency
            would describe our scheduling, not our evidence quality.
        scored:
          type: integer
        unscored:
          type: integer
          description: Active assets with no observation at all. Non-zero means a data problem, and hiding it would be the wrong default.
        excludedByAssetStatus:
          type: object
          additionalProperties:
            type: integer
          description: Assets deliberately left out of the distribution, keyed by asset status.
        distinctValues:
          type: integer
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
        mean:
          type: number
          nullable: true
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/ConfidenceBucketCount"
      required:
        - basis
        - scored
        - unscored
        - excludedByAssetStatus
        - distinctValues
        - min
        - max
        - mean
        - buckets

    ProjectCoverage:
      type: object
      description: >-
        D3 — what has been examined, and what has never been looked at. The denominator is
        surfaces, not assets: how much cryptography hides in a surface nobody examined is
        unknowable from this data, so `examinedSurfaces / totalSurfaces` must not be
        presented as a percentage of the estate.
      properties:
        projectId:
          type: integer
        generatedAt:
          type: string
          format: date-time
        examinedSurfaces:
          type: integer
        totalSurfaces:
          type: integer
        surfaces:
          type: array
          description: >-
            Every catalogue surface with any run or asset. A surface absent from this list
            has never been examined at all — that absence is the machine-readable half of
            the answer.
          items:
            $ref: "#/components/schemas/SurfaceCoverage"
        confidence:
          $ref: "#/components/schemas/ConfidenceSummary"
      required:
        - projectId
        - generatedAt
        - examinedSurfaces
        - totalSurfaces
        - surfaces
        - confidence

    CycloneDxProperty:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required:
        - name

    CycloneDxOccurrence:
      type: object
      properties:
        location:
          type: string
        line:
          type: integer
        symbol:
          type: string
      required:
        - location

    CycloneDxCryptoProperties:
      type: object
      properties:
        assetType:
          type: string
          enum: [algorithm, certificate, protocol, related-crypto-material]
        algorithmProperties:
          type: object
          properties:
            primitive:
              type: string
            algorithmFamily:
              type: string
            parameterSetIdentifier:
              type: string
              description: >-
                Key or parameter size as a string. Present only when the inventory actually
                determined it — never a guessed default (G-05).
            ellipticCurve:
              type: string
            mode:
              type: string
            padding:
              type: string
            cryptoFunctions:
              type: array
              items:
                type: string
        relatedCryptoMaterialProperties:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
            state:
              type: string
            size:
              type: integer
              description: Size in bits. Present only when determined.
        certificateProperties:
          type: object
          properties:
            subjectName:
              type: string
            issuerName:
              type: string
            serialNumber:
              type: string
            notValidBefore:
              type: string
            notValidAfter:
              type: string
        protocolProperties:
          type: object
          properties:
            type:
              type: string
            version:
              type: string
        oid:
          type: string
      required:
        - assetType

    CycloneDxComponent:
      type: object
      properties:
        type:
          type: string
        bom-ref:
          type: string
        name:
          type: string
        version:
          type: string
        description:
          type: string
        cryptoProperties:
          $ref: "#/components/schemas/CycloneDxCryptoProperties"
        evidence:
          type: object
          properties:
            occurrences:
              type: array
              items:
                $ref: "#/components/schemas/CycloneDxOccurrence"
        properties:
          type: array
          items:
            $ref: "#/components/schemas/CycloneDxProperty"
      required:
        - type
        - bom-ref
        - name

    CycloneDxDependency:
      type: object
      properties:
        ref:
          type: string
        dependsOn:
          type: array
          items:
            type: string
        provides:
          type: array
          items:
            type: string
      required:
        - ref

    TimelineScenarioCounts:
      type: object
      description: Assets breaching Mosca at this instant, one count per Q-Day scenario.
      additionalProperties:
        type: integer
    TimelinePointBase:
      type: object
      properties:
        at:
          type: string
          format: date-time
          description: For an observed point this is a real collection_runs timestamp, not a grid tick.
        assetsKnown: { type: integer }
        assetsPresent:
          type: integer
          description: Assets present and not yet gone at this instant. The number the verdicts are over.
        pqcAssets: { type: integer }
        hygieneAssets: { type: integer }
        unmappedAssets: { type: integer }
        breachedByScenario:
          $ref: "#/components/schemas/TimelineScenarioCounts"
      required:
        - at
        - assetsKnown
        - assetsPresent
        - pqcAssets
        - hygieneAssets
        - unmappedAssets
        - breachedByScenario
    ObservedPoint:
      allOf:
        - $ref: "#/components/schemas/TimelinePointBase"
        - type: object
          properties:
            kind: { type: string, enum: [observed] }
            collectionRunIds:
              type: array
              items: { type: integer }
            surfaces:
              type: array
              items: { type: string }
            assetsAdded: { type: integer }
          required: [kind, collectionRunIds, surfaces, assetsAdded]
    ProjectedPoint:
      allOf:
        - $ref: "#/components/schemas/TimelinePointBase"
        - type: object
          properties:
            kind: { type: string, enum: [projected] }
            year: { type: integer }
          required: [kind, year]
    ObservedHistory:
      type: object
      properties:
        sufficientForTrend:
          type: boolean
          description: False when fewer than two distinct collection instants exist. The client must draw no line.
        reason: { type: string }
        distinctCollectionInstants: { type: integer }
        observedSpanDays: { type: integer, nullable: true }
        firstObservedAt: { type: string, format: date-time, nullable: true }
        lastObservedAt: { type: string, format: date-time, nullable: true }
        completedRuns: { type: integer }
        failedRuns:
          type: integer
          description: A failed run places no point on the axis; it is reported here instead.
        points:
          type: array
          items: { $ref: "#/components/schemas/ObservedPoint" }
      required:
        - sufficientForTrend
        - reason
        - distinctCollectionInstants
        - observedSpanDays
        - firstObservedAt
        - lastObservedAt
        - completedRuns
        - failedRuns
        - points
    ProjectedHorizon:
      type: object
      properties:
        assumption:
          type: string
          description: What is held constant. Projections move because Z shrinks, not because the estate changed.
        basisAt: { type: string, format: date-time }
        points:
          type: array
          items: { $ref: "#/components/schemas/ProjectedPoint" }
      required: [assumption, basisAt, points]
    DeadlineMarker:
      type: object
      properties:
        id:
          type: string
          description: Keyed on framework + type + effective date + appliesTo + securityStrength.
        type: { type: string }
        label: { type: string }
        effect: { type: string }
        effectiveFrom: { type: string }
        year: { type: integer }
        inEffect: { type: boolean }
        appliesTo: { type: string, nullable: true }
        securityStrength: { type: string, nullable: true }
        framework: { type: string }
        frameworkName: { type: string, nullable: true }
        requirement: { type: string }
        citation: { $ref: "#/components/schemas/Citation" }
        confidence: { type: string }
        draftStatus: { type: string, nullable: true }
        algorithms:
          type: array
          items: { type: string }
        assets: { type: integer }
        caveats:
          type: array
          items: { type: string }
      required:
        - id
        - type
        - label
        - effect
        - effectiveFrom
        - year
        - inEffect
        - appliesTo
        - securityStrength
        - framework
        - frameworkName
        - requirement
        - citation
        - confidence
        - draftStatus
        - algorithms
        - assets
        - caveats
    EstateRollup:
      type: object
      properties:
        projects:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              assets: { type: integer }
              presentAssets: { type: integer }
            required: [id, name, assets, presentAssets]
        unassociatedAssets:
          type: integer
          description: Assets whose location carries no project prefix. Surfaces such as tls/certificate have no project.
        totalAssets: { type: integer }
        presentAssets: { type: integer }
      required: [projects, unassociatedAssets, totalAssets, presentAssets]
    PostureTimelineInputs:
      type: object
      properties:
        secrecyLifetime:
          type: object
          properties:
            bySource:
              type: object
              additionalProperties: { type: integer }
            assumedForAssets: { type: integer }
            bases:
              type: array
              items: { type: string }
          required: [bySource, assumedForAssets, bases]
        migrationYears:
          type: object
          properties:
            defaultValue: { type: number }
            assetsWithRecordedEffort: { type: integer }
            basis:
              type: string
              description: States plainly that Y is not measured yet, so a reader knows X vs Z decided the verdict.
          required: [defaultValue, assetsWithRecordedEffort, basis]
      required: [secrecyLifetime, migrationYears]
    PostureTimeline:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        now: { type: string, format: date-time }
        framing:
          type: string
          description: Mandatory wherever a scenario year is shown — a Q-Day year is a scenario, not a forecast.
        scenarios:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              qDayYear: { type: integer }
              rationale: { type: string }
              confidence: { type: string }
            required: [name, qDayYear, rationale, confidence]
        estate: { $ref: "#/components/schemas/EstateRollup" }
        observed: { $ref: "#/components/schemas/ObservedHistory" }
        projected: { $ref: "#/components/schemas/ProjectedHorizon" }
        deadlines:
          type: array
          items: { $ref: "#/components/schemas/DeadlineMarker" }
        inputs: { $ref: "#/components/schemas/PostureTimelineInputs" }
        notCollected:
          type: array
          description: Facts a reader expects on a time-pressure panel that this product cannot produce, stated rather than omitted.
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              reason: { type: string }
            required: [id, label, reason]
      required:
        - generatedAt
        - now
        - framing
        - scenarios
        - estate
        - observed
        - projected
        - deadlines
        - inputs
        - notCollected
    CbomDocument:
      type: object
      description: >-
        A CycloneDX 1.7 CBOM. Schema conformance is proven against the vendored official
        schema in `@workspace/cbom`'s own suite; this documents the subset the builder emits
        and is not a substitute for that validation.
      properties:
        bomFormat:
          type: string
          enum: [CycloneDX]
        specVersion:
          type: string
          enum: ["1.7"]
        serialNumber:
          type: string
        version:
          type: integer
        metadata:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
            tools:
              type: object
              properties:
                components:
                  type: array
                  items:
                    $ref: "#/components/schemas/CycloneDxComponent"
              required:
                - components
            properties:
              type: array
              items:
                $ref: "#/components/schemas/CycloneDxProperty"
          required:
            - timestamp
            - tools
        components:
          type: array
          items:
            $ref: "#/components/schemas/CycloneDxComponent"
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/CycloneDxDependency"
      required:
        - bomFormat
        - specVersion
        - version
        - metadata
        - components
        - dependencies

    ReadinessSection:
      type: object
      description: >-
        One named part of the CISA/NSA/NIST factsheet. `state: "not-tracked"` means this
        product has no data source for the section at all (e.g. no roadmap-document
        attachment, no vendor register) — `percentComplete` is null in that case, never 0,
        because 0 would assert a measurement nobody took.
      properties:
        id:
          type: string
          enum: [roadmap, cryptographic-inventory, prioritisation, vendor-engagement, supply-chain]
        label:
          type: string
        definition:
          type: string
          description: What "complete" means for this section, stated plainly rather than left implicit.
        state:
          type: string
          enum: [tracked, not-tracked]
        percentComplete:
          type: integer
          nullable: true
        numerator:
          type: integer
          nullable: true
        denominator:
          type: integer
          nullable: true
        reason:
          type: string
      required:
        - id
        - label
        - definition
        - state
        - percentComplete
        - numerator
        - denominator
        - reason

    ReadinessSummary:
      type: object
      description: >-
        D1 Row 1 plus the estate coverage meter (Row 3) it is partly defined against, in one
        payload so the two cannot disagree. Deliberately carries no combined/overall
        readiness score — averaging a measured section with an untracked one would invent a
        denominator, and that is the one number a buyer would screenshot and nobody could
        defend.
      properties:
        generatedAt:
          type: string
          format: date-time
        framing:
          type: string
          description: >-
            States the factsheet's name and date. The factsheet is organised into named
            sections, not a numbered stage sequence — this must never read as a CISA-authored
            numbering.
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessSection"
        coverage:
          $ref: "#/components/schemas/EstateCoverage"
      required:
        - generatedAt
        - framing
        - sections
        - coverage

    EstateCoverage:
      type: object
      description: >-
        The same shape and the same honesty rules as `ProjectCoverage` (D3's per-project
        meter), computed over the whole organisation instead of one project — reusing
        `summariseProjectCoverage` verbatim, since its output never depended on a project
        scope in the first place. No `projectId`: the whole point is that it is not one.
      properties:
        examinedSurfaces:
          type: integer
        totalSurfaces:
          type: integer
        surfaces:
          type: array
          items:
            $ref: "#/components/schemas/SurfaceCoverage"
        confidence:
          $ref: "#/components/schemas/ConfidenceSummary"
      required:
        - examinedSurfaces
        - totalSurfaces
        - surfaces
        - confidence

    InventoryMoscaSummary:
      type: object
      description: >-
        Reuses the same exported Mosca primitives `PostureTimeline` scores its estate-wide
        series with, so the two panels cannot disagree about what "breached" means.
      properties:
        x:
          type: number
          description: Secrecy lifetime in years, as resolved through A3 (asset → project → product default).
        y:
          type: number
          description: Migration time in years, from effort hours. Zero across the board until effort estimation ships.
        xAssumed:
          type: boolean
          description: True when X was defaulted rather than supplied at the asset or project level.
        applicable:
          type: boolean
          description: False when the algorithm carries no quantum-vulnerable track — nothing for Q-Day to break.
        breachedScenarios:
          type: array
          items:
            type: string
          description: Q-Day scenario names this asset breaches under. Empty when not applicable.
      required:
        - x
        - y
        - xAssumed
        - applicable
        - breachedScenarios

    EnrichedInventoryAsset:
      type: object
      properties:
        id:
          type: integer
        fingerprint:
          type: string
        projectId:
          type: integer
          nullable: true
          description: Null for a surface with no project association (TLS, certificate, KMS).
        surface:
          type: string
        algorithm:
          type: string
        keySize:
          type: integer
          nullable: true
        location:
          type: string
        status:
          type: string
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        ownerId:
          type: integer
          nullable: true
        dataClassification:
          type: string
          nullable: true
        secrecyLifetimeYears:
          type: integer
          nullable: true
        classificationSource:
          type: string
          enum: [asset, project, default]
          description: Where the classification behind `mosca.x` actually came from.
        latestConfidence:
          type: number
          nullable: true
          description: Most recent observation's confidence. Null when the asset has never been observed.
        compliance:
          allOf:
            - $ref: "#/components/schemas/FindingCompliance"
          nullable: true
          description: Null when the mapping data has no entry for this algorithm.
        mosca:
          $ref: "#/components/schemas/InventoryMoscaSummary"
      required:
        - id
        - fingerprint
        - projectId
        - surface
        - algorithm
        - keySize
        - location
        - status
        - firstSeen
        - lastSeen
        - ownerId
        - dataClassification
        - secrecyLifetimeYears
        - classificationSource
        - latestConfidence
        - compliance
        - mosca

    InventoryAssetsSummary:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        assets:
          type: array
          items:
            $ref: "#/components/schemas/EnrichedInventoryAsset"
        statusCounts:
          type: object
          additionalProperties:
            type: integer
          description: >-
            Every asset status in the organisation, `gone` included — so drift can be
            reported without a removed asset ever appearing in `assets` as if still present.
        scenarios:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              qDayYear: { type: integer }
              rationale: { type: string }
              confidence: { type: string }
            required: [name, qDayYear, rationale, confidence]
        framing:
          type: string
          description: Mandatory wherever a scenario year is shown.
      required:
        - generatedAt
        - assets
        - statusCounts
        - scenarios
        - framing

    SubmitProjectCertificatesBody:
      type: object
      properties:
        files:
          type: array
          description: >-
            Certificate files. `content` is PEM text (one or more concatenated certificate
            blocks) or base64-encoded DER. Anything else is ignored rather than rejected, so a
            caller may submit a whole tree.
          items:
            type: object
            properties:
              path:
                type: string
              content:
                type: string
            required:
              - path
              - content
      required:
        - files

    CertificateQDayVerdict:
      type: object
