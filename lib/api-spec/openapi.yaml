        - framework
        - frameworkName
        - requirement
        - citation
        - confidence
        - draftStatus
        - algorithms
        - assets
        - caveats
    EstateRollup:
      type: object
      properties:
        projects:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              assets: { type: integer }
              presentAssets: { type: integer }
            required: [id, name, assets, presentAssets]
        unassociatedAssets:
          type: integer
          description: Assets whose location carries no project prefix. Surfaces such as tls/certificate have no project.
        totalAssets: { type: integer }
        presentAssets: { type: integer }
      required: [projects, unassociatedAssets, totalAssets, presentAssets]
    PostureTimelineInputs:
      type: object
      properties:
        secrecyLifetime:
          type: object
          properties:
            bySource:
              type: object
              additionalProperties: { type: integer }
            assumedForAssets: { type: integer }
            bases:
              type: array
              items: { type: string }
          required: [bySource, assumedForAssets, bases]
        migrationYears:
          type: object
          properties:
            defaultValue: { type: number }
            assetsWithRecordedEffort: { type: integer }
            basis:
