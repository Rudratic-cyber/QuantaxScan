  /projects/{id}/certificates:
    post:
      operationId: submitProjectCertificates
      tags: [projects]
      summary: Submit certificates for X.509 collection (B4)
      description: >-
        Runs the certificate collector over the submitted PEM/DER files and persists what it
        finds as assets on the `certificate` surface, which is what makes that surface count
        as examined in `GET /projects/{id}/coverage`.


        `content` is PEM text (one or more concatenated `-----BEGIN/END CERTIFICATE-----`
        blocks — a full chain is read entirely, not just its leaf) or base64-encoded DER.
        A file that is neither contributes nothing, silently.


        **If no submitted file contains a parseable certificate, no collection run is
        recorded** and `certificatesRecognised` is 0 — the same "examined nothing, not
        found nothing" distinction `POST /projects/{id}/dependencies` makes, and it is a 200,
        not an error.


        Each returned certificate carries `qDay`: whether its `notAfter` falls on or after
        each Q-Day scenario's year, derived fresh on every call rather than stored — see
        `GET /projects/{id}/certificates` for the persisted-inventory read this backs.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProjectCertificatesBody"
      responses:
        "200":
          description: Collection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIngestSummary"
        "400":
          description: Invalid project ID, body, or too many certificates in one submission
        "404":
          description: Not found
    get:
      operationId: getProjectCertificates
      tags: [projects]
      summary: The project's certificate inventory, evaluated against Q-Day (B4)
      description: >-
        Every certificate asset attributed to this project, each evaluated against every
        Q-Day scenario at read time — never persisted, because Q-Day scenarios are
        customer-overridable (see `lib/risk`) and a stored verdict would go stale exactly the
        way C1 exists to prevent. Includes assets of every lifecycle status, not only
        `active`; a report of what was found must keep what was later remediated or waived
        in the record.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Certificate inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCertificates"
        "400":
          description: Invalid project ID
        "404":
          description: Not found

  /projects/{id}/tls:
    post:
      operationId: submitProjectTls
      tags: [projects]
      summary: Probe a project's hosts for the TLS handshake they actually negotiate (B3)
      description: >-
        Opens a real TLS connection to each submitted `host`/`port` and records what was
        *negotiated* — cipher suite, key-exchange group, protocol version, and the peer
        certificate's public key type/size — not what a config file claims. Persists what it
        finds as assets on the `tls` surface, which is what makes that surface count as
        examined in `GET /projects/{id}/coverage`.


        A caller-supplied host is refused before any connection is attempted if it resolves to
        a loopback, private, link-local (including the cloud metadata service) or otherwise
        non-routable address. The refusal reason is not detailed in the response — only
        `refused`, distinguished from a target that was reachable in principle but did not
        answer (`unreachable`) or one that completed a handshake (`probed`).


        **If no target's handshake completes, no collection run is recorded** and
        `targetsProbed` is 0 — the same honesty rule `POST /projects/{id}/dependencies` applies
        for `lockfilesRecognised: 0`. It is a 200, not an error: every target may legitimately
        be unreachable or filtered.


        A host that no longer answers on a resubmission marks its assets `gone`, scoped to
        exactly the targets that were actually probed in this submission — a target refused by
        the guard or that timed out was not observed and does not affect any other target's
        assets.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProjectTlsBody"
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsProbeSummary"
        "400":
          description: Invalid project ID or body
        "404":
          description: Not found

  /projects/{id}/protocol-config:
    post:
      operationId: submitProjectProtocolConfig
      tags: [projects]
      summary: Read the crypto a project's protocol configuration declares (B6)
      description: >-
        Parses submitted SSH (`sshd_config`, `ssh_config`, `authorized_keys`), IPsec/IKE
        (`ipsec.conf`, `swanctl.conf`), JOSE (a JWKS, an OpenID Connect discovery document)
        and SAML metadata files, and persists the algorithms they *declare* as assets on the
        `config` surface — which is what makes that surface count as examined in
        `GET /projects/{id}/coverage`.


        **A declaration is not a negotiation.** This route records what a file states, at
        `configuration_information` modality and a confidence well below `POST
        /projects/{id}/tls`'s observed handshake: a `Ciphers` list is an upper bound on what a
        daemon will accept, not evidence any peer selected an entry from it. Each declaration
        carries a `strength` — `permitted` (an algorithm the endpoint would accept) or
        `materialised` (a specific key or a chosen algorithm, such as an `authorized_keys`
        entry or a published JWK) — because those are different claims.


        The SSH and IPsec families are recognised by filename (including `sshd_config.d/`
        drop-ins); JOSE and SAML files have no conventional filename and are recognised by an
        unambiguous structural marker instead (a `keys` array of JWKs, an
        `*_alg_values_supported` field, an `EntityDescriptor` element).


        **If no submitted file is a configuration this collector understands, no collection run
        is recorded** and `configFilesRecognised` is 0 — the same "examined nothing, not found
        nothing" distinction `POST /projects/{id}/dependencies` makes, and it is a 200, not an
        error. A recognised file that declares no crypto is the *other* case and **does** record
        a run: it was read, and it states nothing. Removing a directive and resubmitting the
        file marks its assets `gone`, scoped to exactly the files this submission read.


        Three deliberate silences, all restated in `evidenceCaveat`: `Include` directives are
        not followed (the caller submits contents, not a filesystem); the absence of a directive
        is not read as the compiled-in default; and an algorithm token with no canonical name —
        including hybrid post-quantum key exchange such as `sntrup761x25519-sha512` — produces
        no declaration rather than a guess.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProjectProtocolConfigBody"
      responses:
        "200":
          description: Collection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolConfigIngestSummary"
        "400":
          description: Invalid project ID, body, or too many configuration files in one submission
        "404":
          description: Not found

  /vendor-assessments:
    get:
      operationId: listVendorAssessments
      tags: [vendor-assessments]
      summary: List this organisation's vendor / third-party assessments (B9)
      description: >-
        The vendor register — every supplier a customer has recorded, newest first. Each entry
        carries `posture`, computed fresh on every read: the `manual_attestation` stamp and its
        confidence, the Q-Day verdicts against the date the vendor *claims* it will be
        post-quantum ready, and the contract-clause reading. Nothing here was observed by a
        collector.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Vendor assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorAssessment"
    post:
      operationId: createVendorAssessment
      tags: [vendor-assessments]
      summary: Record a vendor assessment (B9)
      description: >-
        A form submission, not a collector run: every field but `vendorName` is optional, and an
        omitted field is stored as `null` — "not supplied" — rather than a guessed default. A
        vendor recorded with nothing else reads as awaiting a response, never as compliant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorAssessmentBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "400":
          description: Invalid body
        "201":
          description: Created vendor assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorAssessment"

  /vendor-assessments/{id}:
    get:
      operationId: getVendorAssessment
      tags: [vendor-assessments]
      summary: Get one vendor assessment by id (B9)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Vendor assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorAssessment"
        "400":
          description: Invalid vendor assessment ID
        "404":
          description: Not found
    patch:
      operationId: updateVendorAssessment
      tags: [vendor-assessments]
      summary: Update fields as a questionnaire comes back or a contract is read (B9)
      description: >-
        Every field is optional and only the fields present in the body are changed — omitting a
        field leaves the stored value (including `null`) exactly as it was, it does not clear it.
        Sending an explicit `null` does clear it, which is how a `contractPqcClause` of `absent`
        that turned out to be a misreading is withdrawn back to "nobody has checked" rather than
        to the opposite finding.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVendorAssessmentBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Updated vendor assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorAssessment"
        "400":
          description: Invalid vendor assessment ID or body
        "404":
          description: Not found
    delete:
      operationId: deleteVendorAssessment
      tags: [vendor-assessments]
      summary: Remove a vendor from the register (B9)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "204":
          description: Deleted

  /credentials:
    get:
      operationId: listCredentials
      tags: [credentials]
      summary: List this organisation's stored credentials (F4)
      description: >-
        Metadata only. The stored secret is never returned by this route, and there is no route
        that returns it — the only way out of the store is `redeemCredential()` inside the server
        process, which hands a collector an opaque handle rather than a string. `keyId` names the
        `QUANTAXSCAN_CREDENTIAL_KEYS` entry that encrypted the row, so an operator can tell which
        rows still need re-encrypting after a rotation; it is not itself secret.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Stored credentials, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
    post:
      operationId: createCredential
      tags: [credentials]
      summary: Register a third-party credential (F4)
      description: >-
        The secret is encrypted with AES-256-GCM under a key read from the environment and never
        stored in the database, then discarded from memory. The response carries the same
        metadata as the list route and no secret. A deployment that has configured no credential
        key answers 503 rather than storing anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCredentialBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "400":
          description: Invalid body
        "409":
          description: A credential with that name already exists in this organisation
        "503":
          description: The deployment has configured no credential key, so nothing can be stored
        "201":
          description: Registered credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"

  /credentials/{id}/revoke:
    post:
      operationId: revokeCredential
      tags: [credentials]
      summary: Revoke a credential and destroy its stored material (F4)
      description: >-
        Sets `revokedAt` and nulls the ciphertext, IV, tag and key id in the same statement, so
        revocation is a destruction of the material rather than a flag a later query could forget
        to check. The row survives, because "this organisation held this credential between these
        dates" is what an incident review needs. Idempotent: re-revoking returns the credential
        with its original `revokedAt`. There is no un-revoke — register a new one.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "400":
          description: Invalid credential ID
        "404":
          description: Not found in this organisation
        "200":
          description: Revoked credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"

  /projects/{id}/kms/poll:
    post:
      operationId: pollProjectKms
      tags: [projects]
      summary: Read a cloud account's KMS keys with a stored credential (P1)
      description: >-
        The credentialed counterpart to `POST /projects/{id}/kms`. Redeems a credential you
        registered earlier and enumerates the account's KMS keys directly, rather than taking
        an export at its word.


        **Requires the `admin` role**, which `POST /projects/{id}/kms` does not. Holding a
        credential is already admin-only, and being able to *spend* one without holding it
        would route straight around that decision.


        **Submission is not deprecated by this.** `POST /projects/{id}/kms` keeps working
        forever: an air-gapped or on-premises estate has no other path, and a customer who
        declines to issue a read-only credential is a normal customer rather than an edge case.


        The response's `enumeration` block is the part that matters. A poll's normal outcome is
        *partial* — some regions answer, one throttles, one is denied — and the block records
        which is which. A region that refused is never reported as empty, and a run that was
        truncated or had any region refused retires nothing, because a throttled page and an
        empty one are indistinguishable from the outside. `reconciliation` states in one
        sentence whether this run was allowed to retire keys and why.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollProjectKmsBody"
      responses:
        "200":
          description: Poll result, including the boundary of what it can speak for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsPollSummary"
        "400":
          description: Invalid project ID or body
        "404":
          description: Project or credential not found
        "409":
          description: >-
            The credential is revoked, expired, or cannot be decrypted. No collection happened —
            deliberately not a 200 with an empty result, which would make an unusable credential
            read as an empty key store.
  /projects/{id}/kms:
    post:
      operationId: submitProjectKms
      tags: [projects]
      summary: Submit a managed key-store inventory for collection (B5)
      description: >-
        Classifies the keys a managed key store holds — HashiCorp Vault, AWS KMS, Azure Key
        Vault, GCP KMS — and persists what it finds as assets on the `kms` surface, which is
        what makes that surface count as examined in `GET /projects/{id}/coverage`.


        **This is a submission route, not a credentialed poller.** You send the key inventory
        your own tooling already produced; no credential for the key store ever reaches this
        product, and nothing here connects to a cloud provider. The corollary is stated in
        every response's `evidenceCaveat`: the export is taken at its word, and nothing proves
        it is complete, current, or from the key store you say it is.


        Each key's provider-native spec string is resolved against the cited table in
        `docs/Claude/mappings/kms-key-specs.json`. A spec whose primitive this product does
        not report on (HMAC, ChaCha20-Poly1305, SM2, any post-quantum parameter set, Azure's
        `kty: oct`) yields no asset and is returned with `outcome: no-algorithm` and the
        table's own reason — never the nearest similar algorithm.


        **A submission whose keys are all unclassified still records a collection run.** That
        is the one place this route's honesty rule differs from
        `POST /projects/{id}/dependencies`: a key store holding only symmetric keys was
        genuinely examined, and reporting it as un-examined would be the false statement. Only
        an empty `keys` array records no run.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProjectKmsBody"
      responses:
        "200":
          description: Collection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsIngestSummary"
        "400":
          description: Invalid project ID, body, or too many keys in one submission
        "404":
          description: Not found
    get:
      operationId: getProjectKmsKeys
      tags: [projects]
      summary: The project's managed key inventory, including rotation posture (B5)
      description: >-
        Every KMS key asset attributed to this project. This is the read that answers "what
        does the inventory say", as opposed to the POST response, which only reports what one
        submission found at the moment it was submitted.


        It exists as its own route rather than leaning on `GET /inventory/assets` because that
        endpoint does not return `locationDetail`, and everything specific to a key store —
        provider, key id, spec, rotation state, origin, key store — lives there. Includes
        assets of every lifecycle status, not only `active`.


        `rotationEnabled` is null when the submitted export did not state it. That is not the
        same fact as rotation being off, and the two are never collapsed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: KMS key inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectKmsKeys"
        "400":
          description: Invalid project ID
        "404":
          description: Not found

  /projects/{id}/data-at-rest:
    post:
      operationId: submitProjectDataAtRest
      tags: [projects]
      summary: Submit a description of encrypted stores for data-at-rest collection (B7)
      description: >-
        Records what a database, backup, archive, volume or object store reports about its
        own encryption, and persists it as assets on the `data-at-rest` surface — which is
        what makes that surface count as examined in `GET /projects/{id}/coverage`.


        Nothing is connected to. The caller submits what their engine's configuration
        already reports (`pg_settings`, `sys.dm_database_encryption_keys`,
        `V$ENCRYPTED_TABLESPACES`, a bucket's SSE configuration, a backup job definition).
        Credentialed collection against a live database is deliberately not offered: it
        would need a secret-handling design this product does not have yet (F4).


        **Each store produces up to two assets, not one.** `dataEncryption` is the bulk
        cipher over the stored data — usually AES, which NIST does not consider
        quantum-vulnerable. `keyProtection` is how that data key is wrapped, and that is
        where Shor applies: an AES-256 store whose key is wrapped with RSA-2048 is a
        harvest-now-decrypt-later target however strong the bulk cipher is.


        **A store reported as encrypted with no cipher named records nothing and is
        returned as a `cipher-not-reported` gap.** It never becomes AES-256. That case is
        also excluded from the reobservation scope, so leaving the field blank on a
        resubmission cannot mark a previously recorded cipher `gone`.


        `dataClassification` / `secrecyLifetimeYears` are persisted on the store's assets
        and are what `GET /api/inventory/assets` resolves X from. Omit them and X falls
        back to the project's default and then the product's, flagged as assumed — see
        `classificationSource` on the read below.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProjectDataAtRestBody"
      responses:
        "200":
          description: Collection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataAtRestIngestSummary"
        "400":
          description: Invalid project ID, body, or too many stores in one submission
        "404":
          description: Not found
    get:
      operationId: getProjectDataAtRest
      tags: [projects]
      summary: The project's data-at-rest inventory with its Mosca verdict (B7)
      description: >-
        Every data-at-rest asset attributed to this project, grouped back into the store it
        belongs to, with X resolved and Mosca evaluated at read time — never persisted,
        because the Q-Day scenario years and the standards data behind `quantumVulnerable`
        are both revisable and a stored verdict would go stale exactly the way C1 exists to
        prevent.


        `xAssumed` and `classificationSource` are the honesty half: a store nobody
        classified is reported with the product's default X and says so, rather than
        quietly presenting an assumption as a measurement.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Data-at-rest inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDataAtRest"
        "400":
          description: Invalid project ID
        "404":
          description: Not found

  /projects/{id}/discovery/cloud:
    post:
      operationId: discoverCloudResources
      tags: [projects]
      summary: Enumerate a cloud account's resources with a stored credential (P2)
      description: >-
        Reads an AWS account's storage using a read-only credential you registered, and records
        what it finds as **leads** — places a collector could look. Certificate transparency
        (`POST /projects/{id}/discovery`) finds names in a public log and proves nothing about
        ownership; this proves the account is yours, because you issued the key.


        **Requires the `admin` role.** Spending a credential is gated like holding one.


        **No asset is created, and no surface becomes examined.** A bucket name is not an
        observation of cryptography: until `POST /projects/{id}/data-at-rest` reads its
        encryption configuration, this product knows nothing about the cryptography behind it —
        not a cipher, not a key-wrapping algorithm, not whether it is encrypted at all. The
        coverage meter is deliberately unmoved by this route, and gains only a denominator.


        **Finding a resource is not consent to connect to it.** Enumerating is a control-plane
        read; examining one of the resources is a separate act on a separate route, against
        target ids you name.


        A partial result is the normal outcome and is reported as `partial`, with the exact
        scopes enumerated and refused. A scope that was denied or throttled is never reported
        as empty.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverCloudResourcesBody"
      responses:
        "200":
          description: Enumeration result and the leads it recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudDiscoverySummary"
        "400":
          description: Invalid project ID or body
        "404":
          description: Project or credential not found
        "409":
          description: The credential is revoked, expired, or cannot be decrypted. No enumeration happened.
  /projects/{id}/discovery:
    post:
      operationId: runProjectDiscovery
      tags: [projects]
      summary: Find hosts for a domain from public certificate-transparency logs (D8)
      description: >-
        Turns "name every host you want probed" into "give us your domain". Queries public
        Certificate Transparency logs (RFC 6962) for certificates covering the domain and
        records the names they carry as *discovered targets*. Needs no customer credential —
        CT is public — which is what makes it usable before any cloud access is negotiated.


        **A discovered name is a lead, not an asset.** Nothing here writes to `assets`,
        `observations` or `collection_runs`, and no surface becomes examined. A CT entry
        proves exactly one thing: some CA issued a certificate carrying this name. It does
        not prove a host exists there, that anything is served from it now, or that this
        organisation owns it. Every response repeats that in `evidenceCaveat`, and the
        names are unverified until a collector examines one.


        **Three kinds of name are refused rather than recorded**, each with its reason in
        `rejected[]`: a wildcard (`*.example.com` covers a set of names and is evidence for
        none of them), a name outside the domain matched at a **label boundary** (`%.` is a
        SQL `LIKE` wildcard at the source, so `notexample.com` and
        `example.com.attacker.test` come back from the query and are somebody else's), and
        an IP literal. `namesRead` versus the length of `targets` is what makes the
        filtering visible rather than silent.


        Names are additionally looked up in DNS as *corroboration*, never as a source of
        names — DNS cannot enumerate without a wordlist (guessing) or a zone transfer (a
        credential). `dnsResolution` is three-valued: a resolver that timed out or returned
        SERVFAIL establishes `undetermined`, never `not-resolved`, and a name never looked
        up is `null`.


        **Discovering a host is not consent to scan it.** Nothing here opens a connection
        to a discovered name. Handing names to B3's TLS prober is a separate, explicitly
        requested call — `POST /projects/{id}/discovered-targets/probe`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunProjectDiscoveryBody"
      responses:
        "200":
          description: Discovery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryRunSummary"
        "400":
          description: Invalid project ID or domain
        "404":
          description: Not found
        "502":
          description: The certificate-transparency source could not be read

  /projects/{id}/discovered-targets:
    get:
      operationId: getProjectDiscoveredTargets
      tags: [projects]
      summary: Every host discovery knows about for this project, and whether it has been examined (D8)
      description: >-
        The read side of D8, and the source of the sentence the coverage meter could never
        say before: "we know of 400 names and 12 have been probed".


        `examined` is **derived on read** by matching each discovered name against the
        `project:{id}:{host}:{port}` locations B3 writes — never stored, so it cannot drift
        from the evidence. `examinedPorts` lists the ports actually observed.


        `coverage.examinedTargets / coverage.knownTargets` is **not estate coverage**.
        Certificate transparency only reveals names given a publicly logged certificate, so
        an internal service, a database or an IP-only endpoint is invisible to this method
        and absent from `knownTargets` entirely. `coverage.basis` states that in the
        payload.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discovered targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDiscoveredTargets"
        "400":
          description: Invalid project ID
        "404":
          description: Not found

  /projects/{id}/discovered-targets/probe:
    post:
      operationId: probeDiscoveredTargets
      tags: [projects]
      summary: Hand named discovered targets to the TLS prober (D8 → B3)
      description: >-
        The explicit consent boundary between discovery and scanning, and the reason it is
        a separate route rather than a flag on discovery.


        Probing a host is an outbound connection from this server to a machine the customer
        may not own — discovery having *found* a name is not permission to connect to it,
        and a CT log routinely names hosts that turn out to belong to a supplier, a former
        subsidiary, or an unrelated third party. So the caller must name the target ids
        explicitly; there is no "probe everything discovered" shortcut, deliberately, and
        the `port` has no default because a discovered name carries no port.


        Each named target is confirmed visible inside the caller's organisation scope
        **before** any connection is opened, so an id belonging to another tenant produces
        no egress at all. Results are ingested through B3's existing collector, so the
        assets, observations and collection run are identical to a hand-submitted probe —
        and reobservation is scoped to exactly the targets that completed a handshake, so a
        target that timed out never marks anything `gone`.


        At most 20 targets per call, the same ceiling as `POST /projects/{id}/tls`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeDiscoveredTargetsBody"
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveredTargetProbeSummary"
        "400":
          description: Invalid project ID, body, or too many targets in one call
        "404":
          description: Not found
  /projects/{id}/network-flows:
    post:
      operationId: submitProjectNetworkFlows
      tags: [projects]
      summary: Submit flow/session records for network-conversation collection (B11)
      description: >-
        Records **conversations between endpoints** — both ends of each one — from
        flow and session records the caller's own infrastructure already produces:
        a VPC flow log, a load-balancer access log, a service-mesh telemetry export,
        a firewall session log.


        **No packet capture and no network tap.** Real-time traffic interception is
        an explicit twelve-month non-goal for this product; this route is the passive
        alternative, and it reads records that already exist rather than creating a
        new observation point.


        **Cryptography is recorded only when a record actually names a cipher
        suite.** Most flow-log formats carry none. Such a conversation is persisted
        with `cryptoState: undetermined` — which is a real inventory entry meaning
        "we saw this conversation and do not know what protected it", not a clean
        result. `flowsWithUndeterminedCryptography` in the response is how much of
        the project is in that state. The port is never used to infer anything:
        443 is not evidence of TLS 1.3, or of TLS.


        **A TLS 1.3 suite name records no key exchange.** `TLS_AES_128_GCM_SHA256`
        names the AEAD and the hash and nothing else (RFC 8446 §1.2), so only the
        AES observation is recorded; the mandated (EC)DHE exchange is reported as a
        `key-exchange-not-named` gap rather than assumed.


        **The source port is discarded.** It is accepted so a raw record can be
        submitted unchanged, and then dropped: it changes on every connection, and
        keying a conversation on it would mint a new row per TCP handshake. A
        conversation's identity is transport + source identity + destination
        identity + destination port; the *cryptography* is identified at the
        destination service endpoint only, so many clients dialling one service
        produce many conversations and one set of assets.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProjectNetworkFlowsBody"
      responses:
        "200":
          description: Collection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkFlowIngestSummary"
        "400":
          description: Invalid project ID, body, or too many records in one submission
        "404":
          description: Not found
    get:
      operationId: getProjectNetworkFlows
      tags: [projects]
      summary: The project's network conversations and the cryptography protecting them (B11)
      description: >-
        Every conversation recorded for this project, with both endpoints and the
        cryptography observed at the far end joined on — so one response answers the
        whole question rather than half of it.


        A conversation with `cryptoState: undetermined` comes back with an empty
        `cryptography` array. That is the honest reading and it is deliberately not
        hidden: `flowsWithUndeterminedCryptography` counts them, because a coverage
        meter that only sees a completed run with zero observations would render the
        surface as examined-and-nothing-found, which reads as clean.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Network conversation inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectNetworkFlows"
        "400":
          description: Invalid project ID
        "404":
          description: Not found

  /projects/{id}/endpoint:
    post:
      operationId: submitProjectEndpoint
      tags: [projects]
      summary: Submit a host agent's endpoint report for the Windows/Linux fleet (EP)
      description: >-
        Records what a Windows or Linux host has configured and trusts — its machine
        certificate stores, its TLS policy (Schannel protocol and cipher-suite settings, or
        an OpenSSL/GnuTLS configuration), the cryptographic providers it has loaded, and the
        OS build — and persists it as assets on the `endpoint` surface, which is what makes
        that surface count as examined in `GET /projects/{id}/coverage`.


        **No agent ships with this product yet, and that is deliberate.** This route is the
        contract a host agent reports *against*: a binary running on a customer's domain
        controller is a packaging and security-review problem far larger than a collector,
        and it cannot authenticate to anything until credential handling (F4) lands. The
        format and the ingest exist first, so the agent has a defined thing to send.


        **A supported cipher suite is not a used one.** Every observation carries a
        `strength` — `permitted` (the host would negotiate this if a peer asked; most of a
        Schannel suite list never is) or `materialised` (a certificate that is in this
        host's store now) — and both sit well below `POST /projects/{id}/tls`'s observed
        handshake. **A suite the host disabled is never reported at all**: Windows keeps the
        suite list and the per-algorithm `Ciphers`/`Hashes` switches in two independent
        registry locations, so `disabledAlgorithms` suppresses the whole suite, and every
        suppression is echoed under `suppressedSuites` so it is auditable rather than
        invisible.


        **Host identity is the machine, never the hostname.** `machineId` is the identifier
        the OS mints at install — Windows' `MachineGuid`, Linux' `/etc/machine-id` — which
        survives a rename, a reboot and a re-address, and changes on a re-image. Hostnames
        get reused, which would silently merge a decommissioned server with its replacement.
        A placeholder identity (a cleared `MachineGuid`, an all-zero machine-id) is refused,
        and two hosts in one submission reporting the same identity are a clone collision:
        **both** are refused, because merging them would produce one host whose stores and
        policy interleave two different machines. Refused hosts are returned by name under
        `hosts[].skipped` — a host missing from the result would be indistinguishable from
        one with nothing to report.


        **Every section of a host report is optional and absent means "not collected".** An
        agent that read the TLS policy but not the certificate stores leaves that host's
        certificates untouched rather than retiring them; a section that is present and
        empty was read and holds nothing, which correctly marks what used to be there
        `gone`.


        **If no host in the submission can be identified, no collection run is recorded** and
        `hostsIngested` is 0 — the same "examined nothing, not found nothing" distinction
        `POST /projects/{id}/dependencies` makes, and it is a 200, not an error. A host that
        was read and declares nothing reportable is the *other* case and does record a run.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProjectEndpointBody"
      responses:
        "200":
          description: Collection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointIngestSummary"
        "400":
          description: Invalid project ID, body, or too many hosts in one submission
        "404":
          description: Not found
    get:
      operationId: getProjectEndpoint
      tags: [projects]
      summary: The project's host fleet, reassembled from its endpoint assets (EP)
      description: >-
        Every `endpoint` asset attributed to this project, grouped back into the host it was
        read from, with that host's OS build, loaded providers and protocol posture.


        Not redundant with `GET /inventory/assets?surface=endpoint`, which returns no
        `locationDetail` — the machine identity, the certificate store an entry sits in, the
        enabled and disabled protocol lists and the provider inventory all live there, so
        without this route a host's posture would be write-only.


        There is no host row behind this: a host exists only as the assets it produced, so a
        machine that reported a fully hardened policy and an empty store is recorded as a
        collection run (`GET /projects/{id}/coverage` shows the surface as examined) but does
        not appear here. Giving the surface its own host table is a follow-up.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Host fleet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEndpointFleet"
        "400":
          description: Invalid project ID
        "404":
          description: Not found

  /collection-schedules:
    get:
      operationId: listCollectionSchedules
      tags: [continuity]
      summary: List this organisation's re-collection schedules (M3)
      description: >-
        Every schedule, with its recent attempts. `lastRunAt` and `lastSucceededAt` are two
        different facts and both are reported: a schedule attempted hourly for a week whose host
        has been unreachable all week has a recent `lastRunAt` and a week-old `lastSucceededAt`,
        and reporting only the first would make an unobserved estate read as freshly verified.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Collection schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectionSchedule"
    post:
      operationId: createCollectionSchedule
      tags: [continuity]
      summary: Schedule a collection target for re-collection (M3)
      description: >-
        `targetKind` is deliberately a much smaller vocabulary than `surface`. Only `tls` is
        schedulable, because it is the one collector that observes the world on its own rather
        than reading a file a human uploaded; replaying a stored upload would re-derive the
        identical result and keep `lastSeen` moving on assets nobody has actually looked at.


        A new schedule is due immediately (`nextRunAt` = now), so the first `run-due` call after
        creation collects it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionScheduleBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "400":
          description: Invalid body, or an interval below the 15-minute minimum
        "404":
          description: Project not found
        "201":
          description: Created schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionSchedule"

  /collection-schedules/run-due:
    post:
      operationId: runDueCollectionSchedules
      tags: [continuity]
      summary: Execute every schedule of this organisation that is due (M3)
      description: >-
        The runner. Org-scoped on purpose — finding due work across every tenant would mean
        reading an organisation-scoped table outside any organisation scope, which this codebase
        forbids — so an external scheduler calls this per organisation with that organisation's
        credential.


        Every attempt is recorded, including the ones that produced nothing. An attempt whose
        targets were all unreachable is reported as `no_evidence`, writes no collection run, and
        **cannot mark any asset `gone`**: reobservation scope is paired with what was actually
        observed, so an unreached host is never reported as remediated.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: What the runner executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDueSchedulesResult"

  /collection-schedules/{id}:
    patch:
      operationId: updateCollectionSchedule
      tags: [continuity]
      summary: Pause, retarget or re-cadence a schedule (M3)
      description: >-
        Only the fields present in the body change. Disabling a schedule keeps it and its history
        rather than deleting it, so a noisy target can be paused without losing the target list.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollectionScheduleBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionSchedule"
        "400":
          description: Invalid schedule ID or body
        "404":
          description: Not found
    delete:
      operationId: deleteCollectionSchedule
      tags: [continuity]
      summary: Remove a schedule (M3)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "204":
          description: Deleted
        "400":
          description: Invalid schedule ID

  /drift:
    get:
      operationId: getDrift
      tags: [continuity]
      summary: What appeared, changed and stopped being observed since a timestamp (D4)
      description: >-
        Drift, derived entirely on read from the `assets` lifecycle. Nothing here is persisted:
        a stored drift verdict would go stale the moment a standard or a Q-Day scenario moved,
        which is the C1 failure this product exists to fix.


        **Read `surfaces[]` before reading any list as empty.** A surface with
        `observedInWindow: false` was not collected during the window, so an empty
        `disappeared` list says nothing about it. Empty-because-nothing-changed and
        empty-because-nobody-looked are different statements and this payload keeps them apart.


        **Nothing here is called remediated.** Every `disappeared` entry carries
        `meaning: "not-observed"` and the id of the collection run that failed to observe it, so
        the claim can be audited. A collector that did not run, an expired credential, a host
        behind a firewall and a submission nobody repeated all produce the same absence, and only
        a human who has checked can call one of them fixed.
      parameters:
        - name: since
          in: query
          required: false
          description: >-
            ISO-8601 instant the window starts at. Defaults to seven days before now.
          schema:
            type: string
            format: date-time
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "400":
          description: Invalid `since`
        "200":
          description: Drift over the window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriftFeed"

  # ── F1 — sign-in ────────────────────────────────────────────────────────
  # Five of these six carry `security: []`, and it is not an oversight: every
  # one of them is how a caller *becomes* authenticated, so requiring a
  # credential to reach them would be a deadlock. They agree with
  # `PUBLIC_ROUTES` in `artifacts/api-server/src/lib/auth.ts`, which
  # `openapi-drift.test.ts` checks in both directions.

  /auth/providers:
    get:
      operationId: listAuthProviders
      tags: [auth]
      security: []
      summary: Identity providers this deployment can sign a person in with (F1)
      description: >-
        Empty when sessions are not configured, which is a real deployment state rather than an
        error — the product ran on a shared API key alone before F1 and still can. A provider
        absent from this list is one nobody can sign in with, whatever the documentation says:
        Google and Microsoft are deliberately unimplemented (see 13-auth-and-tenancy.md §3.3), so
        they do not appear here.
      responses:
        "200":
          description: The configured providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviderList"

  /auth/{provider}/start:
    get:
      operationId: startAuthFlow
      tags: [auth]
      security: []
      summary: Begin an authorization-code sign-in (F1)
      description: >-
        Mints `state`, a PKCE verifier and (where the provider uses one) a nonce, stores them on
        the session, and redirects to the provider. The session row is created *here* rather than
        on first contact — `saveUninitialized: false`, so a visitor who never clicks sign-in never
        touches the database. The save is explicit and awaited, because a redirect racing the
        session write lands the callback before the transaction it must match against exists.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
          description: Where to land after a successful sign-in. Validated as a same-site relative path; anything else is ignored rather than followed.
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [link]
          description: Link this provider to the already-signed-in account. Ignored unless a session already exists.
      responses:
        "302":
          description: Redirect to the provider's authorization endpoint
        "404":
          description: >-
            Unknown *or unconfigured* provider. Deliberately the same answer for both — which
            providers a deployment has configured is not something an anonymous caller should be
            able to enumerate.
        "503":
          description: Sessions are not configured on this deployment

  /auth/{provider}/callback:
    get:
      operationId: completeAuthFlow
      tags: [auth]
      security: []
      summary: Complete an authorization-code sign-in (F1)
      description: >-
        Verifies `state` against the stored transaction, exchanges the code with PKCE, and
        establishes the session. The transaction is single-use: a replayed callback finds nothing
        to match and fails. This is the one code path that decides who a request is, so it fails
        closed on every branch rather than falling through to an anonymous session.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Signed in; redirected to `returnTo` or the default landing path
        "400":
          description: Missing, mismatched or already-used `state`, a provider-reported error, or a failed exchange
        "404":
          description: Unknown or unconfigured provider
        "409":
          description: The identity belongs to another account and linking was not requested
        "503":
          description: Sessions are not configured on this deployment

  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      security: []
      summary: Who the caller is, if anyone (F1)
      description: >-
        Answers **200 with `user: null`** for an anonymous visitor rather than 401. This is called
        on every page load, including by people who have never signed in, and an anonymous visitor
        is a normal state — a 401 here would be indistinguishable from a real failure and would
        make the client treat "not signed in yet" as an error.


        The active organisation is reported as an id and a role, never a name: a solo user is an
        organisation of one and should never meet the concept, which the client implements by
        rendering nothing when there is a single membership.
      responses:
        "200":
          description: The current session, or the anonymous shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      security: []
      summary: End the local session (F1)
      description: >-
        Idempotent, and public on purpose: signing out of an already-expired session must succeed
        rather than 401 the one action whose whole job is to end it. Local only — RP-initiated
        logout at the provider is not implemented (13-auth-and-tenancy.md §3.10).
      responses:
        "204":
          description: Signed out, whether or not a session existed

  /auth/organizations/{id}/select:
    post:
      operationId: selectOrganization
      tags: [auth]
      summary: Switch the active organisation for this session (F1)
      description: >-
        The **only** route in this group that is not public, because it is the only one that acts
        on behalf of somebody already signed in. Membership is re-checked here rather than trusted
        from the session: a membership revoked since sign-in must take effect on the next request,
        not at the next sign-in.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The newly active organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveOrganization"
        "400":
          description: Invalid organisation id
        "403":
          description: Not signed in, or not a member of that organisation

  # ── RBAC — divisions, grants and members ────────────────────────────────
  # Every write here needs `admin`; the gate is central (lib/require-role.ts),
  # not a check inside each handler. `GET /divisions` is deliberately readable
  # by a viewer: a person restricted to Payments sees that Retail exists, by
  # name, holding none of their data — hiding its existence makes "why can't I
  # see Retail?" unanswerable by the one person experiencing it.

  /divisions:
    get:
      operationId: listDivisions
      tags: [divisions]
      summary: Divisions in this organisation, with how many projects each holds (RBAC)
      description: >-
        Project counts are computed from what the caller can see rather than stored, because a
        cached total would be a second source of truth able to disagree with the policy that
        decides visibility. `organizationWideProjects` counts projects belonging to no division —
        visible to everyone in the tenant, and not any division's omission.
      responses:
        "200":
          description: The organisation's divisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DivisionList"
    post:
      operationId: createDivision
      tags: [divisions]
      summary: Create a division (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDivisionBody"
      responses:
        "201":
          description: The created division
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Division"
        "400":
          description: Missing name, or a slug that is not lower-case letters, digits and single hyphens
        "403":
          description: Not an admin
        "409":
          description: That slug is already used in this organisation

  /divisions/{id}:
    patch:
      operationId: updateDivision
      tags: [divisions]
      summary: Rename or re-describe a division (admin)
      description: >-
        The slug is deliberately immutable — it appears in URLs people have bookmarked.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDivisionBody"
      responses:
        "200":
          description: The updated division
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Division"
        "400":
          description: Invalid id, or nothing to update
        "403":
          description: Not an admin
        "404":
          description: Not found
    delete:
      operationId: deleteDivision
      tags: [divisions]
      summary: Dissolve a division (admin)
      description: >-
        The projects inside it are **not** deleted — `projects.division_id` is `ON DELETE SET
        NULL`, so they become organisation-wide, which is the state they were in before divisions
        existed and the only safe reading of "the team was dissolved". The response says how many
        projects that affected: silence would let an admin widen who can see a team's work without
        realising it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Dissolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectsReleased:
                    type: integer
                    description: Projects that just became organisation-wide.
                required: [projectsReleased]
        "403":
          description: Not an admin
        "404":
          description: Not found

  /divisions/{id}/grants:
    post:
      operationId: grantDivisionRole
      tags: [divisions]
      summary: Grant a member a role on this division (admin)
      description: >-
        A grant only ever **raises**: the effective role on a project is the stronger of the
        organisation role and any grant on that project's division. "Viewer on Payments" for
        somebody who is already an organisation member is a no-op, not a demotion — expressing
        "admin everywhere except Payments" needs a deny model, which is a different feature.


        Both parents are confirmed inside the caller's scope before the row is written: a foreign
        key is checked with row-level security bypassed, so PostgreSQL would otherwise accept
        another organisation's division id or a stranger's user id.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDivisionGrantBody"
      responses:
        "201":
          description: The grant, created or updated in place
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DivisionGrant"
        "400":
          description: Missing userId, or a role outside viewer/member/admin
        "403":
          description: Not an admin
        "404":
          description: No such division, or that user is not a member of this organisation

  /divisions/{id}/grants/{userId}:
    delete:
      operationId: revokeDivisionGrant
      tags: [divisions]
      summary: Revoke a division grant (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Revoked
        "403":
          description: Not an admin
        "404":
          description: No such grant

  /organization/members:
    get:
      operationId: listOrganizationMembers
      tags: [divisions]
      summary: Who is in this organisation, at what role (admin)
      description: >-
        Admin-only: a membership list names every colleague and what each of them may do.
      responses:
        "200":
          description: Members and their division grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberList"
        "403":
          description: Not an admin

  /organization/members/{userId}:
    patch:
      operationId: updateOrganizationMemberRole
      tags: [divisions]
      summary: Change a member's organisation role (admin)
      description: >-
        Refuses to remove the last owner. An organisation with no owner has nobody who can
        transfer or delete it — a state no support call can resolve, and one keystroke away when
        an admin demotes themselves.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [viewer, member, admin, owner]
              required: [role]
      responses:
        "200":
          description: The updated membership
        "400":
          description: Invalid user id or role
        "403":
          description: Not an admin
        "404":
          description: Not a member of this organisation
        "409":
          description: That would leave the organisation with no owner

  /waivers:
    get:
      operationId: listWaivers
      tags: [waivers]
      summary: The waivers / exceptions register (C8)
      description: >-
        Every waiver, **expired and revoked included**, each with a computed `status`. There is
        no `where expires_at > now()` behind this route: an exceptions register that forgets the
        exceptions that lapsed cannot answer "what have we been accepting?", which is the only
        question an auditor asks it. `status` is computed on read rather than stored, so it
        cannot go stale at exactly the expiry the feature turns on. `counts` is always over the
        whole register, never over the filtered slice.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, expired, revoked]
          description: Return only waivers in this state. Omit for all of them.
      responses:
        "200":
          description: The register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaiverRegister"
    post:
      operationId: createWaiver
      tags: [waivers]
      summary: Accept a risk, in writing, with an end date (admin)
      description: >-
        Admin-gated. The person best placed to silence an inconvenient finding is the member who
        submitted the scan that raised it, and self-service risk acceptance is how an inventory
        becomes fiction. `expiresAt` is required and has no "never" spelling; it must be in the
        future and at most 730 days away. The asset id is confirmed visible inside the tenant
        scope before the row is written, because a foreign key is checked with row-level security
        bypassed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWaiverBody"
      responses:
        "201":
          description: The granted waiver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Waiver"
        "400":
          description: >-
            Missing or empty `justification`/`signedOffBy`, a missing/invalid `expiresAt`, an
            expiry in the past, or one more than 730 days away.
        "403":
          description: Not an admin
        "404":
          description: No such asset in this organisation

  /waivers/{id}/revoke:
    post:
      operationId: revokeWaiver
      tags: [waivers]
      summary: Withdraw an acceptance early (member)
      description: >-
        Deliberately **not** admin-gated, unlike granting one: revoking restores a finding to the
        working list, which is the fail-safe direction, and un-silencing must not be harder than
        silencing. The waiver is closed, never deleted — a register you can delete from records
        only what nobody minded recording. Revoking an already-expired waiver is allowed and is
        not a no-op: it says the acceptance was withdrawn rather than merely lapsed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The revoked waiver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Waiver"
        "400":
          description: Invalid waiver id
        "404":
          description: No such waiver in this organisation
        "409":
          description: Already revoked

components:
  responses:
    RateLimited:
      description: >-
        Rate limited (S6). The budget depends on the route: GitHub-facing scans,
        local scans, chat and everything else have separate allowances, and the
        health check is exempt. Buckets are keyed on the API key where one is
        presented and on the client address otherwise, so the response is
        identical whether or not the key was valid. `Retry-After` carries the
        number of seconds until the window resets.
      headers:
        Retry-After:
          description: Seconds until the caller may retry.
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
            required:
              - error

  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: Shared API key. Interim control pending per-user auth (F1).
    bearerApiKey:
      type: http
      scheme: bearer
      description: "The same shared API key, sent as `Authorization: Bearer <key>`."

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Project:
      type: object
      description: A `projects` row, exactly as the database holds it.
      properties:
        id:
          type: integer
        organizationId:
          type: integer
          description: >-
            The owning tenant (P1). Isolation is enforced by the row-level security
            policies, never by a where clause, so this is a fact about the row rather
            than a filter a caller may supply.
        name:
          type: string
        description:
          type: string
          nullable: true
        language:
          type: string
        riskScore:
          type: integer
          nullable: true
        lastScanAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        totalScans:
          type: integer
        criticalCount:
          type: integer
        alertCount:
          type: integer
        cleanCount:
          type: integer
        dataClassification:
          allOf:
            - $ref: "#/components/schemas/DataClassification"
          nullable: true
          description: >-
            A3 — the project-level classification every asset inherits unless it overrides
            it. **Nullable with no default, and the null is load-bearing:** it means the
            project sets no default, which is not the same statement as a human choosing
            `internal`. Only the first may be reported as an assumption, so a client must
            distinguish null from a value rather than substituting one.
        secrecyLifetimeYears:
          type: integer
          nullable: true
          description: >-
            A3 — the project-level X (secrecy lifetime) in years, set independently of the
            label. Null for the same reason as `dataClassification`: nobody has said.
      required:
        - id
        - organizationId
        - name
        - language
        - createdAt
        - totalScans
        - criticalCount
        - alertCount
        - cleanCount
        - dataClassification
        - secrecyLifetimeYears

    DataClassification:
      type: string
      description: A3's classification vocabulary, ordered least- to most-sensitive.
      enum: [public, internal, confidential, regulated, indefinite]

    CreateProjectBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        language:
          type: string
        code:
          type: string
      required:
        - name
        - language
        - code

    Scan:
      type: object
      description: >-
        A `scans` row plus the three derived A4 blocks. `pqc`, `hygiene` and `mosca` are
        recomputed from the findings on every read and never stored, so a mappings-data or
        Q-Day-scenario change reaches historical scans without a backfill.
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        projectId:
          type: integer
        mode:
          type: string
          enum: [scan-only, interactive, proactive, community]
        status:
          type: string
          enum: [pending, running, completed, failed]
        riskScore:
          type: integer
          nullable: true
        totalLines:
          type: integer
        criticalCount:
          type: integer
        alertCount:
          type: integer
        cleanCount:
          type: integer
        totalEffortHours:
          type: number
        estimatedCost:
          type: integer
        executiveSummary:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
          description: >-
            The submitted source, as persisted on the row. Null on rows written before it was
            captured, and **always** null when `retentionMode` is `ephemeral`.
        retentionMode:
          $ref: "#/components/schemas/RetentionMode"
        sourceDiscardedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the submitted source was discarded. Set at insert time for an `ephemeral` scan,
            because there is no later moment — the body is never written. Null on a `retained`
            scan, where the source is still there.
        language:
          type: string
          nullable: true
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        pqc:
          $ref: "#/components/schemas/PqcExposure"
        hygiene:
          $ref: "#/components/schemas/HygieneSummary"
        mosca:
          $ref: "#/components/schemas/MoscaAssessment"
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - organizationId
        - projectId
        - mode
        - status
        - totalLines
        - criticalCount
        - alertCount
        - cleanCount
        - totalEffortHours
        - estimatedCost
        - retentionMode
        - pqc
        - hygiene
        - mosca
        - createdAt

    RetentionMode:
      type: string
      enum: [retained, ephemeral]
      description: >-
        F4 — which source-handling tier a submission was processed under, recorded per submission
        so a customer can be told which one their data went through
        (docs/Claude/08-security.md §"Source code handling"). `retained`: the body is persisted on
        `scans.code` and matched lines are persisted as evidence. `ephemeral`: the submission is
        scanned in memory and no source is written anywhere — no `code`, no finding code snippets,
        no `evidence.codeSnippet`. The findings themselves are still persisted; none of them is
        source.

    SubmitProjectDependenciesBody:
      type: object
      properties:
        files:
          type: array
          description: >-
            Repository files. Only recognised lockfiles are read; everything else is ignored.
            `content` is the file verbatim — truncating a lockfile silently drops packages, so
            callers must not send an excerpt.
          items:
            type: object
            properties:
              path:
                type: string
              content:
                type: string
            required:
              - path
              - content
      required:
        - files

    DependencyIngestSummary:
      type: object
      properties:
        projectId:
          type: integer
        lockfilesRecognised:
          type: integer
          description: >-
            How many submitted files the collector could read. Zero means no collection run was
            recorded and the dependency surface is still un-examined for this project.
        lockfiles:
          type: array
          description: The recognised lockfiles and which format each was read as.
          items:
            type: object
            properties:
              path:
                type: string
              kind:
                type: string
                enum:
                  - pnpm-lock
                  - npm-lock
                  - yarn-lock
                  - pip-requirements
                  - maven-pom
                  - gradle-lock
                  - gradle-build
                  - go-mod
                  - go-sum
                  - nuget-lock
                  - nuget-packages-config
                  - dotnet-project
                  - cargo-lock
            required:
              - path
              - kind
        ecosystems:
          type: array
          description: >-
            The package ecosystems this submission actually carried a readable file for, in purl
            spelling. This is the exact set that `assetsMarkedGone` was scoped to, and therefore
            the set of ecosystems this run may make any statement about at all: a submission of
            only `go.mod` has observed nothing whatsoever about the project's Maven tree and
            leaves its Maven assets untouched. Empty when `lockfilesRecognised` is 0.
          items:
            type: string
            enum: [npm, pypi, maven, golang, nuget, cargo]
        collectionRunId:
          type: integer
          nullable: true
          description: Null when no run was recorded (`lockfilesRecognised` is 0).
        assetsCreated:
          type: integer
        assetsUpdated:
          type: integer
        observationsCreated:
          type: integer
        assetsMarkedGone:
          type: integer
          description: >-
            Assets whose package is no longer in a resubmitted lockfile. Scoped to the
            ecosystems this submission carried a lockfile for.
        evidenceCaveat:
          type: string
          description: >-
            Stated in every response rather than left to the client: a lockfile records the
            fully resolved dependency graph, so a match may be a transitive dependency of the
            toolchain rather than a library the project's own code calls.
      required:
        - projectId
        - lockfilesRecognised
        - lockfiles
        - ecosystems
        - collectionRunId
        - assetsCreated
        - assetsUpdated
        - observationsCreated
        - assetsMarkedGone
        - evidenceCaveat

    OtExposureState:
      type: string
      description: >-
        `unknown` is distinct from `clear` — no recorded procurement date means nobody has
        asserted a replacement is coming, which must never be read as safe.
      enum: [exposed, clear, unknown]

    OtExposureVerdict:
      type: object
      description: One Q-Day scenario's exposure verdict for a fleet's next procurement date.
      properties:
        scenario:
          type: string
          enum: [conservative, central, aggressive]
        qDayYear:
          type: integer
        state:
          $ref: "#/components/schemas/OtExposureState"
        narrative:
          type: string
          description: The board-deck sentence — names the date and the scenario, not just the verdict.
      required:
        - scenario
        - qDayYear
        - state
        - narrative

    OtExposureAssessment:
      type: object
      description: >-
        B8's payoff: whether this fleet's next procurement decision falls after each Q-Day
        scenario's year, computed fresh on every read so a scenario change never needs a
        backfill. A fleet with no recorded procurement date is `unknown` under every scenario,
        never `clear`.
      properties:
        nextProcurementDate:
          type: string
          format: date-time
          nullable: true
        verdicts:
          type: array
          items:
            $ref: "#/components/schemas/OtExposureVerdict"
        exposedScenarioCount:
          type: integer
        unknownScenarioCount:
          type: integer
        scenarioCount:
          type: integer
        framing:
          type: string
          description: Mandatory framing for any customer-facing use of the scenario years.
      required:
        - nextProcurementDate
        - verdicts
        - exposedScenarioCount
        - unknownScenarioCount
        - scenarioCount
        - framing

    OtFleet:
      type: object
      description: >-
        An `ot_fleets` row plus its computed exposure — B8, the manual OT/embedded register.
        docs/Claude/03-features.md §B8. Not an `Asset`: nothing here is collected, a human enters
        and edits it by hand, and it carries no `fingerprint`/`surface`/observation lifecycle.
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        name:
          type: string
        vendor:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        deviceCount:
          type: integer
          nullable: true
          description: Null means nobody has counted yet — distinct from a recorded zero.
        site:
          type: string
          nullable: true
        owner:
          type: string
          nullable: true
          description: Free text — a team, role or vendor contact, not necessarily an app user.
        cryptoInUse:
          type: string
          nullable: true
          description: Free-form, customer-asserted description of the cryptography in use.
        cryptoAlgorithm:
          type: string
          nullable: true
          description: >-
            The structured half of `cryptoInUse`, and the only part that becomes an inventory
            asset on the `ot` surface. `cryptoInUse` stays free text — an approximation the
            customer asserts — and is never parsed into an algorithm. Null means nobody stated
            one, and a fleet with none produces no asset at all.
        cryptoKeySize:
          type: integer
          nullable: true
          description: Key size for `cryptoAlgorithm`. Null is undetermined, never an assumed size.
        refreshCycleYears:
          type: integer
          nullable: true
        nextProcurementDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        exposure:
          $ref: "#/components/schemas/OtExposureAssessment"
      required:
        - id
        - organizationId
        - name
        - vendor
        - model
        - deviceCount
        - site
        - owner
        - cryptoInUse
        - refreshCycleYears
        - nextProcurementDate
        - createdAt
        - updatedAt
        - exposure

    CreateOtFleetBody:
      type: object
      properties:
        name:
          type: string
        vendor:
          type: string
        model:
          type: string
        deviceCount:
          type: integer
          minimum: 0
        site:
          type: string
        owner:
          type: string
        cryptoInUse:
          type: string
        cryptoAlgorithm:
          type: string
          nullable: true
          description: >-
            The structured half of `cryptoInUse`, and the only part that becomes an inventory
            asset on the `ot` surface. `cryptoInUse` stays free text — an approximation the
            customer asserts — and is never parsed into an algorithm. Null means nobody stated
            one, and a fleet with none produces no asset at all.
        cryptoKeySize:
          type: integer
          nullable: true
          description: Key size for `cryptoAlgorithm`. Null is undetermined, never an assumed size.
        refreshCycleYears:
          type: integer
          minimum: 0
        nextProcurementDate:
          type: string
          format: date-time
      required:
        - name

    UpdateOtFleetBody:
      type: object
      description: Every field optional; only fields present in the body are changed.
      properties:
        name:
          type: string
        vendor:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        deviceCount:
          type: integer
          minimum: 0
          nullable: true
        site:
          type: string
          nullable: true
        owner:
          type: string
          nullable: true
        cryptoInUse:
          type: string
          nullable: true
        cryptoAlgorithm:
          type: string
          nullable: true
          description: >-
            The structured half of `cryptoInUse`, and the only part that becomes an inventory
            asset on the `ot` surface. `cryptoInUse` stays free text — an approximation the
            customer asserts — and is never parsed into an algorithm. Null means nobody stated
            one, and a fleet with none produces no asset at all.
        cryptoKeySize:
          type: integer
          nullable: true
          description: Key size for `cryptoAlgorithm`. Null is undetermined, never an assumed size.
        refreshCycleYears:
          type: integer
          minimum: 0
          nullable: true
        nextProcurementDate:
          type: string
          format: date-time
          nullable: true

    CreateScanBody:
      type: object
      properties:
        projectId:
          type: integer
        mode:
          type: string
          enum: [scan-only, interactive, proactive, community]
        code:
          type: string
        language:
          type: string
        retentionMode:
          allOf:
            - $ref: "#/components/schemas/RetentionMode"
          description: >-
            Omitted means `retained`, which is what every submission did before F4. Send
            `ephemeral` to have the source scanned in memory and never written — the findings come
            back in the response exactly as they would otherwise, with their code snippets
            replaced by a fixed marker in the persisted rows.
      required:
        - projectId
        - mode
        - code
        - language

    Finding:
      type: object
      properties:
        id:
          type: integer
        organizationId:
          type: integer
          description: >-
            Present on findings read back from the database. Absent on the synthetic
            findings `POST /scans` and the demo route echo straight back from the scanner,
            which are numbered in memory and never persisted with that shape.
        scanId:
          type: integer
        fileName:
          type: string
        lineNumber:
          type: integer
        severity:
          type: string
          enum: [critical, alert, safe]
        algorithm:
          type: string
        codeSnippet:
          type: string
        nistReplacement:
          type: string
          nullable: true
        nistStandard:
          type: string
          nullable: true
        effortHours:
          type: number
        explanation:
          type: string
          nullable: true
        compliance:
          allOf:
            - $ref: "#/components/schemas/FindingCompliance"
          nullable: true
          description: >-
            Resolved by the C1 mapping engine on every read, never stored on the finding row,
            so a standards-data update reaches historical findings too. Null when the mapping
            data has no entry for the algorithm.
      required:
        - id
        - scanId
        - fileName
        - lineNumber
        - severity
        - algorithm
        - codeSnippet
        - effortHours

    Citation:
      type: object
      description: Provenance for a single regulatory claim. Required on every obligation.
      properties:
