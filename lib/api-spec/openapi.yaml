    # ── E1 / E2 — generated report packs ────────────────────────────────────

    ReportCollectorProvenance:
      type: object
      description: One collector, at one version, on one surface. E2's answer to "says who?", rolled up.
      properties:
        collector:
          type: string
        collectorVersion:
          type: string
        surface:
          type: string
        completedRuns:
          type: integer
        failedRuns:
          type: integer
          description: >-
            Attempts that produced nothing. Counted separately and never as coverage — a failed
            attempt is not an examination.
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        observations:
          type: integer
          description: Observations still reachable from this collector's runs, counted from the observations themselves.
      required:
        - collector
        - collectorVersion
        - surface
        - completedRuns
        - failedRuns
        - lastRunAt
        - observations

    ReportQDayScenario:
      type: object
      properties:
        name:
          type: string
        qDayYear:
          type: integer
        rationale:
          type: string
        confidence:
          type: string
          description: >-
            From the source data. Every shipped scenario is `needs-check`, and the rendering says so
            rather than presenting a year as settled.
      required: [name, qDayYear, rationale, confidence]

    ReportHeader:
      type: object
      description: >-
        The reproducibility header docs/Claude/07-reports.md requires. Without it a report is an
        opinion; with it, it is evidence.
      properties:
        generatedAt:
          type: string
          format: date-time
        inventoryAsOf:
          type: string
          format: date-time
          nullable: true
          description: >-
            The most recent moment any asset in the document was seen. **Null for an empty
            inventory** — which is a different statement from "as of now" and must not be rendered
            as one.
        mappingDataVersion:
          type: string
          description: The `algorithms.json` snapshot every obligation, deadline and effort figure was resolved against. Pinned so the document can be re-derived.
        frameworksDataVersion:
          type: string
        asOf:
          type: string
          format: date-time
          description: The single instant every deadline in the document was evaluated at. One per document, so two findings cannot land on opposite sides of a deadline.
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/ReportQDayScenario"
        framing:
          type: string
          description: Mandatory wherever a scenario year appears. These are compliance deadlines, not predictions about physics.
        collectors:
          type: array
          items:
            $ref: "#/components/schemas/ReportCollectorProvenance"
        productVersion:
          type: string
          nullable: true
          description: Null when no release process stamped one. Never a placeholder version, which would be a lie in an auditor-facing document.
        coverageSummary:
          type: string
      required:
        - generatedAt
        - inventoryAsOf
        - mappingDataVersion
        - frameworksDataVersion
        - asOf
        - scenarios
        - framing
        - collectors
        - productVersion
        - coverageSummary

    UnexaminedSurface:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        catalogueStatus:
          type: string
          enum: [live, planned]
          description: >-
            `planned` means no collector exists. `live` here means one exists and has never been run
            against this organisation. Either way nothing has been examined.
        reason:
          type: string
      required: [id, name, catalogueStatus, reason]

    ReportCoverageLimitations:
      type: object
      description: >-
        The gap, stated where a reader meets it rather than in a footnote. Read this before reading
        any count in the document.
      properties:
        statement:
          type: string
        examinedSurfaces:
          type: integer
        totalSurfaces:
          type: integer
          description: Collector surfaces in the catalogue. The denominator is surfaces, never assets.
        unexaminedSurfaces:
          type: array
          items:
            $ref: "#/components/schemas/UnexaminedSurface"
        estateFraction:
          type: "null"
          description: >-
            **Always null.** Nothing this product holds supports a figure for how much cryptography
            sits in an unexamined surface, so no share of the estate is stated. The field exists,
            null, with `estateFractionReason`, so a consumer cannot mistake the absence for an
            oversight and fill it in.
        estateFractionReason:
          type: string
        failedRuns:
          type: integer
        assetsWithoutObservation:
          type: integer
          description: Present assets backed by no observation record at all — a data gap, reported rather than hidden.
        unmappedAlgorithms:
          type: array
          items:
            type: string
          description: >-
            Algorithms this estate holds that the standards data does not know. They carry no
            obligation and count toward no compliance figure. Absent from the board pack's page-one
            projection, which prints no algorithm names.
        caveats:
          type: array
          items:
            type: string
      required:
        - statement
        - examinedSurfaces
        - totalSurfaces
        - unexaminedSurfaces
        - estateFraction
        - estateFractionReason
        - failedRuns
        - assetsWithoutObservation
        - unmappedAlgorithms
        - caveats

    BoardPackPage1Coverage:
      type: object
      description: >-
        `ReportCoverageLimitations` minus `unmappedAlgorithms`. The board pack's page one names no
        algorithm; the count of unmapped ones survives in `caveats`, and the names appear in the
        appendices and in the regulator submission.
      properties:
        statement:
          type: string
        examinedSurfaces:
          type: integer
        totalSurfaces:
          type: integer
        unexaminedSurfaces:
          type: array
          items:
            $ref: "#/components/schemas/UnexaminedSurface"
        estateFraction:
          type: "null"
        estateFractionReason:
          type: string
        failedRuns:
          type: integer
        assetsWithoutObservation:
          type: integer
        caveats:
          type: array
          items:
            type: string
      required:
        - statement
        - examinedSurfaces
        - totalSurfaces
        - unexaminedSurfaces
        - estateFraction
        - estateFractionReason
        - failedRuns
        - assetsWithoutObservation
        - caveats

    ReportCostEstimate:
      type: object
      description: E1 question 3. Every figure carries its assumptions inline, in `statement`.
      properties:
        currency:
          type: string
        hourlyRate:
          type: number
        hourlyRateAssumed:
          type: boolean
          description: True unless `QUANTAXSCAN_BLENDED_HOURLY_RATE` supplied one. A currency without a rate is ignored rather than relabelling the USD default.
        hourlyRateBasis:
          type: string
        estimatedHours:
          type: number
        estimatedCost:
          type: integer
        assetsCosted:
          type: integer
        assetsWithRecordedEffort:
          type: integer
          description: Assets carrying an effort estimate recorded against the asset itself.
        assetsWithDerivedEffort:
          type: integer
          description: Assets taking the algorithm's base effort from the standards data — a class average, not an estimate of this asset.
        assetsWithoutEffortEstimate:
          type: integer
          description: >-
            In-scope assets excluded from the total because nothing supports an effort number for
            them. Counted, never treated as zero — a zero would make the total read as complete.
        statement:
          type: string
      required:
        - currency
        - hourlyRate
        - hourlyRateAssumed
        - hourlyRateBasis
        - estimatedHours
        - estimatedCost
        - assetsCosted
        - assetsWithRecordedEffort
        - assetsWithDerivedEffort
        - assetsWithoutEffortEstimate
        - statement

    ReportTrendStatement:
      type: object
      description: E1 question 4. `verdict` is `baseline` until two distinct collection instants exist — never "0% change".
      properties:
        sufficient:
          type: boolean
        verdict:
          type: string
          enum: [baseline, measured]
        distinctCollectionInstants:
          type: integer
        firstCollectionAt:
          type: string
          format: date-time
          nullable: true
        lastCollectionAt:
          type: string
          format: date-time
          nullable: true
        basis:
          type: string
      required:
        - sufficient
        - verdict
        - distinctCollectionInstants
        - firstCollectionAt
        - lastCollectionAt
        - basis

    ReportAssumption:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: string
        basis:
          type: string
        assumed:
          type: boolean
          description: False only when the customer actually supplied the value. Rendered as a visible marker, per doc 07 §"Assumption marking".
      required: [id, label, value, basis, assumed]

    BoardPackExposure:
      type: object
      description: E1 question 1. `headline` is one plain-English sentence and contains no algorithm name.
      properties:
        headline:
          type: string
        assetsFound:
          type: integer
          description: Present assets this document describes. Not an estate total — see the coverage block.
        quantumVulnerableAssets:
          type: integer
        assetsAlreadyTooLate:
          type: integer
          description: Of the quantum-vulnerable ones, how many breach Mosca's inequality under at least one scenario.
        classicalHygieneAssets:
          type: integer
          description: Real cryptographic defects with no post-quantum content. Reported separately and excluded from every post-quantum figure (G-10).
        unassessableAssets:
          type: integer
          description: Assets whose algorithm the standards data does not know. Counted toward nothing else.
      required:
        - headline
        - assetsFound
        - quantumVulnerableAssets
        - assetsAlreadyTooLate
        - classicalHygieneAssets
        - unassessableAssets

    BoardPackScenarioAnswer:
      type: object
      properties:
        scenario:
          type: string
        qDayYear:
          type: integer
        assetsBreached:
          type: integer
        worstOvershootYears:
          type: number
          nullable: true
          description: The largest `(X + Y) - Z` under this scenario, in years. Null when nothing breaches.
        confidence:
          type: string
        rationale:
          type: string
      required: [scenario, qDayYear, assetsBreached, worstOvershootYears, confidence, rationale]

    BoardPackTiming:
      type: object
      description: E1 question 2 — the Mosca verdict across all three scenarios, never a single date.
      properties:
        headline:
          type: string
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/BoardPackScenarioAnswer"
        framing:
          type: string
      required: [headline, scenarios, framing]

    BoardPackAppendix:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        columns:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
            required: [key, label]
        rows:
          type: array
          description: Objects keyed by `columns[].key`. Values are strings, numbers or null.
          items:
            type: object
            additionalProperties:
              nullable: true
        notes:
          type: array
          items:
            type: string
      required: [id, title, summary, columns, rows, notes]

    BoardPack:
      type: object
      description: >-
        E1 — the board / executive pack. One page answering four questions plus the coverage gap,
        then three appendices. `page1` carries no algorithm names by construction.
      properties:
        kind:
          type: string
          enum: [board-pack]
        header:
          $ref: "#/components/schemas/ReportHeader"
        page1:
          type: object
          properties:
            exposure:
              $ref: "#/components/schemas/BoardPackExposure"
            timing:
              $ref: "#/components/schemas/BoardPackTiming"
            cost:
              $ref: "#/components/schemas/ReportCostEstimate"
            trend:
              $ref: "#/components/schemas/ReportTrendStatement"
            coverage:
              $ref: "#/components/schemas/BoardPackPage1Coverage"
          required: [exposure, timing, cost, trend, coverage]
        appendices:
          type: array
          items:
            $ref: "#/components/schemas/BoardPackAppendix"
        assumptions:
          type: array
          items:
            $ref: "#/components/schemas/ReportAssumption"
      required: [kind, header, page1, appendices, assumptions]

    RegulatorAssetProvenance:
      type: object
      description: >-
        The most recent observation behind one asset. Every field is nullable together: an asset
        with no observation record has no answer to "says who?", and `note` says that rather than
        the fields quietly reading as zero.
      properties:
        collector:
          type: string
          nullable: true
        collectorVersion:
          type: string
          nullable: true
        observedAt:
          type: string
          format: date-time
          nullable: true
        confidence:
          type: number
          nullable: true
          description: The collector's own confidence, 0 to 1, at the most recent observation.
        discoveryModality:
          type: string
          nullable: true
          description: How the observation was obtained. An active probe and a submitted form are not the same evidence.
        observations:
          type: integer
        note:
          type: string
          nullable: true
      required:
        - collector
        - collectorVersion
        - observedAt
        - confidence
        - discoveryModality
        - observations
        - note

    RegulatorObligationDeadline:
      type: object
      properties:
        type:
          type: string
        label:
          type: string
        effect:
          type: string
          enum: [prohibition, caution, permitted]
        inEffect:
          type: boolean
        effectiveFrom:
          type: string
          nullable: true
        appliesTo:
          type: string
          nullable: true
          description: Which use the rule covers. Load-bearing where an algorithm is disallowed for one purpose and permitted for another.
        securityStrength:
          type: string
          nullable: true
      required: [type, label, effect, inEffect, effectiveFrom, appliesTo, securityStrength]

    RegulatorObligationCitation:
      type: object
      properties:
        document:
          type: string
        section:
          type: string
          nullable: true
        url:
          type: string
        retrievedAt:
          type: string
          nullable: true
      required: [document, section, url, retrievedAt]

    RegulatorObligation:
      type: object
      properties:
        framework:
          type: string
        frameworkName:
          type: string
          nullable: true
        requirement:
          type: string
        severity:
          type: string
        confidence:
          type: string
          description: >-
            From the standards data, never upgraded. Always `verified` inside `obligations`;
            anything else lives in `indicativeObligations`.
        draftStatus:
          type: string
          nullable: true
          description: Present when the citing document is a draft. Must be shown wherever the obligation is.
        deadline:
          allOf:
            - $ref: "#/components/schemas/RegulatorObligationDeadline"
          nullable: true
        replacement:
          type: object
          nullable: true
          properties:
            algorithm: { type: string }
            standard: { type: string }
            purpose: { type: string, nullable: true }
          required: [algorithm, standard, purpose]
        citation:
          $ref: "#/components/schemas/RegulatorObligationCitation"
        citationRetrievalDateMissing:
          type: boolean
          description: Stated as a field rather than left for the reader to notice a blank.
        caveats:
          type: array
          items:
            type: string
      required:
        - framework
        - frameworkName
        - requirement
        - severity
        - confidence
        - draftStatus
        - deadline
        - replacement
        - citation
        - citationRetrievalDateMissing
        - caveats

    RegulatorAsset:
      type: object
      properties:
        fingerprint:
          type: string
        surface:
          type: string
        surfaceName:
          type: string
        algorithm:
          type: string
        keySize:
          type: integer
          nullable: true
          description: Null means the collector looked and could not determine it. Never a default (G-05).
        keySizeNote:
          type: string
          nullable: true
        location:
          type: string
        projectId:
          type: integer
          nullable: true
        status:
          type: string
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        provenance:
          $ref: "#/components/schemas/RegulatorAssetProvenance"
        classification:
          type: object
          properties:
            dataClassification: { type: string, nullable: true }
            secrecyLifetimeYears: { type: number }
            source: { type: string, enum: [asset, project, default] }
            assumed: { type: boolean }
          required: [dataClassification, secrecyLifetimeYears, source, assumed]
        mosca:
          type: object
          properties:
            x: { type: number }
            y: { type: number }
            applicable: { type: boolean }
            breachedScenarios:
              type: array
              items: { type: string }
          required: [x, y, applicable, breachedScenarios]
        obligations:
          type: array
          description: "`verified` obligations only."
          items:
            $ref: "#/components/schemas/RegulatorObligation"
        indicativeObligations:
          type: array
          description: >-
            `needs-check` obligations. Never merged with `obligations`, and counted toward no
            compliance figure. Render them with `complianceClaimSummary.indicativeLabel`.
          items:
            $ref: "#/components/schemas/RegulatorObligation"
        standardsDataEntry:
          type: boolean
          description: False when the standards data has no entry for this algorithm. No obligation is invented for it.
        caveats:
          type: array
          items:
            type: string
      required:
        - fingerprint
        - surface
        - surfaceName
        - algorithm
        - keySize
        - keySizeNote
        - location
        - projectId
        - status
        - firstSeen
        - lastSeen
        - provenance
        - classification
        - mosca
        - obligations
        - indicativeObligations
        - standardsDataEntry
        - caveats

    RegulatorSubmission:
      type: object
      description: >-
        E2 — the regulator / auditor inventory submission. Ordered so a reader meets the coverage
        limitations before any count.
      properties:
        kind:
          type: string
          enum: [regulator-submission]
        header:
          $ref: "#/components/schemas/ReportHeader"
        coverageLimitations:
          $ref: "#/components/schemas/ReportCoverageLimitations"
        scope:
          type: object
          properties:
            projects:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  assets: { type: integer }
                required: [id, name, assets]
            assetsIncluded:
              type: integer
            statusCounts:
              type: object
              additionalProperties:
                type: integer
              description: Every asset status in the organisation, `gone` included, so the exclusion below is checkable arithmetic.
            assetsExcluded:
              type: integer
            exclusionBasis:
              type: string
          required: [projects, assetsIncluded, statusCounts, assetsExcluded, exclusionBasis]
        complianceClaimSummary:
          type: object
          properties:
            assetsWithVerifiedObligations: { type: integer }
            assetsWithIndicativeObligationsOnly: { type: integer }
            assetsWithNoStandardsEntry: { type: integer }
            verifiedObligations: { type: integer }
            indicativeObligations: { type: integer }
            obligationsMissingRetrievalDate: { type: integer }
            indicativeLabel:
              type: string
              description: The words an indicative obligation must be rendered with.
          required:
            - assetsWithVerifiedObligations
            - assetsWithIndicativeObligationsOnly
            - assetsWithNoStandardsEntry
            - verifiedObligations
            - indicativeObligations
            - obligationsMissingRetrievalDate
            - indicativeLabel
        inventory:
          type: array
          description: Present assets only, ordered by fingerprint so an unchanged inventory produces an identical document.
          items:
            $ref: "#/components/schemas/RegulatorAsset"
        exceptions:
          type: object
          properties:
            registerAvailable:
              type: boolean
              enum: [true]
              description: >-
                **Always true since C8.** This field read `false` until the waiver register
                shipped, and no test failed when that became untrue — a regulator-facing document
                asserting the absence of a feature the product operates is invisible to every
                suite. If the register ever becomes optional, this is the field that lies first.
            statement:
              type: string
            waivers:
              description: >-
                The register's entries as of this document's timestamp. An expired or revoked
                waiver is absent because the field is derived at that instant rather than cached.
                Two limits are stated in `statement` rather than implied: one signatory rather
                than a separate owner and approver, and `attribution`, which distinguishes a
                signature made by an authenticated user from a name asserted through a shared
                API key.
              type: array
              items:
                type: object
                properties:
                  fingerprint: { type: string }
                  algorithm: { type: string }
                  location: { type: string }
                  surface: { type: string }
                  justification: { type: string }
                  signedOffBy: { type: string }
                  attribution:
                    type: string
                    enum: [authenticated, asserted]
                  signedOffAt: { type: string, format: date-time }
                  expiresAt: { type: string, format: date-time }
                  daysRemaining: { type: integer }
                required:
                  - fingerprint
                  - algorithm
                  - location
                  - surface
                  - justification
                  - signedOffBy
                  - attribution
                  - signedOffAt
                  - expiresAt
                  - daysRemaining
            statusWaivedWithoutRegisterEntry:
              description: >-
                Assets carrying the inventory's `waived` status with no register entry behind it.
                Listed apart from `waivers` because they have no justification, no signatory and
                no expiry — merging them in would present four missing fields as present.
              type: array
              items:
                type: object
                properties:
                  fingerprint: { type: string }
                  algorithm: { type: string }
                  location: { type: string }
                  surface: { type: string }
                required: [fingerprint, algorithm, location, surface]
            removedAssets:
              type: integer
          required:
            - registerAvailable
            - statement
            - waivers
            - statusWaivedWithoutRegisterEntry
            - removedAssets
        methodology:
          type: object
          properties:
            collectors:
              type: array
              items:
                $ref: "#/components/schemas/ReportCollectorProvenance"
            discoveryModalities:
              type: array
              items:
                type: object
                properties:
                  modality: { type: string }
                  observations: { type: integer }
                required: [modality, observations]
            confidenceBasis:
              type: string
            limitations:
              type: array
              items:
                type: string
          required: [collectors, discoveryModalities, confidenceBasis, limitations]
        assumptions:
          type: array
          items:
            $ref: "#/components/schemas/ReportAssumption"
        integrity:
          type: object
          properties:
            digestAlgorithm:
              type: string
              enum: [SHA-256]
            digest:
              type: string
              description: Computed over the document with this field empty, which is the form a recipient can recompute.
            signed:
              type: boolean
              enum: [false]
              description: >-
                **Always false.** A digest detects alteration relative to a value you already hold
                and proves nothing about origin. Calling an unsigned document signed is the first
                thing an auditor checks.
            statement:
              type: string
          required: [digestAlgorithm, digest, signed, statement]
      required:
        - kind
        - header
        - coverageLimitations
        - scope
        - complianceClaimSummary
        - inventory
        - exceptions
        - methodology
        - assumptions
        - integrity

    MultiScanFile:
      type: object
      properties:
        filename:
          type: string
        content:
          type: string
      required:
        - filename
        - content

    MultiScanBody:
      type: object
      properties:
        projectName:
          type: string
        language:
          type: string
        files:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MultiScanFile"
        retentionMode:
          allOf:
            - $ref: "#/components/schemas/RetentionMode"
          description: >-
            Omitted means `retained`. Applies to the whole submission: every scan row this
            request creates carries the same mode, because a customer's answer to "what did you
            do with my source" cannot differ per file within one upload.
      required:
        - projectName
        - language
        - files

    MultiScanFinding:
      type: object
      description: >-
        A per-file finding as returned inline for IDE display. Deliberately narrower than
        `Finding`: it carries no `id`/`scanId`, because the row ids are not read back.
      properties:
        lineNumber:
          type: integer
        severity:
          type: string
          enum: [critical, alert, safe]
        algorithm:
          type: string
        codeSnippet:
          type: string
        nistReplacement:
          type: string
          nullable: true
        nistStandard:
          type: string
          nullable: true
        effortHours:
          type: number
        explanation:
          type: string
        compliance:
          allOf:
            - $ref: "#/components/schemas/FindingCompliance"
          nullable: true
      required:
        - lineNumber
        - severity
        - algorithm
        - codeSnippet
        - nistReplacement
        - nistStandard
        - effortHours
        - explanation

    MultiScanFileResult:
      type: object
      properties:
        filename:
          type: string
        riskScore:
          type: integer
          description: This file's own post-quantum score, computed over this file alone.
        findings:
          type: array
          items:
            $ref: "#/components/schemas/MultiScanFinding"
      required:
        - filename
        - riskScore
        - findings

    MultiScanResult:
      type: object
      properties:
        projectId:
          type: integer
        projectName:
          type: string
        riskScore:
          type: integer
          description: >-
            The project-level post-quantum score, computed over every finding in the
            submission — not the maximum of the per-file scores.
        worstFileRiskScore:
          type: integer
          description: The highest per-file score, which is also what each individual scan row stores.
        criticalCount:
          type: integer
        alertCount:
          type: integer
        cleanCount:
          type: integer
        totalLines:
          type: integer
        findingsCount:
          type: integer
        filesScanned:
          type: integer
        retentionMode:
          $ref: "#/components/schemas/RetentionMode"
        pqc:
          $ref: "#/components/schemas/PqcExposure"
        hygiene:
          $ref: "#/components/schemas/HygieneSummary"
        mosca:
          $ref: "#/components/schemas/MoscaAssessment"
        fileResults:
          type: array
          items:
            $ref: "#/components/schemas/MultiScanFileResult"
      required:
        - projectId
        - projectName
        - riskScore
        - worstFileRiskScore
        - criticalCount
        - alertCount
        - cleanCount
        - totalLines
        - findingsCount
        - filesScanned
        - retentionMode
        - pqc
        - hygiene
        - mosca
        - fileResults

    AlgorithmBreakdownEntry:
      type: object
      description: One algorithm's contribution to a risk track, aggregated across the findings.
      properties:
        algorithm:
          type: string
        count:
          type: integer
        effortHours:
          type: number
        reportingNote:
          type: string
          nullable: true
          description: >-
            The mapping data's own qualification of this algorithm. Print it verbatim — it
            is why the finding is being reported the way it is.
        nistReplacement:
          type: string
          nullable: true
        nistStandard:
          type: string
          nullable: true
        citation:
          type: object
          nullable: true
          properties:
            document:
              type: string
            url:
              type: string
          required:
            - document
            - url
      required:
        - algorithm
        - count
        - effortHours
        - reportingNote
        - nistReplacement
        - nistStandard
        - citation

    PqcExposure:
      type: object
      description: A4 — the post-quantum half of the risk profile, with its score decomposed.
      properties:
        riskScore:
          type: integer
          description: >-
            0-100, and **zero whenever no quantum-vulnerable algorithm was detected**,
            whatever else the scan found. Classical hygiene contributes nothing (G-10).
        findingCount:
          type: integer
        effortHours:
          type: number
        estimatedCost:
          type: integer
        byAlgorithm:
          type: array
          items:
            $ref: "#/components/schemas/AlgorithmBreakdownEntry"
        scoreComponents:
          type: object
          description: The two halves of `riskScore`. A score that cannot be decomposed is what A4 exists to replace.
          properties:
            detection:
              type: integer
              description: 0-60. Quantum-vulnerable density against the lines actually examined.
            moscaBreach:
              type: integer
              description: 0-40. The share of Q-Day scenarios under which the inequality is breached.
          required:
            - detection
            - moscaBreach
      required:
        - riskScore
        - findingCount
        - effortHours
        - estimatedCost
        - byAlgorithm
        - scoreComponents

    HygieneSummary:
      type: object
      description: >-
        A4/G-10 — classical cryptographic defects with no post-quantum content, scored
        separately and never folded into the PQC score.
      properties:
        findingCount:
          type: integer
        effortHours:
          type: number
        estimatedCost:
          type: integer
        byAlgorithm:
          type: array
          items:
            $ref: "#/components/schemas/AlgorithmBreakdownEntry"
        countedTowardPqcRisk:
          type: boolean
          description: >-
            Always false. Structural rather than decorative: an assertion in the payload
            that these findings did not move the post-quantum number.
        headline:
          type: string
      required:
        - findingCount
        - effortHours
        - estimatedCost
        - byAlgorithm
        - countedTowardPqcRisk
        - headline

    MoscaVerdict:
      type: object
      description: >-
        `X + Y > Z` under one Q-Day scenario, with all three inputs exposed. A4's acceptance
        criterion is a verdict that shows its working, so none of x, y or z is optional.
      properties:
        scenario:
          type: string
          enum: [conservative, central, aggressive]
        qDayYear:
          type: integer
        x:
          type: number
          description: Secrecy lifetime, years — how long the data must stay confidential.
        y:
          type: number
          description: Migration time, years.
        z:
          type: number
          description: Years remaining until this scenario's Q-Day. Negative once the year has passed.
        breached:
          type: boolean
        breachMarginYears:
          type: number
          description: "`(x + y) - z`. Negative is margin remaining; positive means already too late, by this many years."
        narrative:
          type: string
        scenarioRationale:
          type: string
        scenarioConfidence:
          type: string
          enum: [verified, needs-check]
      required:
        - scenario
        - qDayYear
        - x
        - y
        - z
        - breached
        - breachMarginYears
        - narrative
        - scenarioRationale
        - scenarioConfidence

    MoscaAssessment:
      type: object
      description: >-
        One verdict per Q-Day scenario. The scenarios are regulatory deadlines drawn from
        draft guidance, not predictions about physics — `framing` carries the sentence that
        must accompany any customer-facing use of these years.
      properties:
        x:
          type: number
          description: X as used, after defaulting.
        y:
          type: number
        secrecyLifetimeSource:
          type: string
          enum: [provided, assumed-default]
          description: >-
            Whether X was supplied or assumed. A report must say which: `assumed-default`
            means nobody classified the data and the product's fallback was used.
        applicable:
          type: boolean
          description: False when no quantum-vulnerable cryptography was found; every verdict is then trivially not-breached.
        evaluatedAt:
          type: string
          format: date-time
        verdicts:
          type: array
          items:
            $ref: "#/components/schemas/MoscaVerdict"
        breachedScenarioCount:
          type: integer
        scenarioCount:
          type: integer
        worstBreach:
          allOf:
            - $ref: "#/components/schemas/MoscaVerdict"
          nullable: true
          description: The breached verdict with the largest margin. Null when nothing breaches.
        framing:
          type: string
      required:
        - x
        - y
        - secrecyLifetimeSource
        - applicable
        - evaluatedAt
        - verdicts
        - breachedScenarioCount
        - scenarioCount
        - worstBreach
        - framing

    SurfaceCoverage:
      type: object
      properties:
        surface:
          type: string
          description: The `Surface` enum value, i.e. how the database records it.
        surfaceId:
          type: string
          nullable: true
          description: >-
            The collector catalogue id, so a caller can join presentation without
            re-deriving the mapping. Null for a surface with no catalogue entry.
        state:
          type: string
          enum: [examined, examined-nothing-found, never-examined]
          description: >-
            `examined-nothing-found` is its own state on purpose: a clean result and an
            absent one are different facts, and collapsing them loses the only one a reader
            cares about when the answer is zero.
        completedRuns:
          type: integer
        failedRuns:
          type: integer
          description: >-
            A failed run is an attempt, not an examination. It is counted here and kept out
            of `completedRuns` so it can never make a surface look examined.
        lastExaminedAt:
          type: string
          format: date-time
          nullable: true
        assets:
          type: integer
        activeAssets:
          type: integer
      required:
        - surface
        - surfaceId
        - state
        - completedRuns
        - failedRuns
        - lastExaminedAt
        - assets
        - activeAssets

    ConfidenceBucketCount:
      type: object
      description: Half-open bucket, [lower, upper), except the last which includes 1.0.
      properties:
        label:
          type: string
        lower:
          type: number
        upper:
          type: number
        count:
          type: integer
      required:
        - label
        - lower
        - upper
        - count

    ConfidenceSummary:
      type: object
      properties:
        basis:
          type: string
          enum: ["latest observation per active asset"]
          description: >-
            Stated in the payload so a report built from it can quote the basis rather than
            guess it. One point per asset, not per observation — weighting by scan frequency
            would describe our scheduling, not our evidence quality.
        scored:
          type: integer
        unscored:
          type: integer
          description: Active assets with no observation at all. Non-zero means a data problem, and hiding it would be the wrong default.
        excludedByAssetStatus:
          type: object
          additionalProperties:
            type: integer
          description: Assets deliberately left out of the distribution, keyed by asset status.
        distinctValues:
          type: integer
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
        mean:
          type: number
          nullable: true
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/ConfidenceBucketCount"
      required:
        - basis
        - scored
        - unscored
        - excludedByAssetStatus
        - distinctValues
        - min
        - max
        - mean
        - buckets

    ProjectCoverage:
      type: object
      description: >-
        D3 — what has been examined, and what has never been looked at. The denominator is
        surfaces, not assets: how much cryptography hides in a surface nobody examined is
        unknowable from this data, so `examinedSurfaces / totalSurfaces` must not be
        presented as a percentage of the estate.
      properties:
        projectId:
          type: integer
        generatedAt:
          type: string
          format: date-time
        examinedSurfaces:
          type: integer
        totalSurfaces:
          type: integer
        surfaces:
          type: array
          description: >-
            Every catalogue surface with any run or asset. A surface absent from this list
            has never been examined at all — that absence is the machine-readable half of
            the answer.
          items:
            $ref: "#/components/schemas/SurfaceCoverage"
        confidence:
          $ref: "#/components/schemas/ConfidenceSummary"
        discovery:
          allOf:
            - $ref: "#/components/schemas/DiscoveryCoverage"
          description: >-
            D8 — how many hosts discovery knows about for this project and how many a
            collector has examined. **Absent, not zeroed, when discovery has never run**, for
            the same reason a never-examined surface is absent from `surfaces`: "nobody has
            looked" and "we looked and there are none" are different statements, and a zero
            would say the second.
      required:
        - projectId
        - generatedAt
        - examinedSurfaces
        - totalSurfaces
        - surfaces
        - confidence

    CycloneDxProperty:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required:
        - name

    CycloneDxOccurrence:
      type: object
      properties:
        location:
          type: string
        line:
          type: integer
        symbol:
          type: string
      required:
        - location

    CycloneDxCryptoProperties:
