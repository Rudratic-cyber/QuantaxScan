openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: QuantaXscan Post-Quantum Security Scanner API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project management
  - name: scans
    description: Security scanning
  - name: inventory
    description: Cryptographic inventory export (CBOM)
  - name: reports
    description: Shared report links
  - name: community
    description: Community hub
  - name: stats
    description: Platform statistics
  - name: demo
    description: Demo repositories
  - name: github
    description: GitHub repository scanning
  - name: inventory
    description: Estate-wide inventory exports and posture
  - name: chat
    description: AI assistant
  - name: ot-fleets
    description: Manual OT/embedded device fleet register (B8)
  - name: credentials
    description: >-
      Third-party credentials a customer entrusts to us for credentialed collectors (F4). No
      operation in this tag ever returns a stored secret, and there is no route that can.
  - name: waivers
    description: >-
      The waivers / exceptions register (C8). A waiver records that somebody accepted a risk,
      with an expiry and a name — it never removes the asset from the inventory, the CBOM or any
      coverage number. Suppressing a finding from a working list is legitimate; making an estate
      read as cleaner than it is, is not.

# Interim shared-key authentication (S1 / G-12). Applies to every operation
# unless overridden with `security: []`. This carries no per-user identity and
# no organisation scoping — see docs/Claude/08-security.md.
#
# Every operation can also answer 429 (S6). Budgets are per route and keyed on
# the API key, falling back to the client address on the public operations;
# `Retry-After` is always set. The store is in-process, so the documented
# allowance is per replica. See `components/responses/RateLimited`.
security:
  - apiKeyHeader: []
  - bearerApiKey: []

paths:
  /healthz:
    get:
      operationId: healthCheck
      security: []
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "204":
          description: Deleted

  /projects/{id}/findings:
    get:
      operationId: getProjectFindings
      tags: [projects]
      summary: Get every finding across every scan in a project
      description: >-
        Returns an empty array — not a 404 — for a project that has no scans, or one that
        belongs to another organisation, because the row-level security policies filter the
        scans before this handler sees them.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Project findings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Finding"
        "400":
          description: Invalid project ID

  /projects/{id}/coverage:
    get:
      operationId: getProjectCoverage
      tags: [projects]
      summary: Coverage and confidence meter for a project (D3)
      description: >-
        What has been examined, what has never been examined, and how sure the evidence is.
        A catalogue surface absent from `surfaces` has never been looked at — that absence is
        the machine-readable half of the answer, so callers must not treat the list as
        exhaustive of the estate. Not public: it describes an organisation's own estate.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Coverage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCoverage"
        "400":
          description: Invalid project ID
        "404":
          description: Not found

  /projects/{id}/dependencies:
    post:
      operationId: submitProjectDependencies
      tags: [projects]
      summary: Submit a project's lockfiles for dependency/SBOM collection (B2)
      description: >-
        Runs the dependency collector over the submitted files and persists what it finds as
        assets on the `dependency` surface, which is what makes that surface count as examined
        in `GET /projects/{id}/coverage`.


        Files are selected by basename, not by extension. Six ecosystems are read:


        - **npm** — `pnpm-lock.yaml`, `package-lock.json`, `npm-shrinkwrap.json`, `yarn.lock`

        - **PyPI** — `requirements*.txt` (`poetry.lock` / `Pipfile.lock` are not read)

        - **Maven** — `pom.xml`, `gradle.lockfile`, `buildscript-gradle.lockfile`,
          `build.gradle`, `build.gradle.kts`

        - **Go** — `go.mod`, `go.sum`

        - **NuGet** — `packages.lock.json`, `packages.config`, `*.csproj`/`*.fsproj`/`*.vbproj`,
          `Directory.Packages.props`, `Directory.Build.props`

        - **Cargo** — `Cargo.lock` (`Cargo.toml` is not read: its versions are ranges)


        Anything else in `files` is ignored rather than rejected, so a caller may submit a whole
        tree.


        A manifest states less than a lock, and the response never hides the difference: a
        version that is a build-system variable (`${bc.version}`, `$(NSecVersion)`), a range
        (`[2.4.0, )`), or absent because a BOM or central package management supplies it is
        reported as `version: null` rather than as a guess. Only the unambiguous single-literal
        form of a `build.gradle` dependency declaration is read; a version catalogue reference or
        map notation produces nothing rather than a guess.


        **If no submitted file is a recognised lockfile, no collection run is recorded** and
        `lockfilesRecognised` is 0. That is deliberate: writing a run would make the meter
        report the dependency surface as examined-and-empty, when the truth is that nothing
        readable was submitted. It is a 200, not an error — a repository legitimately may have
        no lockfile.


        A package that leaves a resubmitted lockfile marks its asset `gone`, scoped to the
        ecosystems this submission actually carried a lockfile for. Submitting only
        `requirements.txt` therefore never touches the project's npm assets.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProjectDependenciesBody"
      responses:
        "200":
          description: Collection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyIngestSummary"
        "400":
          description: Invalid project ID or body
        "404":
          description: Not found

  /ot-fleets:
    get:
      operationId: listOtFleets
      tags: [ot-fleets]
      summary: List this organisation's OT/embedded device fleets (B8)
      description: >-
        The manual register — every fleet a customer has recorded by hand, newest first. Each
        entry carries `exposure`, computed fresh on every read against the current Q-Day
        scenarios, so a scenario or date change is reflected without a backfill.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: OT fleets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OtFleet"
    post:
      operationId: createOtFleet
      tags: [ot-fleets]
      summary: Record a new device fleet (B8)
      description: >-
        A form submission, not a collector run: every field but `name` is optional, and an
        omitted field is stored as `null` — "not supplied" — rather than a guessed default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOtFleetBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "400":
          description: Invalid body
        "201":
          description: Created fleet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtFleet"

  /ot-fleets/{id}:
    get:
      operationId: getOtFleet
      tags: [ot-fleets]
      summary: Get one OT fleet by id (B8)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: OT fleet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtFleet"
        "400":
          description: Invalid fleet ID
        "404":
          description: Not found
    patch:
      operationId: updateOtFleet
      tags: [ot-fleets]
      summary: Update fields the customer has learned since the fleet was recorded (B8)
      description: >-
        Every field is optional and only the fields present in the body are changed — omitting a
        field leaves the stored value (including `null`) exactly as it was, it does not clear it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOtFleetBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Updated fleet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtFleet"
        "400":
          description: Invalid fleet ID or body
        "404":
          description: Not found
    delete:
      operationId: deleteOtFleet
      tags: [ot-fleets]
      summary: Remove a fleet from the register (B8)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "204":
          description: Deleted

  /inventory/timeline:
    get:
      operationId: getInventoryTimeline
      tags: [inventory]
      summary: Estate cryptographic posture over time (D7)
      description: >
        Observed history from real collection instants, plus a projected horizon and the
        obligation deadlines that fall in it. Observed points come only from instants at which a
        collection actually happened — the series is never resampled onto a regular grid,
        because that would draw a smooth trend on an estate that never changed. When fewer than
        two distinct instants exist, `observed.sufficientForTrend` is false and `reason` says so.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Posture timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostureTimeline"

  /inventory/cbom:
    get:
      operationId: getInventoryCbom
      tags: [inventory]
      summary: Export the cryptographic inventory as a CycloneDX 1.7 CBOM
      description: >-
        Served as `application/vnd.cyclonedx+json; version=1.7`, not `application/json`.
        Assets with status `gone` are excluded: a current-state inventory handed to an
        auditor must not list crypto that a later run proved absent. **Not public** — a CBOM
        is a complete map of an organisation's cryptographic weaknesses.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: CycloneDX 1.7 document
          content:
            application/vnd.cyclonedx+json; version=1.7:
              schema:
                $ref: "#/components/schemas/CbomDocument"

  /inventory/readiness:
    get:
      operationId: getInventoryReadiness
      tags: [inventory]
      summary: CISA quantum-readiness posture tracker (D1)
      description: >-
        Five sections tracking the named parts of the joint CISA/NSA/NIST quantum-readiness
        factsheet (August 2023), plus the estate-wide coverage meter the first section is
        defined against — bundled in one payload so the two cannot disagree. A section with
        no data source in this product (roadmap document attachment, the vendor register)
        reports `percentComplete: null` and `state: "not-tracked"`, never `0`. There is no
        combined/overall readiness score.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Readiness posture and estate coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessSummary"

  /inventory/assets:
    get:
      operationId: getInventoryAssets
      tags: [inventory]
      summary: Estate inventory table, PQC track and Mosca breach per asset (D1 Row 4)
      description: >-
        Present assets only (`status !== "gone"`), each carrying its resolved compliance
        track (post-quantum vs. classical hygiene — G-10) and which Q-Day scenarios it
        breaches. `statusCounts` covers every asset in the organisation regardless of status,
        `gone` included, so drift can be reported without listing removed assets as present.
      parameters:
        - name: surface
          in: query
          description: Filter to one collector surface, e.g. `certificate` for the cert-expiry panel.
          schema:
            type: string
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Enriched asset inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryAssetsSummary"

  /scans:
    post:
      operationId: createScan
      tags: [scans]
      summary: Start a new scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScanBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Scan initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"

  /scans/{id}:
    get:
      operationId: getScan
      tags: [scans]
      summary: Get scan results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: Not found

  /scans/{id}/findings:
    get:
      operationId: getScanFindings
      tags: [scans]
      summary: Get all findings for a scan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Scan findings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Finding"

  /scans/multi:
    post:
      operationId: createMultiScan
      tags: [scans]
      summary: Scan several files as one new project
      description: >-
        Creates a project, one scan row per file, and returns a project-level roll-up. The
        risk profile is computed over every finding in the submission — `worstFileRiskScore`
        is reported separately because the maximum of per-file scores cannot express a
        Mosca verdict over a whole body of data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiScanBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Multi-file scan summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiScanResult"
        "400":
          description: projectName and a non-empty files array are required

  /reports:
    post:
      operationId: createSharedReport
      tags: [reports]
      summary: Create a share link for a report
      description: >-
        `owner` is the GitHub repository owner, not a user. Responds 200, not 201. The
        created row is `visibility: public` and expires after `SHARE_LINK_TTL_DAYS`
        (default 365).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSharedReportBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Share link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSharedReportResponse"
        "400":
          description: owner, repo, repoUrl and data are required
        "500":
          description: Failed to save report

  /reports/{id}:
    get:
      operationId: getSharedReport
      security: []
      tags: [reports]
      summary: Read a shared report by its link id
      description: >-
        Public by link, which is why the id is a 128-bit random base64url string and **not**
        an integer. Revoked, expired and private rows are invisible to this route because
        the rule lives in the `shared_reports` policy rather than in a where clause — all
        three are indistinguishable from a link that never existed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: The shared report row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedReport"
        "404":
          description: Not found, revoked, expired or private
        "500":
          description: Failed to fetch report

  # ── E1 / E2 — generated report packs ──────────────────────────────────────
  #
  # Deliberately NOT under `/reports/...`. `PUBLIC_ROUTES` matches the share
  # link with `/^\/reports\/[^/]+$/`, so `/reports/board` would have been served
  # anonymously — a complete map of an organisation's cryptographic weaknesses,
  # with no credential. Every operation below requires authentication and none
  # carries `security: []`.
  #
  # Three representations of one document per pack: the JSON it was built from,
  # the HTML rendering, and that same HTML printed to PDF. There is one
  # renderer (docs/Claude/07-reports.md §Rendering).

  /report-packs/board:
    get:
      operationId: getBoardPack
      tags: [reports]
      summary: Board / executive pack, as JSON (E1)
      description: >-
        The estate's post-quantum exposure, answering exactly four questions — are we exposed,
        how badly and by when, what will it cost, are we on track — plus the coverage gap, on
        page one.


        **No number here implies completeness.** `page1.coverage.estateFraction` is always
        `null`, with `estateFractionReason` saying why: nothing this product holds supports a
        figure for how much cryptography sits in the surfaces nobody has examined, so the gap is
        reported as surfaces out of the collector catalogue rather than invented as a percentage.


        `page1` contains no algorithm names by construction (`page1.coverage` is the full
        coverage block minus `unmappedAlgorithms`); the appendices name everything. Obligations,
        deadlines and effort estimates are resolved at read time from the standards data version
        pinned in `header.mappingDataVersion` and are not stored against any asset.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: The board pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardPack"

  /report-packs/board.html:
    get:
      operationId: getBoardPackHtml
      tags: [reports]
      summary: Board / executive pack, rendered (E1)
      description: >-
        The same document as `/report-packs/board`, rendered as a self-contained HTML page with
        print styles. No external stylesheet, script, font or image is referenced, so a saved
        copy renders identically years later with no network.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: The board pack as HTML
          content:
            text/html:
              schema:
                type: string

  /report-packs/board.pdf:
    get:
      operationId: getBoardPackPdf
      tags: [reports]
      summary: Board / executive pack, as PDF (E1)
      description: >-
        The HTML above, printed by headless Chromium. Served as `application/pdf` with a
        `Content-Disposition: attachment` filename.


        **May answer 503.** The PDF step needs a Chromium binary, which `Dockerfile.api` does not
        install today; `playwright-core` is a dependency but ships no browser. When none can be
        launched the response is 503 with a message naming the `.html` route, which carries the
        identical document — never 500, because nothing failed about the inventory. Set
        `QUANTAXSCAN_CHROMIUM_PATH` to point at an installed browser.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: The board pack as PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "503":
          description: >-
            No Chromium is available to this deployment. The identical document is available from
            `/report-packs/board.html`.

  /report-packs/regulator:
    get:
      operationId: getRegulatorSubmission
      tags: [reports]
      summary: Regulator / auditor inventory submission, as JSON (E2)
      description: >-
        The inventory as evidence: every asset with the collector, collector version, timestamp,
        confidence and discovery modality behind it, and every compliance claim with its citation
        and retrieval date.


        **Only `verified` obligations appear in `inventory[].obligations`.** Anything the standards
        data marks `needs-check` is carried separately in `inventory[].indicativeObligations` and
        labelled with `complianceClaimSummary.indicativeLabel`; the two are never merged, and
        indicative obligations count toward no compliance figure.


        Two of doc 07's seven requirements are answered by an honest refusal rather than by data,
        and both are fields rather than omissions. `exceptions.registerAvailable` is always `false`
        — this product operates no waiver register, so no exception carries an owner, justification,
        expiry or approver, and the assets listed are simply those an operator marked `waived`. And
        `integrity.signed` is always `false`: the SHA-256 digest detects alteration relative to a
        value you already hold, and proves nothing about origin.


        `coverageLimitations` comes before the inventory in the payload as well as in the rendering,
        because an undisclosed gap is the finding that sinks an audit.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: The regulator submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegulatorSubmission"

  /report-packs/regulator.html:
    get:
      operationId: getRegulatorSubmissionHtml
      tags: [reports]
      summary: Regulator / auditor inventory submission, rendered (E2)
      description: >-
        The same document as `/report-packs/regulator`, rendered as a self-contained HTML page
        with print styles and no external references.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: The submission as HTML
          content:
            text/html:
              schema:
                type: string

  /report-packs/regulator.pdf:
    get:
      operationId: getRegulatorSubmissionPdf
      tags: [reports]
      summary: Regulator / auditor inventory submission, as PDF (E2)
      description: >-
        The HTML above, printed by headless Chromium. Answers 503 under exactly the same
        conditions as `/report-packs/board.pdf` — see that operation.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: The submission as PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "503":
          description: >-
            No Chromium is available to this deployment. The identical document is available from
            `/report-packs/regulator.html`.

  /chat:
    post:
      operationId: createChatCompletion
      tags: [chat]
      summary: Stream an AI answer about a scan
      description: >-
        Responds with `text/event-stream`, not JSON: a sequence of `data:` frames carrying
        `{"content":"..."}` and a final `{"done":true}`. An unconfigured or failing OpenAI
        integration still streams 200 with the error as a content frame, so a non-200 here
        means the request was rejected, not that the model failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request

  /community/posts:
    get:
      operationId: listCommunityPosts
      security: []
      tags: [community]
      summary: List community posts
      parameters:
