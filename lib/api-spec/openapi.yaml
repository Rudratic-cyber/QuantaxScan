    SubmitProjectTlsBody:
      type: object
      properties:
        targets:
          type: array
          description: >-
            Hosts to open a real TLS connection to. A caller-named host that resolves to a
            loopback/private/link-local/other non-routable address is refused before any
            connection is attempted — see `TlsProbeSummary.targets[].outcome`.
          maxItems: 20
          items:
            type: object
            properties:
              host:
                type: string
                description: Hostname or IP literal. Never a URL — no scheme, path or credentials.
              port:
                type: integer
                minimum: 1
                maximum: 65535
            required:
              - host
              - port
      required:
        - targets

    TlsProbeSummary:
      type: object
      properties:
        projectId:
          type: integer
        targetsSubmitted:
          type: integer
        targetsProbed:
          type: integer
          description: >-
            How many targets completed a handshake. Zero means no collection run was recorded
            and the tls surface is still un-examined for this project.
        targets:
          type: array
          description: The per-target outcome — a submission of five hosts where three are refused and one times out must not collapse into a single number.
          items:
            type: object
            properties:
              host:
                type: string
              port:
                type: integer
              outcome:
                type: string
                description: >-
                  `refused` means the SSRF guard rejected the target before any connection was
                  attempted; `unreachable` means the guard allowed it but the handshake did not
                  complete (timeout, connection refused, TLS negotiation failure); `probed` means
                  a handshake completed. The specific refusal reason is deliberately not exposed
                  here — see `tls-ssrf-guard.ts` — the same posture `parseGithubUrl` takes with a
                  bare rejection.
                enum: [probed, refused, unreachable]
            required:
              - host
              - port
              - outcome
        collectionRunId:
          type: integer
          nullable: true
          description: Null when no run was recorded (`targetsProbed` is 0).
        assetsCreated:
          type: integer
        assetsUpdated:
          type: integer
        observationsCreated:
          type: integer
        assetsMarkedGone:
          type: integer
          description: >-
            Assets at a host:port this submission actually probed and no longer found there.
            Scoped to exactly the targets that completed a handshake in this submission.
        evidenceCaveat:
          type: string
          description: >-
            Stated in every response: this collector records the negotiated key-exchange
            algorithm/group and the peer certificate's public key type/size only — no
            certificate identity, chain or validity. It does not verify trust (certificates are
            not validated against any CA), because the point is to observe what a host actually
            negotiates, not whether a browser would accept it.
      required:
        - projectId
        - targetsSubmitted
        - targetsProbed
        - targets
        - collectionRunId
        - assetsCreated
        - assetsUpdated
        - observationsCreated
        - assetsMarkedGone
        - evidenceCaveat

    SubmitProjectProtocolConfigBody:
      type: object
      properties:
        files:
          type: array
          description: >-
            Configuration files, submitted as path + content — the same shape
            `POST /projects/{id}/dependencies` and `POST /projects/{id}/certificates` use. The
            path matters: the SSH and IPsec families are recognised by basename, so
            `/etc/ssh/sshd_config` is read and a copy renamed `sshd_config.bak.txt` is not.
            Anything unrecognised is ignored rather than rejected, so a caller may submit a
            whole tree.
          items:
            type: object
            properties:
              path:
                type: string
              content:
                type: string
            required:
              - path
              - content
      required:
        - files

    ProtocolConfigDeclaration:
      type: object
      description: One algorithm a configuration file declares, read verbatim from a named directive.
      properties:
        path:
          type: string
        format:
          type: string
          description: >-
            Which configuration format the file was read as — `sshd-config`, `ssh-config`,
            `authorized-keys`, `ipsec-config`, `jwks`, `oidc-discovery`, `saml-metadata`.
        directive:
          type: string
          description: The keyword or field the token was written under, e.g. `KexAlgorithms`, `alg`, `SignatureMethod`, `esp`.
        declaredValue:
          type: string
          description: The token exactly as the file wrote it, so a reader can go back to the line and check.
        algorithm:
          type: string
          description: Canonical name, resolving in the mappings data. A token with no canonical name produces no declaration at all.
        keySize:
          type: integer
          nullable: true
          description: >-
            The stated parameter size where the token names one (a curve, a MODP group, an AES
            width, a JWK modulus). Null means undetermined — an `ssh-rsa` authorized_keys entry
            does not state its modulus and this collector does not decode the blob to guess one.
        strength:
          type: string
          enum: [permitted, materialised]
          description: >-
            `permitted` — an algorithm the endpoint would accept if a peer asked, which it may
            never select. `materialised` — a specific key or a chosen algorithm that exists now.
            Priced into `confidence`, but reported separately because they are different claims.
        condition:
          type: string
          nullable: true
          description: The enclosing `Match`/`Host` block. Null when the directive applies unconditionally.
        confidence:
          type: number
          description: 0.6 for a permitted declaration, 0.8 for a materialised one — both well below an observed TLS handshake's 1.0.
      required:
        - path
        - format
        - directive
        - declaredValue
        - algorithm
        - keySize
        - strength
        - condition
        - confidence

    ProtocolConfigIngestSummary:
      type: object
      properties:
        projectId:
          type: integer
        configFilesRecognised:
          type: integer
          description: >-
            How many submitted files were a protocol configuration this collector understands.
            Zero means no collection run was recorded and the config surface is still
            un-examined for this project. A recognised file that declares nothing still counts
            here — it was examined.
        configFiles:
          type: array
          description: >-
            The recognised files, each with how many declarations it carried. A
            `declarationCount` of 0 is read-and-states-nothing, not unreadable.
          items:
            type: object
            properties:
              path:
                type: string
              format:
                type: string
              declarationCount:
                type: integer
            required:
              - path
              - format
              - declarationCount
        collectionRunId:
          type: integer
          nullable: true
          description: Null when no run was recorded (`configFilesRecognised` is 0).
        assetsCreated:
          type: integer
        assetsUpdated:
          type: integer
        observationsCreated:
          type: integer
        assetsMarkedGone:
          type: integer
          description: >-
            Declarations previously read from one of the files in this submission and no longer
            present in it — an administrator removed the directive. Scoped to exactly the files
            this submission read, so a file that was not submitted is untouched.
        declarations:
          type: array
          items:
            $ref: "#/components/schemas/ProtocolConfigDeclaration"
        evidenceCaveat:
          type: string
          description: >-
            Stated on every response: this collector reads what a configuration file declares,
            not what an endpoint negotiates; `Include` directives are not followed; the absence
            of a directive is not read as the compiled-in default; and an unrecognised token,
            including hybrid post-quantum key exchange, contributes nothing rather than a guess.
      required:
        - projectId
        - configFilesRecognised
        - configFiles
        - collectionRunId
        - assetsCreated
        - assetsUpdated
        - observationsCreated
        - assetsMarkedGone
        - declarations
        - evidenceCaveat

    VendorPqcRoadmapStatus:
      type: string
      description: >-
        How the vendor answered "do you have a post-quantum migration plan?". `none` is an
        answer — the vendor told us it has no plan. Not the same as `null`, which means the
        vendor has told us nothing.
      enum: [none, assessing, roadmap_published, migration_underway, pqc_available]

    VendorContractClause:
      type: string
      description: >-
        Whether the contract in force with this vendor obliges them to migrate. There is
        deliberately no `unknown` member: unknown is `null` on the stored column, i.e. nobody has
        read the contract. `absent` means somebody read it and there is no clause — a finding.
      enum: [present, absent, in_negotiation]

    VendorClauseState:
      type: string
      description: >-
        The four-state read of `contractPqcClause`. `unknown` is the null case promoted to a
        first-class value so a client cannot render "nobody has read the contract" as "there is
        no clause" — the two point in opposite directions and both are wrong to guess.
      enum: [present, absent, in_negotiation, unknown]

    VendorResponseState:
      type: string
      description: >-
        How much of the questionnaire the vendor has actually answered, derived from the answers
        themselves rather than from `respondedAt`, so a row cannot claim a response it does not
        contain. Only the vendor's own three answers count — the customer's contract filing does
        not make an unresponsive vendor look like it replied.
      enum: [awaiting_response, partial, answered]

    VendorReadinessState:
      type: string
      description: >-
        Exposure under one Q-Day scenario, against the date the vendor *claims*. `unknown` when
        no date was given — never `clear`.
      enum: [exposed, clear, unknown]

    VendorAttestation:
      type: object
      description: The provenance stamp that keeps a vendor's claim from being read as an observation (B9).
      properties:
        discoveryModality:
          type: string
          enum: [manual_attestation]
          description: >-
            Always `manual_attestation` — the SP 1800-38B §4.1.4 extension this project added for
            exactly this case. Nothing on this surface is observed.
        confidence:
          type: number
          nullable: true
          description: >-
            Below every collector's, and `null` rather than a floor value when the vendor has
            answered nothing at all: no claim exists, so there is nothing to be confident about.
            The scale's anchors are documented on `RawObservation.confidence` — regex is about
            0.7, a completed TLS handshake about 1.0.
        caveat:
          type: string
          description: The sentence a report must carry alongside any use of this vendor's answers.
      required:
        - discoveryModality
        - confidence
        - caveat

    VendorReadinessVerdict:
      type: object
      description: One Q-Day scenario's verdict against the date the vendor claims it will be post-quantum ready.
      properties:
        scenario:
          type: string
          enum: [conservative, central, aggressive]
        qDayYear:
          type: integer
        state:
          $ref: "#/components/schemas/VendorReadinessState"
        narrative:
          type: string
          description: >-
            Written in the vendor's voice ("the vendor states"), never the product's, so a board
            deck built from these sentences cannot launder a claim into a finding.
      required:
        - scenario
        - qDayYear
        - state
        - narrative

    VendorClauseAssessment:
      type: object
      description: >-
        The contractual lever — the only instrument a customer actually has over a vendor that is
        not moving.
      properties:
        state:
          $ref: "#/components/schemas/VendorClauseState"
        contractRenewalDate:
          type: string
          format: date-time
          nullable: true
        noLeverScheduled:
          type: boolean
          description: >-
            True only when a clause is known to be *missing* and no renewal is scheduled — no
            obligation, and no scheduled moment at which one could be created. False when the
            contract has merely not been read, because that is not a claim about the contract.
        narrative:
          type: string
      required:
        - state
        - contractRenewalDate
        - noLeverScheduled
        - narrative

    VendorPostureAssessment:
      type: object
      description: >-
        B9's payoff, computed fresh on every read so a corrected date or a revised Q-Day scenario
        needs no backfill. A vendor that has answered nothing is `awaiting_response` with a
        `null` confidence and an `unknown` verdict under every scenario — never `clear`.
      properties:
        responseState:
          $ref: "#/components/schemas/VendorResponseState"
        answeredQuestionCount:
          type: integer
        questionCount:
          type: integer
        respondedAt:
          type: string
          format: date-time
          nullable: true
        pqcRoadmapStatus:
          allOf:
            - $ref: "#/components/schemas/VendorPqcRoadmapStatus"
          nullable: true
        statedPqcReadyDate:
          type: string
          format: date-time
          nullable: true
        attestation:
          $ref: "#/components/schemas/VendorAttestation"
        verdicts:
          type: array
          items:
            $ref: "#/components/schemas/VendorReadinessVerdict"
        exposedScenarioCount:
          type: integer
        unknownScenarioCount:
          type: integer
        scenarioCount:
          type: integer
        clause:
          $ref: "#/components/schemas/VendorClauseAssessment"
        framing:
          type: string
          description: Mandatory framing for any customer-facing use of the scenario years.
      required:
        - responseState
        - answeredQuestionCount
        - questionCount
        - respondedAt
        - pqcRoadmapStatus
        - statedPqcReadyDate
        - attestation
        - verdicts
        - exposedScenarioCount
        - unknownScenarioCount
        - scenarioCount
        - clause
        - framing

    VendorAssessment:
      type: object
      description: >-
        A `vendor_assessments` row plus its computed posture — B9, the vendor/third-party
        register. docs/Claude/03-features.md §B9. Not an `Asset`: nothing here was collected, and
        a questionnaire answer is a claim by an interested party rather than an observation, so
        it carries no `fingerprint`/`surface`/observation lifecycle and does not count towards
        the D3 coverage meter.
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        vendorName:
          type: string
        productOrService:
          type: string
          nullable: true
        internalOwner:
          type: string
          nullable: true
          description: Free text — the internal team or person who owns the relationship, not necessarily an app user.
        questionnaireSentAt:
          type: string
          format: date-time
          nullable: true
          description: Null means the questionnaire has not been sent — a different state from sent and ignored.
        respondedAt:
          type: string
          format: date-time
          nullable: true
        pqcRoadmapStatus:
          allOf:
            - $ref: "#/components/schemas/VendorPqcRoadmapStatus"
          nullable: true
        statedPqcReadyDate:
          type: string
          format: date-time
          nullable: true
          description: The date the vendor *states* it will be post-quantum ready. A quote, not a verified commitment.
        cryptoDisclosed:
          type: string
          nullable: true
          description: Free-form, vendor-asserted description of the cryptography they use.
        contractPqcClause:
          allOf:
            - $ref: "#/components/schemas/VendorContractClause"
          nullable: true
          description: >-
            `absent` = the contract was read and has no PQC clause. `null` = nobody has read it.
            Rendering the second as the first invents a finding.
        contractRenewalDate:
          type: string
          format: date-time
          nullable: true
        attestationEvidence:
          type: string
          nullable: true
          description: Where the answers are recorded — a document reference, ticket or URL. Not fetched or validated.
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        posture:
          $ref: "#/components/schemas/VendorPostureAssessment"
      required:
        - id
        - organizationId
        - vendorName
        - productOrService
        - internalOwner
        - questionnaireSentAt
        - respondedAt
        - pqcRoadmapStatus
        - statedPqcReadyDate
        - cryptoDisclosed
        - contractPqcClause
        - contractRenewalDate
        - attestationEvidence
        - notes
        - createdAt
        - updatedAt
        - posture

    CreateVendorAssessmentBody:
      type: object
