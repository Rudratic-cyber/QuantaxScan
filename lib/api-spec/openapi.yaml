openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: QuantaXscan Post-Quantum Security Scanner API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project management
  - name: scans
    description: Security scanning
  - name: inventory
    description: Cryptographic inventory export (CBOM)
  - name: reports
    description: Shared report links
  - name: community
    description: Community hub
  - name: stats
    description: Platform statistics
  - name: demo
    description: Demo repositories
  - name: github
    description: GitHub repository scanning
  - name: inventory
    description: Estate-wide inventory exports and posture
  - name: chat
    description: AI assistant
  - name: ot-fleets
    description: Manual OT/embedded device fleet register (B8)

# Interim shared-key authentication (S1 / G-12). Applies to every operation
# unless overridden with `security: []`. This carries no per-user identity and
# no organisation scoping — see docs/Claude/08-security.md.
#
# Every operation can also answer 429 (S6). Budgets are per route and keyed on
# the API key, falling back to the client address on the public operations;
# `Retry-After` is always set. The store is in-process, so the documented
# allowance is per replica. See `components/responses/RateLimited`.
security:
  - apiKeyHeader: []
  - bearerApiKey: []

paths:
  /healthz:
    get:
      operationId: healthCheck
      security: []
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "204":
          description: Deleted

  /projects/{id}/findings:
    get:
      operationId: getProjectFindings
      tags: [projects]
      summary: Get every finding across every scan in a project
      description: >-
        Returns an empty array — not a 404 — for a project that has no scans, or one that
        belongs to another organisation, because the row-level security policies filter the
        scans before this handler sees them.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Project findings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Finding"
        "400":
          description: Invalid project ID

  /projects/{id}/coverage:
    get:
      operationId: getProjectCoverage
      tags: [projects]
      summary: Coverage and confidence meter for a project (D3)
      description: >-
        What has been examined, what has never been examined, and how sure the evidence is.
        A catalogue surface absent from `surfaces` has never been looked at — that absence is
        the machine-readable half of the answer, so callers must not treat the list as
        exhaustive of the estate. Not public: it describes an organisation's own estate.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Coverage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCoverage"
        "400":
          description: Invalid project ID
        "404":
          description: Not found

  /projects/{id}/dependencies:
    post:
      operationId: submitProjectDependencies
      tags: [projects]
      summary: Submit a project's lockfiles for dependency/SBOM collection (B2)
      description: >-
        Runs the dependency collector over the submitted files and persists what it finds as
        assets on the `dependency` surface, which is what makes that surface count as examined
        in `GET /projects/{id}/coverage`.


        Files are selected by basename, not by extension: `pnpm-lock.yaml`, `package-lock.json`,
        `npm-shrinkwrap.json`, `yarn.lock` and `requirements*.txt`. Anything else in `files` is
        ignored rather than rejected, so a caller may submit a whole tree.


        **If no submitted file is a recognised lockfile, no collection run is recorded** and
        `lockfilesRecognised` is 0. That is deliberate: writing a run would make the meter
        report the dependency surface as examined-and-empty, when the truth is that nothing
        readable was submitted. It is a 200, not an error — a repository legitimately may have
        no lockfile.


        A package that leaves a resubmitted lockfile marks its asset `gone`, scoped to the
        ecosystems this submission actually carried a lockfile for. Submitting only
        `requirements.txt` therefore never touches the project's npm assets.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProjectDependenciesBody"
      responses:
        "200":
          description: Collection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyIngestSummary"
        "400":
          description: Invalid project ID or body
        "404":
          description: Not found

  /ot-fleets:
    get:
      operationId: listOtFleets
      tags: [ot-fleets]
      summary: List this organisation's OT/embedded device fleets (B8)
      description: >-
        The manual register — every fleet a customer has recorded by hand, newest first. Each
        entry carries `exposure`, computed fresh on every read against the current Q-Day
        scenarios, so a scenario or date change is reflected without a backfill.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: OT fleets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OtFleet"
    post:
      operationId: createOtFleet
      tags: [ot-fleets]
      summary: Record a new device fleet (B8)
      description: >-
        A form submission, not a collector run: every field but `name` is optional, and an
        omitted field is stored as `null` — "not supplied" — rather than a guessed default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOtFleetBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "400":
          description: Invalid body
        "201":
          description: Created fleet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtFleet"

  /ot-fleets/{id}:
    get:
      operationId: getOtFleet
      tags: [ot-fleets]
      summary: Get one OT fleet by id (B8)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: OT fleet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtFleet"
        "400":
          description: Invalid fleet ID
        "404":
          description: Not found
    patch:
      operationId: updateOtFleet
      tags: [ot-fleets]
      summary: Update fields the customer has learned since the fleet was recorded (B8)
      description: >-
        Every field is optional and only the fields present in the body are changed — omitting a
        field leaves the stored value (including `null`) exactly as it was, it does not clear it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOtFleetBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Updated fleet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtFleet"
        "400":
          description: Invalid fleet ID or body
        "404":
          description: Not found
    delete:
      operationId: deleteOtFleet
      tags: [ot-fleets]
      summary: Remove a fleet from the register (B8)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "204":
          description: Deleted

  /inventory/timeline:
    get:
      operationId: getInventoryTimeline
      tags: [inventory]
      summary: Estate cryptographic posture over time (D7)
      description: >
        Observed history from real collection instants, plus a projected horizon and the
        obligation deadlines that fall in it. Observed points come only from instants at which a
        collection actually happened — the series is never resampled onto a regular grid,
        because that would draw a smooth trend on an estate that never changed. When fewer than
        two distinct instants exist, `observed.sufficientForTrend` is false and `reason` says so.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Posture timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostureTimeline"

  /inventory/cbom:
    get:
      operationId: getInventoryCbom
      tags: [inventory]
      summary: Export the cryptographic inventory as a CycloneDX 1.7 CBOM
      description: >-
        Served as `application/vnd.cyclonedx+json; version=1.7`, not `application/json`.
        Assets with status `gone` are excluded: a current-state inventory handed to an
        auditor must not list crypto that a later run proved absent. **Not public** — a CBOM
        is a complete map of an organisation's cryptographic weaknesses.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: CycloneDX 1.7 document
          content:
            application/vnd.cyclonedx+json; version=1.7:
              schema:
                $ref: "#/components/schemas/CbomDocument"

  /inventory/readiness:
    get:
      operationId: getInventoryReadiness
      tags: [inventory]
      summary: CISA quantum-readiness posture tracker (D1)
      description: >-
        Five sections tracking the named parts of the joint CISA/NSA/NIST quantum-readiness
        factsheet (August 2023), plus the estate-wide coverage meter the first section is
        defined against — bundled in one payload so the two cannot disagree. A section with
        no data source in this product (roadmap document attachment, the vendor register)
        reports `percentComplete: null` and `state: "not-tracked"`, never `0`. There is no
        combined/overall readiness score.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Readiness posture and estate coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessSummary"

  /inventory/assets:
    get:
      operationId: getInventoryAssets
      tags: [inventory]
      summary: Estate inventory table, PQC track and Mosca breach per asset (D1 Row 4)
      description: >-
        Present assets only (`status !== "gone"`), each carrying its resolved compliance
        track (post-quantum vs. classical hygiene — G-10) and which Q-Day scenarios it
        breaches. `statusCounts` covers every asset in the organisation regardless of status,
        `gone` included, so drift can be reported without listing removed assets as present.
      parameters:
        - name: surface
          in: query
          description: Filter to one collector surface, e.g. `certificate` for the cert-expiry panel.
          schema:
            type: string
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Enriched asset inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryAssetsSummary"

  /scans:
    post:
      operationId: createScan
      tags: [scans]
      summary: Start a new scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScanBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Scan initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"

  /scans/{id}:
    get:
      operationId: getScan
      tags: [scans]
      summary: Get scan results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: Not found

  /scans/{id}/findings:
    get:
      operationId: getScanFindings
      tags: [scans]
      summary: Get all findings for a scan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Scan findings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Finding"

  /scans/multi:
    post:
      operationId: createMultiScan
      tags: [scans]
      summary: Scan several files as one new project
      description: >-
        Creates a project, one scan row per file, and returns a project-level roll-up. The
        risk profile is computed over every finding in the submission — `worstFileRiskScore`
        is reported separately because the maximum of per-file scores cannot express a
        Mosca verdict over a whole body of data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiScanBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Multi-file scan summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiScanResult"
        "400":
          description: projectName and a non-empty files array are required

  /reports:
    post:
      operationId: createSharedReport
      tags: [reports]
      summary: Create a share link for a report
      description: >-
        `owner` is the GitHub repository owner, not a user. Responds 200, not 201. The
        created row is `visibility: public` and expires after `SHARE_LINK_TTL_DAYS`
        (default 365).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSharedReportBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Share link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSharedReportResponse"
        "400":
          description: owner, repo, repoUrl and data are required
        "500":
          description: Failed to save report

  /reports/{id}:
    get:
      operationId: getSharedReport
      security: []
      tags: [reports]
      summary: Read a shared report by its link id
      description: >-
        Public by link, which is why the id is a 128-bit random base64url string and **not**
        an integer. Revoked, expired and private rows are invisible to this route because
        the rule lives in the `shared_reports` policy rather than in a where clause — all
        three are indistinguishable from a link that never existed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: The shared report row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedReport"
        "404":
          description: Not found, revoked, expired or private
        "500":
          description: Failed to fetch report

  /chat:
    post:
      operationId: createChatCompletion
      tags: [chat]
      summary: Stream an AI answer about a scan
      description: >-
        Responds with `text/event-stream`, not JSON: a sequence of `data:` frames carrying
        `{"content":"..."}` and a final `{"done":true}`. An unconfigured or failing OpenAI
        integration still streams 200 with the error as a content frame, so a non-200 here
        means the request was rejected, not that the model failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request

  /community/posts:
    get:
      operationId: listCommunityPosts
      security: []
      tags: [community]
      summary: List community posts
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [article, question, migration-story, all]
        - name: language
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Community posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityPost"
    post:
      operationId: createCommunityPost
      tags: [community]
      summary: Create a community post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommunityPostBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPost"

  /community/posts/{id}/vote:
    post:
      operationId: voteCommunityPost
      tags: [community]
      summary: Vote on a community post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPost"

  /community/leaderboard:
    get:
      operationId: getLeaderboard
      security: []
      tags: [community]
      summary: Get top contributors leaderboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /stats:
    get:
      operationId: getGlobalStats
      tags: [stats]
      summary: Get global platform statistics
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Global stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalStats"

  /demo/repos:
    get:
      operationId: listDemoRepos
      security: []
      tags: [demo]
      summary: List available demo repositories
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Demo repos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoRepo"

  /demo/repos/{slug}/scan:
    post:
      operationId: runDemoScan
      security: []
      tags: [demo]
      summary: Run a scan on a demo repository
      description: >-
        Hard-coded repositories, scanned in memory. Nothing is written to the database, so
        `id` and `projectId` are both `-1` and there is no scan row to fetch afterwards.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Demo scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoScanResult"
        "404":
          description: Demo repo not found

  /github/scan:
    post:
      operationId: scanGithubRepo
      tags: [github]
      summary: Scan a public GitHub repository for quantum vulnerabilities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubScanBody"
      responses:
        "200":
          description: GitHub scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubScanResult"
        "400":
          description: Invalid URL
        "404":
          description: Repository not found
        "429":
          description: >-
            Rate limited. Either this server's own per-route budget (S6) or GitHub's
            upstream quota; `Retry-After` is set in both cases.

  /github/rate-limit:
    get:
      operationId: getGithubRateLimit
      tags: [github]
      summary: Remaining GitHub API quota
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Rate limit status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubRateLimit"
        "502":
          description: Could not reach GitHub API

  /github/fetch:
    post:
      operationId: fetchGithubRepo
      tags: [github]
      summary: Phase 1 — fetch a repository tree and the scannable file contents
      description: >-
        Fetches without scanning, so a client can render the tree while the scan runs.
        `fetchedFiles` is capped at 25 files of at most 150 kB each and truncated to 300
        lines, so it is a subset of `fullTree` by design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubScanBody"
      responses:
        "200":
          description: Repository tree and file contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubFetchResult"
        "400":
          description: Invalid URL
        "404":
          description: Repository not found
        "429":
          description: >-
            Rate limited. Either this server's own per-route budget (S6) or GitHub's
            upstream quota; `Retry-After` is set in both cases.
        "502":
          description: GitHub API unreachable

  /github/scan-files:
    post:
      operationId: scanGithubFiles
      tags: [github]
      summary: Phase 2 — scan already-fetched files, with no GitHub API calls
      description: >-
        `repoUrl`, `owner` and `repo` are echoed straight back into the response without
        validation; only `files` is checked. They are required here so that a conforming
        client always receives them in the result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubScanFilesBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubScanResult"
        "400":
          description: files array is required


  /projects/{id}/certificates:
    post:
      operationId: submitProjectCertificates
      tags: [projects]
      summary: Submit certificates for X.509 collection (B4)
      description: >-
        Runs the certificate collector over the submitted PEM/DER files and persists what it
        finds as assets on the `certificate` surface, which is what makes that surface count
        as examined in `GET /projects/{id}/coverage`.


        `content` is PEM text (one or more concatenated `-----BEGIN/END CERTIFICATE-----`
        blocks — a full chain is read entirely, not just its leaf) or base64-encoded DER.
        A file that is neither contributes nothing, silently.


        **If no submitted file contains a parseable certificate, no collection run is
        recorded** and `certificatesRecognised` is 0 — the same "examined nothing, not
        found nothing" distinction `POST /projects/{id}/dependencies` makes, and it is a 200,
        not an error.


        Each returned certificate carries `qDay`: whether its `notAfter` falls on or after
        each Q-Day scenario's year, derived fresh on every call rather than stored — see
        `GET /projects/{id}/certificates` for the persisted-inventory read this backs.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProjectCertificatesBody"
      responses:
        "200":
          description: Collection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIngestSummary"
        "400":
          description: Invalid project ID, body, or too many certificates in one submission
        "404":
          description: Not found
    get:
      operationId: getProjectCertificates
      tags: [projects]
      summary: The project's certificate inventory, evaluated against Q-Day (B4)
      description: >-
        Every certificate asset attributed to this project, each evaluated against every
        Q-Day scenario at read time — never persisted, because Q-Day scenarios are
        customer-overridable (see `lib/risk`) and a stored verdict would go stale exactly the
        way C1 exists to prevent. Includes assets of every lifecycle status, not only
        `active`; a report of what was found must keep what was later remediated or waived
        in the record.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Certificate inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCertificates"
        "400":
          description: Invalid project ID
        "404":
          description: Not found

  /projects/{id}/tls:
    post:
      operationId: submitProjectTls
      tags: [projects]
      summary: Probe a project's hosts for the TLS handshake they actually negotiate (B3)
      description: >-
        Opens a real TLS connection to each submitted `host`/`port` and records what was
        *negotiated* — cipher suite, key-exchange group, protocol version, and the peer
        certificate's public key type/size — not what a config file claims. Persists what it
        finds as assets on the `tls` surface, which is what makes that surface count as
        examined in `GET /projects/{id}/coverage`.


        A caller-supplied host is refused before any connection is attempted if it resolves to
        a loopback, private, link-local (including the cloud metadata service) or otherwise
        non-routable address. The refusal reason is not detailed in the response — only
        `refused`, distinguished from a target that was reachable in principle but did not
        answer (`unreachable`) or one that completed a handshake (`probed`).


        **If no target's handshake completes, no collection run is recorded** and
        `targetsProbed` is 0 — the same honesty rule `POST /projects/{id}/dependencies` applies
        for `lockfilesRecognised: 0`. It is a 200, not an error: every target may legitimately
        be unreachable or filtered.


        A host that no longer answers on a resubmission marks its assets `gone`, scoped to
        exactly the targets that were actually probed in this submission — a target refused by
        the guard or that timed out was not observed and does not affect any other target's
        assets.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProjectTlsBody"
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsProbeSummary"
        "400":
          description: Invalid project ID or body
        "404":
          description: Not found

  /projects/{id}/protocol-config:
    post:
      operationId: submitProjectProtocolConfig
      tags: [projects]
      summary: Read the crypto a project's protocol configuration declares (B6)
      description: >-
        Parses submitted SSH (`sshd_config`, `ssh_config`, `authorized_keys`), IPsec/IKE
        (`ipsec.conf`, `swanctl.conf`), JOSE (a JWKS, an OpenID Connect discovery document)
        and SAML metadata files, and persists the algorithms they *declare* as assets on the
        `config` surface — which is what makes that surface count as examined in
        `GET /projects/{id}/coverage`.


        **A declaration is not a negotiation.** This route records what a file states, at
        `configuration_information` modality and a confidence well below `POST
        /projects/{id}/tls`'s observed handshake: a `Ciphers` list is an upper bound on what a
        daemon will accept, not evidence any peer selected an entry from it. Each declaration
        carries a `strength` — `permitted` (an algorithm the endpoint would accept) or
        `materialised` (a specific key or a chosen algorithm, such as an `authorized_keys`
        entry or a published JWK) — because those are different claims.


        The SSH and IPsec families are recognised by filename (including `sshd_config.d/`
        drop-ins); JOSE and SAML files have no conventional filename and are recognised by an
        unambiguous structural marker instead (a `keys` array of JWKs, an
        `*_alg_values_supported` field, an `EntityDescriptor` element).


        **If no submitted file is a configuration this collector understands, no collection run
        is recorded** and `configFilesRecognised` is 0 — the same "examined nothing, not found
        nothing" distinction `POST /projects/{id}/dependencies` makes, and it is a 200, not an
        error. A recognised file that declares no crypto is the *other* case and **does** record
        a run: it was read, and it states nothing. Removing a directive and resubmitting the
        file marks its assets `gone`, scoped to exactly the files this submission read.


        Three deliberate silences, all restated in `evidenceCaveat`: `Include` directives are
        not followed (the caller submits contents, not a filesystem); the absence of a directive
        is not read as the compiled-in default; and an algorithm token with no canonical name —
        including hybrid post-quantum key exchange such as `sntrup761x25519-sha512` — produces
        no declaration rather than a guess.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProjectProtocolConfigBody"
      responses:
        "200":
          description: Collection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolConfigIngestSummary"
        "400":
          description: Invalid project ID, body, or too many configuration files in one submission
        "404":
          description: Not found

  /vendor-assessments:
    get:
      operationId: listVendorAssessments
      tags: [vendor-assessments]
      summary: List this organisation's vendor / third-party assessments (B9)
      description: >-
        The vendor register — every supplier a customer has recorded, newest first. Each entry
        carries `posture`, computed fresh on every read: the `manual_attestation` stamp and its
        confidence, the Q-Day verdicts against the date the vendor *claims* it will be
        post-quantum ready, and the contract-clause reading. Nothing here was observed by a
        collector.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Vendor assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorAssessment"
    post:
      operationId: createVendorAssessment
      tags: [vendor-assessments]
      summary: Record a vendor assessment (B9)
      description: >-
        A form submission, not a collector run: every field but `vendorName` is optional, and an
        omitted field is stored as `null` — "not supplied" — rather than a guessed default. A
        vendor recorded with nothing else reads as awaiting a response, never as compliant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorAssessmentBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "400":
          description: Invalid body
        "201":
          description: Created vendor assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorAssessment"

  /vendor-assessments/{id}:
    get:
      operationId: getVendorAssessment
      tags: [vendor-assessments]
      summary: Get one vendor assessment by id (B9)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Vendor assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorAssessment"
        "400":
          description: Invalid vendor assessment ID
        "404":
          description: Not found
    patch:
      operationId: updateVendorAssessment
      tags: [vendor-assessments]
      summary: Update fields as a questionnaire comes back or a contract is read (B9)
      description: >-
        Every field is optional and only the fields present in the body are changed — omitting a
        field leaves the stored value (including `null`) exactly as it was, it does not clear it.
        Sending an explicit `null` does clear it, which is how a `contractPqcClause` of `absent`
        that turned out to be a misreading is withdrawn back to "nobody has checked" rather than
        to the opposite finding.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVendorAssessmentBody"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Updated vendor assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorAssessment"
        "400":
          description: Invalid vendor assessment ID or body
        "404":
          description: Not found
    delete:
      operationId: deleteVendorAssessment
      tags: [vendor-assessments]
      summary: Remove a vendor from the register (B9)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "204":
          description: Deleted

  /projects/{id}/kms:
    post:
      operationId: submitProjectKms
      tags: [projects]
      summary: Submit a managed key-store inventory for collection (B5)
      description: >-
        Classifies the keys a managed key store holds — HashiCorp Vault, AWS KMS, Azure Key
        Vault, GCP KMS — and persists what it finds as assets on the `kms` surface, which is
        what makes that surface count as examined in `GET /projects/{id}/coverage`.


        **This is a submission route, not a credentialed poller.** You send the key inventory
        your own tooling already produced; no credential for the key store ever reaches this
        product, and nothing here connects to a cloud provider. The corollary is stated in
        every response's `evidenceCaveat`: the export is taken at its word, and nothing proves
        it is complete, current, or from the key store you say it is.


        Each key's provider-native spec string is resolved against the cited table in
        `docs/Claude/mappings/kms-key-specs.json`. A spec whose primitive this product does
        not report on (HMAC, ChaCha20-Poly1305, SM2, any post-quantum parameter set, Azure's
        `kty: oct`) yields no asset and is returned with `outcome: no-algorithm` and the
        table's own reason — never the nearest similar algorithm.


        **A submission whose keys are all unclassified still records a collection run.** That
        is the one place this route's honesty rule differs from
        `POST /projects/{id}/dependencies`: a key store holding only symmetric keys was
        genuinely examined, and reporting it as un-examined would be the false statement. Only
        an empty `keys` array records no run.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProjectKmsBody"
      responses:
        "200":
          description: Collection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsIngestSummary"
        "400":
          description: Invalid project ID, body, or too many keys in one submission
        "404":
          description: Not found
    get:
      operationId: getProjectKmsKeys
      tags: [projects]
      summary: The project's managed key inventory, including rotation posture (B5)
      description: >-
        Every KMS key asset attributed to this project. This is the read that answers "what
        does the inventory say", as opposed to the POST response, which only reports what one
        submission found at the moment it was submitted.


        It exists as its own route rather than leaning on `GET /inventory/assets` because that
        endpoint does not return `locationDetail`, and everything specific to a key store —
        provider, key id, spec, rotation state, origin, key store — lives there. Includes
        assets of every lifecycle status, not only `active`.


        `rotationEnabled` is null when the submitted export did not state it. That is not the
        same fact as rotation being off, and the two are never collapsed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: KMS key inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectKmsKeys"
        "400":
          description: Invalid project ID
        "404":
          description: Not found

  /projects/{id}/data-at-rest:
    post:
      operationId: submitProjectDataAtRest
      tags: [projects]
      summary: Submit a description of encrypted stores for data-at-rest collection (B7)
      description: >-
        Records what a database, backup, archive, volume or object store reports about its
        own encryption, and persists it as assets on the `data-at-rest` surface — which is
        what makes that surface count as examined in `GET /projects/{id}/coverage`.


        Nothing is connected to. The caller submits what their engine's configuration
        already reports (`pg_settings`, `sys.dm_database_encryption_keys`,
        `V$ENCRYPTED_TABLESPACES`, a bucket's SSE configuration, a backup job definition).
        Credentialed collection against a live database is deliberately not offered: it
        would need a secret-handling design this product does not have yet (F4).


        **Each store produces up to two assets, not one.** `dataEncryption` is the bulk
        cipher over the stored data — usually AES, which NIST does not consider
        quantum-vulnerable. `keyProtection` is how that data key is wrapped, and that is
        where Shor applies: an AES-256 store whose key is wrapped with RSA-2048 is a
        harvest-now-decrypt-later target however strong the bulk cipher is.


        **A store reported as encrypted with no cipher named records nothing and is
        returned as a `cipher-not-reported` gap.** It never becomes AES-256. That case is
        also excluded from the reobservation scope, so leaving the field blank on a
        resubmission cannot mark a previously recorded cipher `gone`.


        `dataClassification` / `secrecyLifetimeYears` are persisted on the store's assets
        and are what `GET /api/inventory/assets` resolves X from. Omit them and X falls
        back to the project's default and then the product's, flagged as assumed — see
        `classificationSource` on the read below.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProjectDataAtRestBody"
      responses:
        "200":
          description: Collection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataAtRestIngestSummary"
        "400":
          description: Invalid project ID, body, or too many stores in one submission
        "404":
          description: Not found
    get:
      operationId: getProjectDataAtRest
      tags: [projects]
      summary: The project's data-at-rest inventory with its Mosca verdict (B7)
      description: >-
        Every data-at-rest asset attributed to this project, grouped back into the store it
        belongs to, with X resolved and Mosca evaluated at read time — never persisted,
        because the Q-Day scenario years and the standards data behind `quantumVulnerable`
        are both revisable and a stored verdict would go stale exactly the way C1 exists to
        prevent.


        `xAssumed` and `classificationSource` are the honesty half: a store nobody
        classified is reported with the product's default X and says so, rather than
        quietly presenting an assumption as a measurement.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Data-at-rest inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDataAtRest"
        "400":
          description: Invalid project ID
        "404":
          description: Not found
components:
  responses:
    RateLimited:
      description: >-
        Rate limited (S6). The budget depends on the route: GitHub-facing scans,
        local scans, chat and everything else have separate allowances, and the
        health check is exempt. Buckets are keyed on the API key where one is
        presented and on the client address otherwise, so the response is
        identical whether or not the key was valid. `Retry-After` carries the
        number of seconds until the window resets.
      headers:
        Retry-After:
          description: Seconds until the caller may retry.
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
            required:
              - error

  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: Shared API key. Interim control pending per-user auth (F1).
    bearerApiKey:
      type: http
      scheme: bearer
      description: "The same shared API key, sent as `Authorization: Bearer <key>`."

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Project:
      type: object
      description: A `projects` row, exactly as the database holds it.
      properties:
        id:
          type: integer
        organizationId:
          type: integer
          description: >-
            The owning tenant (P1). Isolation is enforced by the row-level security
            policies, never by a where clause, so this is a fact about the row rather
            than a filter a caller may supply.
        name:
          type: string
        description:
          type: string
          nullable: true
        language:
          type: string
        riskScore:
          type: integer
          nullable: true
        lastScanAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        totalScans:
          type: integer
        criticalCount:
          type: integer
        alertCount:
          type: integer
        cleanCount:
          type: integer
        dataClassification:
          allOf:
            - $ref: "#/components/schemas/DataClassification"
          nullable: true
          description: >-
            A3 — the project-level classification every asset inherits unless it overrides
            it. **Nullable with no default, and the null is load-bearing:** it means the
            project sets no default, which is not the same statement as a human choosing
            `internal`. Only the first may be reported as an assumption, so a client must
            distinguish null from a value rather than substituting one.
        secrecyLifetimeYears:
          type: integer
          nullable: true
          description: >-
            A3 — the project-level X (secrecy lifetime) in years, set independently of the
            label. Null for the same reason as `dataClassification`: nobody has said.
      required:
        - id
        - organizationId
        - name
        - language
        - createdAt
        - totalScans
        - criticalCount
        - alertCount
        - cleanCount
        - dataClassification
        - secrecyLifetimeYears

    DataClassification:
      type: string
      description: A3's classification vocabulary, ordered least- to most-sensitive.
      enum: [public, internal, confidential, regulated, indefinite]

    CreateProjectBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        language:
          type: string
        code:
          type: string
      required:
        - name
        - language
        - code

    Scan:
      type: object
      description: >-
        A `scans` row plus the three derived A4 blocks. `pqc`, `hygiene` and `mosca` are
        recomputed from the findings on every read and never stored, so a mappings-data or
        Q-Day-scenario change reaches historical scans without a backfill.
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        projectId:
          type: integer
        mode:
          type: string
          enum: [scan-only, interactive, proactive, community]
        status:
          type: string
          enum: [pending, running, completed, failed]
        riskScore:
          type: integer
          nullable: true
        totalLines:
          type: integer
        criticalCount:
          type: integer
        alertCount:
          type: integer
        cleanCount:
          type: integer
        totalEffortHours:
          type: number
        estimatedCost:
          type: integer
        executiveSummary:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
          description: The submitted source, as persisted on the row. Null on rows written before it was captured.
        language:
          type: string
          nullable: true
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        pqc:
          $ref: "#/components/schemas/PqcExposure"
        hygiene:
          $ref: "#/components/schemas/HygieneSummary"
        mosca:
          $ref: "#/components/schemas/MoscaAssessment"
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - organizationId
        - projectId
        - mode
        - status
        - totalLines
        - criticalCount
        - alertCount
        - cleanCount
        - totalEffortHours
        - estimatedCost
        - pqc
        - hygiene
        - mosca
        - createdAt

    SubmitProjectDependenciesBody:
      type: object
      properties:
        files:
          type: array
          description: >-
            Repository files. Only recognised lockfiles are read; everything else is ignored.
            `content` is the file verbatim — truncating a lockfile silently drops packages, so
            callers must not send an excerpt.
          items:
            type: object
            properties:
              path:
                type: string
              content:
                type: string
            required:
              - path
              - content
      required:
        - files

    DependencyIngestSummary:
      type: object
      properties:
        projectId:
          type: integer
        lockfilesRecognised:
          type: integer
          description: >-
            How many submitted files the collector could read. Zero means no collection run was
            recorded and the dependency surface is still un-examined for this project.
        lockfiles:
          type: array
          description: The recognised lockfiles and which format each was read as.
          items:
            type: object
            properties:
              path:
                type: string
              kind:
                type: string
                enum: [pnpm-lock, npm-lock, yarn-lock, pip-requirements]
            required:
              - path
              - kind
        collectionRunId:
          type: integer
          nullable: true
          description: Null when no run was recorded (`lockfilesRecognised` is 0).
        assetsCreated:
          type: integer
        assetsUpdated:
          type: integer
        observationsCreated:
          type: integer
        assetsMarkedGone:
          type: integer
          description: >-
            Assets whose package is no longer in a resubmitted lockfile. Scoped to the
            ecosystems this submission carried a lockfile for.
        evidenceCaveat:
          type: string
          description: >-
            Stated in every response rather than left to the client: a lockfile records the
            fully resolved dependency graph, so a match may be a transitive dependency of the
            toolchain rather than a library the project's own code calls.
      required:
        - projectId
        - lockfilesRecognised
        - lockfiles
        - collectionRunId
        - assetsCreated
        - assetsUpdated
        - observationsCreated
        - assetsMarkedGone
        - evidenceCaveat

    OtExposureState:
      type: string
      description: >-
        `unknown` is distinct from `clear` — no recorded procurement date means nobody has
        asserted a replacement is coming, which must never be read as safe.
      enum: [exposed, clear, unknown]

    OtExposureVerdict:
      type: object
      description: One Q-Day scenario's exposure verdict for a fleet's next procurement date.
      properties:
        scenario:
          type: string
          enum: [conservative, central, aggressive]
        qDayYear:
          type: integer
        state:
          $ref: "#/components/schemas/OtExposureState"
        narrative:
          type: string
          description: The board-deck sentence — names the date and the scenario, not just the verdict.
      required:
        - scenario
        - qDayYear
        - state
        - narrative

    OtExposureAssessment:
      type: object
      description: >-
        B8's payoff: whether this fleet's next procurement decision falls after each Q-Day
        scenario's year, computed fresh on every read so a scenario change never needs a
        backfill. A fleet with no recorded procurement date is `unknown` under every scenario,
        never `clear`.
      properties:
        nextProcurementDate:
          type: string
          format: date-time
          nullable: true
        verdicts:
          type: array
          items:
            $ref: "#/components/schemas/OtExposureVerdict"
        exposedScenarioCount:
          type: integer
        unknownScenarioCount:
          type: integer
        scenarioCount:
          type: integer
        framing:
          type: string
          description: Mandatory framing for any customer-facing use of the scenario years.
      required:
        - nextProcurementDate
        - verdicts
        - exposedScenarioCount
        - unknownScenarioCount
        - scenarioCount
        - framing

    OtFleet:
      type: object
      description: >-
        An `ot_fleets` row plus its computed exposure — B8, the manual OT/embedded register.
        docs/Claude/03-features.md §B8. Not an `Asset`: nothing here is collected, a human enters
        and edits it by hand, and it carries no `fingerprint`/`surface`/observation lifecycle.
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        name:
          type: string
        vendor:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        deviceCount:
          type: integer
          nullable: true
          description: Null means nobody has counted yet — distinct from a recorded zero.
        site:
          type: string
          nullable: true
        owner:
          type: string
          nullable: true
          description: Free text — a team, role or vendor contact, not necessarily an app user.
        cryptoInUse:
          type: string
          nullable: true
          description: Free-form, customer-asserted description of the cryptography in use.
        refreshCycleYears:
