name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers & OS dependencies
        run: npx playwright install --with-deps chromium

      - name: "Typecheck"
        # Blocking. The pre-existing baseline this used to tolerate (14 in api-server, 13 in the
        # frontend) is fixed, and the whole tree is clean — so any error here is new. Kept in sync
        # with scripts/ci-local.sh, which is the gate this project actually relies on.
        run: pnpm run typecheck

      - name: Build packages & applications
        # Bypasses the typecheck script gate to build dist outputs directly
        run: pnpm -r --if-present run build

      - name: Run Library Unit Test Suites
        run: pnpm run test:libs

      - name: Run API Feature Test Suite
        run: pnpm run test:api

      - name: Run Scripts Test Suite
        run: pnpm run test:scripts

      # G-14 — the standards re-verification trigger. Offline date comparison, not a network
      # fetch: several primary sources return HTTP 403 to automated requests (G-01), so a
      # network check would fail for reasons unrelated to staleness and be muted within a week.
      - name: Check standards data freshness
        run: pnpm run check:standards
        env:
          QUANTAXSCAN_API_KEYS: "test-api-key-1234567890-super-secret-key-32bytes"
          DATABASE_URL: "postgres://dummy:dummy@localhost:5432/dummy"

      - name: Run UI Journey Test Suite (Playwright)
        run: pnpm run test:ui
        env:
          CI: true

      - name: Upload Playwright report & traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
